<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06070C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SAKUYA KIT DEMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 本番では https://cdn.jsdelivr.net/gh/naonao1971/sakuya-kit@0.1.0/kit.css -->
  <link rel="stylesheet" href="../kit.css" />
  <!-- タイトル固有の色だけここで上書きしてよい（部品の寸法・配置は触らない）
  <style>:root { --magenta: #3BD1FF; }</style> -->
</head>
<body>
  <div class="sk-wrap">
    <canvas id="game" width="960" height="540" aria-label="ゲーム画面"></canvas>
  </div>

  <script type="module">
    // 本番では https://cdn.jsdelivr.net/gh/naonao1971/sakuya-kit@0.1.0/kit.js
    import { createKit } from "../kit.js";

    // ===== ここから下がタイトル固有の中身 =====
    // 例: 30秒のあいだ浮遊するCNPを集める。岩に当たるとHPが減る。
    const W = 960, H = 540;
    const game = {
      ship: { x: 120, y: H / 2, vx: 0, vy: 0, r: 12, hp: 3, inv: 0 },
      items: [],
      rocks: [],
      timer: 0,
      score: 0,
      rescued: new Set(),
      dash: 0,
    };
    const DURATION = 30 * 60;

    function reset() {
      Object.assign(game.ship, { x: 120, y: H / 2, vx: 0, vy: 0, hp: 3, inv: 0 });
      game.items.length = 0;
      game.rocks.length = 0;
      game.timer = 0;
      game.score = 0;
      game.rescued.clear();
      game.dash = 0;
    }

    const kit = createKit({
      gameId: "demo",
      title: "SAKUYA KIT DEMO",
      subtitle: "- CATCH THE CNP -",
      gasUrl: "", // 共通GASのURL（gas/apps-script.gs）
      cnp: true,
      controls: {
        stick: true,
        gyro: true,
        buttons: [
          { id: "dash", label: "X", ariaLabel: "ダッシュ", keys: ["KeyX", "Space"], primary: true,
            onPress: () => { game.dash = 20; kit.sfx.shot(); } },
        ],
      },
      share: {
        when: "clear",
        text: (r) => `SAKUYA KIT DEMO をクリア！\nスコア ${r.score}\n救出 ${r.rescued.length}/11`,
      },
      help: { pc: "矢印/WASDで移動、Xでダッシュ（Pキーで一時停止）" },

      // CLEAR / GAME OVER の演出動画（パスはタイトル側の置き場所）。無ければ省略してよく、
      // そのときはジングルと文字だけの結果画面になる。image は動画を流し終えた後の静止画
      cutscenes: {
        // clear: { src: "clear.mp4", image: "clear.png" },
        // gameOver: { src: "gameover.mp4" },
      },
      // 結果画面は kit が共通の見た目で描く。救出ロスター等は decorate で足す
      resultScreen: {
        decorate(ctx, { kind, rect, result }) {
          if (kind !== "clear") return;
          ctx.font = kit.retro.fontBody(14);
          ctx.fillStyle = kit.retro.colors.ink;
          ctx.fillText(`救出 ${result.rescued.length}/11`, 480, (rect ? rect.y + rect.h : 240) + 100);
        },
      },

      onStart: reset,

      update(k) {
        const s = game.ship;
        const a = k.input.axis();
        const thrust = game.dash > 0 ? 0.9 : 0.4;
        if (game.dash > 0) game.dash--;
        s.vx = (s.vx + a.x * thrust) * 0.9;
        s.vy = (s.vy + a.y * thrust) * 0.9;
        s.x = Math.max(s.r, Math.min(W - s.r, s.x + s.vx));
        s.y = Math.max(s.r, Math.min(H - s.r, s.y + s.vy));
        if (s.inv > 0) s.inv--;

        if (Math.random() < 0.02) {
          const ch = k.cnp.chars[Math.floor(Math.random() * k.cnp.chars.length)];
          game.items.push({ ch, x: W + 30, y: 60 + Math.random() * (H - 120), t: Math.random() * 6 });
        }
        if (Math.random() < 0.025) {
          game.rocks.push({ x: W + 20, y: Math.random() * H, r: 12 + Math.random() * 16, v: 2 + Math.random() * 3 });
        }
        for (const it of game.items) { it.x -= 2; it.t += 0.05; }
        for (const r of game.rocks) r.x -= r.v;

        game.items = game.items.filter((it) => {
          const y = it.y + Math.sin(it.t) * 12;
          if (Math.hypot(it.x - s.x, y - s.y) < 30) {
            game.score += 100;
            game.rescued.add(it.ch.no);
            k.sfx.pickup();
            return false;
          }
          return it.x > -40;
        });
        game.rocks = game.rocks.filter((r) => {
          if (s.inv === 0 && Math.hypot(r.x - s.x, r.y - s.y) < r.r + s.r) {
            s.hp--;
            s.inv = 60;
            k.sfx.hit();
          }
          return r.x > -40;
        });

        game.timer++;
        if (s.hp <= 0) k.gameOver({ score: game.score, cleared: false, rescued: [...game.rescued] });
        else if (game.timer >= DURATION) {
          game.score += s.hp * 500;
          k.gameOver({ score: game.score, cleared: true, rescued: [...game.rescued] });
        }
      },

      render(ctx, k) {
        const { colors } = k.retro;
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, W, H);
        k.retro.crt();

        if (k.phase === "title") {
          k.retro.titleText("SAKUYA KIT DEMO", "- CATCH THE CNP -");
          k.cnp.chars.forEach((ch, i) => k.cnp.draw(ctx, ch, 130 + i * 70, H / 2, 56));
          return;
        }

        for (const it of game.items) k.cnp.draw(ctx, it.ch, it.x, it.y + Math.sin(it.t) * 12, 48);
        ctx.fillStyle = k.retro.alpha(colors.ink, 0.35);
        for (const r of game.rocks) { ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.fill(); }

        const s = game.ship;
        if (!(s.inv > 0 && k.frame % 8 < 4)) {
          ctx.fillStyle = colors.magenta;
          ctx.beginPath();
          ctx.moveTo(s.x + 16, s.y);
          ctx.lineTo(s.x - 12, s.y - 10);
          ctx.lineTo(s.x - 12, s.y + 10);
          ctx.fill();
        }

        ctx.font = k.retro.font(14);
        ctx.fillStyle = colors.gold;
        ctx.textAlign = "left";
        ctx.fillText(`SCORE ${game.score}`, 16, 30);
        ctx.textAlign = "right";
        ctx.fillText(`TIME ${Math.max(0, Math.ceil((DURATION - game.timer) / 60))}`, W - 16, 30);
        ctx.fillText("♥".repeat(Math.max(0, s.hp)), W - 16, 54);

      },
    });
    window.kit = kit; // デバッグ用
  </script>
</body>
</html>
