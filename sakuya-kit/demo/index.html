  <link rel="stylesheet" href="../kit.css" />
  <!-- タイトル固有の色だけここで上書きしてよい（部品の寸法・配置は触らない）
  <style>:root { --magenta: #3BD1FF; }</style> -->
</head>
<body>
  <div class="sk-wrap">
    <canvas id="game" width="960" height="540" aria-label="ゲーム画面"></canvas>
  </div>

  <script type="module">
    // 本番では https://cdn.jsdelivr.net/gh/naonao1971/sakuya-kit@0.1.0/kit.js
    import { createKit } from "../kit.js";

    // ===== ここから下がタイトル固有の中身 =====
    // 例: 30秒のあいだ浮遊するCNPを集めて、岩を撃ち落とす。燃料が尽きるか残機が無くなると終わり。
    // スコア・残機・CNPの回収・HUD・自動連射は kit の部品を使っている。
    const W = 960, H = 540;
    const DURATION = 30 * 60;
    const game = { ship: null, items: [], rocks: [], shots: [], timer: 0, fuel: 100, dash: 0 };

    function newShip() {
      const cp = kit.checkpoint.value || { x: 120, y: H / 2 };
      return { x: cp.x, y: cp.y, vx: 0, vy: 0, r: 12, inv: 90 };
    }
    function reset() {
      game.items.length = 0;
      game.rocks.length = 0;
      game.shots.length = 0;
      game.timer = 0;
      game.fuel = 100;
      game.dash = 0;
      game.ship = newShip();
    }

    const kit = createKit({
      gameId: "demo",
      title: "SAKUYA KIT DEMO",
      subtitle: "- CATCH THE CNP -",
      gasUrl: "", // 共通GASのURL（gas/apps-script.gs）
      maxScore: 99999, // これを超える記録は登録させない（GAS の _games のスコア上限と同じ値にする）
      cnp: true,
      lives: { start: 3, extendEvery: 3000 }, // 3000点ごとに1UP
      controls: {
        stick: true,
        // 傾き操作を使うタイトルだけ有効にする（既定は使わない）
        //   gyro: true                        … スタート時に自動で傾き操作へ（咲耶スクランブル方式）
        //   gyro: { autoStart: false }        … 最初はスティック。📱 を長押しした人だけ傾き操作へ
        //   gyro: { sensitivity: 0.55, deadzoneDeg: 4, maxDeg: 28 } … 効き具合の調整
        gyro: false,
        buttons: [
          { id: "dash", label: "X", ariaLabel: "ダッシュ", keys: ["KeyX", "Space"], primary: true,
            onPress: () => { game.dash = 20; kit.sfx.shot(); } },
        ],
        // 自動連射（V キー／🔫 の長押しで切り替え。タッチ端末は最初からオン）
        //   button: "dash" にすると、X を短くタップで切り替える方式（咲耶ジャンプバグ方式）になる
        autoFire: { interval: 12, onFire: () => fire() },
      },
      share: {
        when: "clear",
        text: (r) => `SAKUYA KIT DEMO をクリア！\nスコア ${r.score}\n救出 ${r.rescued.length}/11`,
      },
      help: { pc: "矢印/WASDで移動、Xでダッシュ、Vで自動連射、Mで音（Pキーで一時停止）" },
      // CLEAR / GAME OVER の演出動画（パスはタイトル側の置き場所）。無ければ省略してよく、
      // そのときはジングルと文字だけの結果画面になる。image は動画を流し終えた後の静止画
      cutscenes: {
        // clear: { src: "clear.mp4", image: "clear.png" },
        // gameOver: { src: "gameover.mp4" },
      },

      onStart: reset,
      onExtend: () => kit.sfx.bonus(),

      update(k) {
        const s = game.ship;
        const a = k.input.axis();
        const thrust = game.dash > 0 ? 0.9 : 0.4;
        if (game.dash > 0) game.dash--;
        s.vx = (s.vx + a.x * thrust) * 0.9;
        s.vy = (s.vy + a.y * thrust) * 0.9;
        s.x = Math.max(s.r, Math.min(W - s.r, s.x + s.vx));
        s.y = Math.max(s.r, Math.min(H - s.r, s.y + s.vy));
        if (s.inv > 0) s.inv--;
        game.fuel = Math.max(0, game.fuel - 0.03);

        if (Math.random() < 0.02) {
          const ch = k.cnp.run.pick(); // まだ取っていないキャラほど出やすい
          game.items.push({ ch, x: W + 30, y: 60 + Math.random() * (H - 120), t: Math.random() * 6 });
        }
        if (Math.random() < 0.025) {
          game.rocks.push({ x: W + 20, y: 70 + Math.random() * (H - 70), r: 12 + Math.random() * 16, v: 2 + Math.random() * 3 });
        }
        for (const it of game.items) { it.x -= 2; it.t += 0.05; }
        for (const r of game.rocks) r.x -= r.v;
        for (const b of game.shots) b.x += 9;

        game.items = game.items.filter((it) => {
          const y = it.y + Math.sin(it.t) * 12;
          if (Math.hypot(it.x - s.x, y - s.y) < 30) {
            k.score.add(k.cnp.run.collect(it.ch.no) ? 300 : 100);
            game.fuel = Math.min(100, game.fuel + 10);
            k.sfx.pickup();
            return false;
          }
          return it.x > -40;
        });
        game.rocks = game.rocks.filter((r) => {
          const hit = game.shots.find((b) => Math.hypot(b.x - r.x, b.y - r.y) < r.r + 4);
          if (hit) { hit.x = W + 99; k.score.add(50); k.sfx.explode(); return false; }
          if (s.inv === 0 && Math.hypot(r.x - s.x, r.y - s.y) < r.r + s.r) {
            k.sfx.hit();
            k.checkpoint.set({ x: 120, y: s.y }); // 例: 復活地点をやられた高さにする
            if (k.lives.lose() > 0) game.ship = newShip();
            else return end(false), false;
          }
          return r.x > -40;
        });
        game.shots = game.shots.filter((b) => b.x < W + 20);

        game.timer++;
        if (game.fuel <= 0) end(false);
        else if (game.timer >= DURATION) {
          k.score.add(k.lives.value * 500 + Math.floor(game.fuel) * 10);
          end(true);
        }
      },

      render(ctx, k) {
        const { colors } = k.retro;
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, W, H);
        k.retro.crt();

        if (k.phase === "title") {
          k.retro.titleText("SAKUYA KIT DEMO", "- CATCH THE CNP -");
          k.cnp.chars.forEach((ch, i) => k.cnp.draw(ctx, ch, 130 + i * 70, H / 2, 56));
          return;
        }

        for (const it of game.items) k.cnp.draw(ctx, it.ch, it.x, it.y + Math.sin(it.t) * 12, 48);
        ctx.fillStyle = k.retro.alpha(colors.ink, 0.35);
        for (const r of game.rocks) { ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = colors.gold;
        for (const b of game.shots) ctx.fillRect(b.x - 6, b.y - 1, 12, 3);

        const s = game.ship;
        if (s && !(s.inv > 0 && k.frame % 8 < 4)) {
          ctx.fillStyle = colors.magenta;
          ctx.beginPath();
          ctx.moveTo(s.x + 16, s.y);
          ctx.lineTo(s.x - 12, s.y - 10);
          ctx.lineTo(s.x - 12, s.y + 10);
          ctx.fill();
        }

        // HUD は kit の共通部品（全タイトル同じ位置・同じ見た目）
        k.hud.score();
        k.hud.roster();
        k.hud.lives();
        k.hud.gauge({ label: "FUEL", ratio: game.fuel / 100 });
        ctx.font = k.retro.font(10);
        ctx.fillStyle = colors.dim;
        ctx.textAlign = "right";
        ctx.fillText(`TIME ${Math.max(0, Math.ceil((DURATION - game.timer) / 60))}`, W - 16, 80);
        ctx.textAlign = "left";
      },
    });

    function fire() {
      if (game.ship) game.shots.push({ x: game.ship.x + 14, y: game.ship.y });
    }
    // 救出キャラ・スコアは kit が持っているので、終わりはクリアかどうかだけ渡せばよい
    function end(cleared) {
      kit.gameOver({ cleared, progress: (game.timer / DURATION) * 100 });
    }
    window.kit = kit; // デバッグ用
  </script>
</body>
</html>
