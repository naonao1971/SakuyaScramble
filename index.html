<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAKUYA SCRAMBLE</title>
  <!-- OGP / Twitter Card -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SAKUYA SCRAMBLE" />
  <meta property="og:description" content="クリプト忍者咲耶の宇宙船で洞窟を駆け抜けるブラウザゲーム" />
  <meta property="og:url" content="https://naonao1971.github.io/ExciteByc/" />
  <meta property="og:image" content="https://naonao1971.github.io/ExciteByc/image01.jpg" />
  <meta property="og:image:width" content="1672" />
  <meta property="og:image:height" content="941" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SAKUYA SCRAMBLE" />
  <meta name="twitter:description" content="クリプト忍者咲耶の宇宙船で洞窟を駆け抜けるブラウザゲーム" />
  <meta name="twitter:image" content="https://naonao1971.github.io/ExciteByc/image01.jpg" />
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #07090f;
      color: #e8ecff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      min-height: 100vh;
      padding: 20px 12px 40px;
      box-sizing: border-box;
    }
    .wrap {
      position: relative;
      text-align: center;
    }
    canvas {
      width: min(92vw, 960px);
      height: auto;
      max-height: 72vh;
      border: 1px solid #2a365f;
      box-shadow: 0 0 32px rgba(90, 140, 255, 0.2);
      background: linear-gradient(#02040a, #060b18);
      image-rendering: pixelated;
    }
    .help {
      margin-top: 10px;
      color: #9db0ff;
      font-size: 14px;
    }
    .mobile-controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .mobile-controls button {
      appearance: none;
      border: 1px solid #4d5f95;
      background: linear-gradient(180deg, #1b2a52, #10192f);
      color: #eef4ff;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }
    .mobile-controls button:disabled {
      opacity: 0.55;
    }
    .mobile-controls .restart {
      border-color: #8b6c3c;
      background: linear-gradient(180deg, #5a3f15, #2c1e08);
    }
    .mobile-controls .start {
      border-color: #3f8b72;
      background: linear-gradient(180deg, #17604c, #0f362c);
    }
    .hud-start {
      /* left/top are set per-frame in JS (positionStartButton) to track the
         canvas-space "start here" hint spot at any display scale */
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 2;
      padding: 8px 14px;
      font-size: 14px;
    }
    /* sits in the empty center cell of the 3x3 touch d-pad grid */
    .gyro-toggle {
      grid-column: 2;
      grid-row: 2;
      border-color: #3f8b6c;
      background: linear-gradient(180deg, #17604c, #0f362c);
      font-size: 20px;
      padding: 0;
    }
    .status {
      min-height: 1.4em;
      color: #b9c8ff;
      font-size: 13px;
    }
    .touch-pad {
      /* scales down on narrow screens instead of staying a fixed 56px */
      --dpad-size: clamp(34px, 9vw, 56px);
      --dpad-gap: clamp(4px, 1.2vw, 8px);
      position: relative;
      z-index: 1;
      display: none;
      grid-template-columns: repeat(3, var(--dpad-size));
      grid-template-rows: repeat(3, var(--dpad-size));
      gap: var(--dpad-gap);
      pointer-events: auto;
    }
    .touch-pad .touch-btn {
      width: var(--dpad-size);
      height: var(--dpad-size);
      font-size: clamp(14px, 4vw, 22px);
      border-radius: clamp(8px, 2.5vw, 14px);
    }
    .touch-up {
      grid-column: 2;
      grid-row: 1;
    }
    .touch-left {
      grid-column: 1;
      grid-row: 2;
    }
    .touch-right {
      grid-column: 3;
      grid-row: 2;
    }
    .touch-down {
      grid-column: 2;
      grid-row: 3;
    }
    .fire-pad {
      /* pin fire/bomb buttons to the left-bottom of the viewport */
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 6;
      display: none;
      pointer-events: auto;
      flex-direction: column;
      gap: 8px;
    }
    .touch-fire {
      border-color: #9d6038;
      background: rgba(80, 34, 14, 0.82);
      font-size: 18px;
      width: 62px;
      height: 62px;
      border-radius: 16px;
    }
    .touch-btn {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      border: 1px solid #3f558e;
      background: rgba(16, 28, 56, 0.72);
      color: #f2f6ff;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .touch-btn:active,
    .touch-btn.active {
      background: rgba(71, 118, 224, 0.86);
      border-color: #7db0ff;
      transform: translateY(1px);
    }
    .controls-bottom {
      position: absolute;
      right: 12px;
      bottom: 18px;
      z-index: 3;
      display: flex;
      gap: 14px;
      align-items: flex-end;
      pointer-events: none;
    }
    .controls-bottom > * {
      pointer-events: auto;
    }

    /* --- ランキング（TOP10） --- */
    .leaderboard {
      width: min(92vw, 960px);
      box-sizing: border-box;
      background: rgba(16, 28, 56, 0.55);
      border: 1px solid #3f558e;
      border-radius: 14px;
      padding: 16px 18px 20px;
      display: none;
    }
    .leaderboard.visible {
      display: block;
    }
    .leaderboard-title {
      margin: 0 0 10px;
      font-size: 16px;
      color: #ffe08a;
      text-align: center;
    }
    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* columns: 順位 / ニックネーム / Xの名称 / スコア */
    .leaderboard-row {
      display: grid;
      grid-template-columns: 40px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: rgba(7, 12, 26, 0.6);
      border-radius: 8px;
      font-size: 14px;
    }
    .leaderboard-row .lb-rank {
      color: #9db0ff;
      font-weight: 700;
      text-align: center;
    }
    .leaderboard-row .lb-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .leaderboard-row .lb-xname {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .leaderboard-row .lb-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      background: #1b2340;
      flex: none;
    }
    .leaderboard-row .lb-xlink {
      color: #7db0ff;
      text-decoration: none;
      font-size: 12px;
      white-space: nowrap;
    }
    .leaderboard-row .lb-xlink:hover {
      text-decoration: underline;
    }
    .leaderboard-row .lb-score {
      color: #ffe08a;
      font-weight: 700;
      text-align: right;
    }
    .leaderboard-empty {
      color: #9db0ff;
      font-size: 13px;
      text-align: center;
      padding: 8px 0;
    }
    .score-register {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #3f558e;
      display: none;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .score-register.visible {
      display: flex;
    }
    .score-register-msg {
      margin: 0;
      color: #ffe08a;
      font-weight: 700;
      font-size: 14px;
    }
    .score-register input {
      width: min(280px, 90%);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #3f558e;
      background: rgba(7, 12, 26, 0.8);
      color: #e8ecff;
      font: inherit;
    }
    .score-register button {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid #3f8b6c;
      background: linear-gradient(180deg, #17604c, #0f362c);
      color: #eef4ff;
      font: inherit;
      font-weight: 700;
    }
    .score-register button:disabled {
      opacity: 0.5;
    }
    .rank-submit-status {
      margin: 0;
      font-size: 12px;
      color: #9db0ff;
      min-height: 1.2em;
    }
    .xid-preview {
      width: min(280px, 90%);
      min-height: 1.4em;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .xid-preview.visible {
      display: flex;
    }
    .xid-preview.xid-loading {
      color: #9db0ff;
    }
    .xid-preview.xid-error {
      color: #ff9d9d;
    }
    .xid-preview.xid-found {
      color: #9dffb0;
    }
    .xid-preview .xid-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      background: #1b2340;
    }
    .xid-preview a {
      color: #7db0ff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="960" height="540" aria-label="Scramble tunnel game"></canvas>
    <div id="gyroStatus" class="status"></div>
    <div class="controls-bottom" aria-hidden="false">
      <div id="firePad" class="fire-pad" aria-label="発射ボタン">
        <button id="touchFire" class="touch-btn touch-fire" type="button" aria-label="バルカン発射">X</button>
        <button id="touchBomb" class="touch-btn touch-bomb" type="button" aria-label="爆弾投下">💣</button>
      </div>
      <div id="touchPad" class="touch-pad" aria-label="タッチコントローラー">
        <button id="touchUp" class="touch-btn touch-up" type="button" aria-label="上昇">▲</button>
        <button id="touchLeft" class="touch-btn touch-left" type="button" aria-label="左移動">◀</button>
        <button id="touchRight" class="touch-btn touch-right" type="button" aria-label="右移動">▶</button>
        <button id="touchDown" class="touch-btn touch-down" type="button" aria-label="下降">▼</button>
      </div>
    </div>
  </div>

  <section id="leaderboard" class="leaderboard" aria-label="ランキング TOP10">
    <div id="scoreRegisterForm" class="score-register">
      <p class="score-register-msg">TOP10入り！ニックネームを登録してください</p>
      <input id="rankNickname" type="text" placeholder="ニックネーム（必須）" maxlength="20" autocomplete="off" />
      <input id="rankXid" type="text" placeholder="XのユーザーID（任意・@なし）" maxlength="20" autocomplete="off" />
      <div id="rankXidPreview" class="xid-preview"></div>
      <button id="rankSubmitBtn" type="button">登録する</button>
      <p id="rankSubmitStatus" class="rank-submit-status"></p>
    </div>
    <h2 class="leaderboard-title">🏆 TOP10 ランキング</h2>
    <ol id="leaderboardList" class="leaderboard-list"></ol>
  </section>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const gyroStatus = document.getElementById("gyroStatus");

    // --- ランキング (Google スプレッドシート連携) ---
    // デプロイ後の Apps Script Web App URL をここに設定してください（apps-script.gs 参照）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyTTaCaeW6hPn60U2UeG3Cle9tHjQ4I4PaujzYkXzNKaxprlMhlR4KELXv0dE7VVyFr/exec";
    const leaderboardPanel = document.getElementById("leaderboard");
    const leaderboardList = document.getElementById("leaderboardList");
    const scoreRegisterForm = document.getElementById("scoreRegisterForm");
    const rankNicknameInput = document.getElementById("rankNickname");
    const rankXidInput = document.getElementById("rankXid");
    const rankSubmitBtn = document.getElementById("rankSubmitBtn");
    const rankSubmitStatus = document.getElementById("rankSubmitStatus");
    const rankXidPreview = document.getElementById("rankXidPreview");
    // タッチ操作対応端末をモバイルとみなし、ランキング登録時に記録する
    const isMobileDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
    let leaderboardCache = [];
    let scoreSubmitted = false;
    // X ID の検証状態: 未入力なら常に登録可、入力中は検証が完了(found)するまで登録不可
    let xidVerifyState = "empty"; // "empty" | "loading" | "found" | "error"
    let xidVerifyToken = 0; // 直前の検証より新しい結果だけ反映するための連番

    function escapeHTML(s) {
      return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function renderLeaderboard() {
      if (!leaderboardList) return;
      if (!leaderboardCache.length) {
        leaderboardList.innerHTML = '<li class="leaderboard-empty">まだ記録がありません</li>';
        return;
      }
      // 表示順: 順位 / ニックネーム / Xの名称 / スコア
      leaderboardList.innerHTML = leaderboardCache
        .slice(0, 10)
        .map((r, i) => {
          const rank = i + 1;
          const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : `${rank}`;
          const xid = String(r.xid || "").replace(/^@/, "").trim();
          const xPart =
            xid && /^[A-Za-z0-9_]{1,15}$/.test(xid)
              ? `<img class="lb-avatar" src="https://unavatar.io/x/${encodeURIComponent(xid)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                 <a class="lb-xlink" href="https://x.com/${encodeURIComponent(xid)}" target="_blank" rel="noopener noreferrer">@${escapeHTML(xid)}</a>`
              : "";
          const deviceIcon = r.device === "モバイル" ? "📱" : r.device === "PC" ? "💻" : "";
          return `<li class="leaderboard-row">
              <span class="lb-rank">${medal}</span>
              <span class="lb-name">${deviceIcon ? `<span class="lb-device" title="${escapeHTML(r.device)}">${deviceIcon}</span> ` : ""}${escapeHTML(r.nickname)}</span>
              <span class="lb-xname">${xPart}</span>
              <span class="lb-score">${Math.floor(r.score)}</span>
            </li>`;
        })
        .join("");
    }

    function loadLeaderboard() {
      if (!GAS_URL) {
        renderLeaderboard();
        return;
      }
      fetch(GAS_URL, { cache: "no-store" })
        .then((r) => r.json())
        .then((d) => {
          leaderboardCache = (d.records || []).slice().sort((a, b) => b.score - a.score);
          renderLeaderboard();
        })
        .catch(() => renderLeaderboard());
    }

    function qualifiesForTop10(score) {
      if (leaderboardCache.length < 10) return true;
      return score > leaderboardCache[9].score;
    }

    function setLeaderboardVisible(visible) {
      if (!leaderboardPanel) return;
      leaderboardPanel.classList.toggle("visible", !!visible);
    }

    function showScoreRegisterForm() {
      if (!scoreRegisterForm) return;
      scoreRegisterForm.classList.add("visible");
      rankNicknameInput.value = "";
      rankXidInput.value = "";
      rankSubmitStatus.textContent = "";
      xidVerifyState = "empty";
      setXidPreview(null, "");
      updateSubmitAvailability();
    }

    function hideScoreRegisterForm() {
      if (!scoreRegisterForm) return;
      scoreRegisterForm.classList.remove("visible");
    }

    // ニックネーム入力済み、かつ(X IDが空 または 検証済みfound)のときだけ登録可能にする
    function updateSubmitAvailability() {
      if (!rankSubmitBtn) return;
      const nickname = rankNicknameInput.value.trim();
      const xidOk = xidVerifyState === "empty" || xidVerifyState === "found";
      rankSubmitBtn.disabled = !nickname || !xidOk;
    }

    function setXidPreview(mode, html) {
      if (!rankXidPreview) return;
      rankXidPreview.className = "xid-preview" + (mode ? " visible xid-" + mode : "");
      rankXidPreview.innerHTML = html || "";
    }

    // unavatar.io へのアバター読み込み成否で、Xアカウントが実在するかを簡易検証する
    function verifyXid(rawXid) {
      const username = String(rawXid || "").replace(/^@/, "").trim();
      xidVerifyToken++;
      const token = xidVerifyToken;

      if (!username) {
        xidVerifyState = "empty";
        setXidPreview(null, "");
        updateSubmitAvailability();
        return;
      }
      if (!/^[A-Za-z0-9_]{1,15}$/.test(username)) {
        xidVerifyState = "error";
        setXidPreview("error", "形式エラー：半角英数字・アンダースコアのみ、最大15文字で入力してください");
        updateSubmitAvailability();
        return;
      }

      xidVerifyState = "loading";
      setXidPreview("loading", "確認中...");
      updateSubmitAvailability();

      const img = new Image();
      img.onload = () => {
        if (token !== xidVerifyToken) return; // 途中で入力が変わっていたら無視
        xidVerifyState = "found";
        setXidPreview(
          "found",
          `<img src="https://unavatar.io/x/${encodeURIComponent(username)}" alt="" class="xid-avatar">` +
            `<a href="https://x.com/${encodeURIComponent(username)}" target="_blank" rel="noopener noreferrer">@${escapeHTML(username)}</a>` +
            `<span>を確認しました</span>`
        );
        updateSubmitAvailability();
      };
      img.onerror = () => {
        if (token !== xidVerifyToken) return;
        xidVerifyState = "error";
        setXidPreview("error", "このXアカウントの名称を取得できませんでした。IDを確認してください");
        updateSubmitAvailability();
      };
      img.src = "https://unavatar.io/x/" + encodeURIComponent(username);
    }

    if (rankXidInput) {
      // 入力中は再検証されるまで登録不可にする（値を空にした場合のみ即座に登録可へ戻す）
      rankXidInput.addEventListener("input", () => {
        const username = rankXidInput.value.trim();
        if (!username) {
          xidVerifyState = "empty";
          setXidPreview(null, "");
        } else {
          xidVerifyState = "loading";
          setXidPreview(null, "");
        }
        updateSubmitAvailability();
      });
      rankXidInput.addEventListener("blur", () => verifyXid(rankXidInput.value));
    }
    if (rankNicknameInput) {
      rankNicknameInput.addEventListener("input", updateSubmitAvailability);
    }

    if (rankSubmitBtn) {
      rankSubmitBtn.addEventListener("click", () => {
        const nickname = rankNicknameInput.value.trim();
        if (!nickname) {
          rankSubmitStatus.textContent = "ニックネームを入力してください";
          rankNicknameInput.focus();
          return;
        }
        if (xidVerifyState !== "empty" && xidVerifyState !== "found") {
          rankSubmitStatus.textContent = "XのIDを確認できるまで登録できません";
          rankXidInput.focus();
          return;
        }
        const xid = rankXidInput.value.trim().replace(/^@/, "");
        rankSubmitBtn.disabled = true;
        rankSubmitStatus.textContent = "登録中...";
        const record = {
          nickname,
          xid,
          score: Math.floor(state.score),
          created: Date.now(),
          device: isMobileDevice ? "モバイル" : "PC"
        };
        if (!GAS_URL) {
          rankSubmitStatus.textContent = "ランキング機能が未設定です（GAS_URL 未設定）";
          rankSubmitBtn.disabled = false;
          return;
        }
        fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "add", record }) })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              rankSubmitStatus.textContent = "登録しました！";
              hideScoreRegisterForm();
              loadLeaderboard();
            } else {
              rankSubmitStatus.textContent = "登録に失敗しました: " + (d.error || "");
              updateSubmitAvailability();
            }
          })
          .catch((e) => {
            rankSubmitStatus.textContent = "通信エラー: " + e.message;
            updateSubmitAvailability();
          });
      });
    }
    const touchPad = document.getElementById("touchPad");
    const firePad = document.getElementById("firePad");
    const touchUp = document.getElementById("touchUp");
    const touchLeft = document.getElementById("touchLeft");
    const touchFire = document.getElementById("touchFire");
    const touchBomb = document.getElementById("touchBomb");
    const touchRight = document.getElementById("touchRight");
    const touchDown = document.getElementById("touchDown");

    // gyro tilt controls: when available, replace the on-screen d-pad with device tilt.
    // baseline is calibrated to however the phone is being held right when the game starts.
    const gyro = {
      supported: false,   // real orientation data has been observed at least once
      listening: false,   // the deviceorientation listener has been attached (permission granted)
      active: false,      // currently driving ship movement (toggle-able)
      calibrated: false,
      baseline: { x: 0, y: 0 },
      deadzoneDeg: 4,     // degrees of tilt ignored around the baseline (dead zone)
      maxDeg: 28,         // degrees of tilt for full deflection
      sensitivity: 0.55,  // scales the analog thrust vs. a full digital key-press, for finer control
      userChoiceMade: false // once the player uses the toggle button, スタート stops auto-switching modes
    };

    // current screen rotation (0/90/180/270) so tilt axes can be remapped to how the phone is actually held
    function getScreenAngle() {
      if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === "number") {
        return window.screen.orientation.angle;
      }
      if (typeof window.orientation === "number") return window.orientation;
      return 0;
    }

    // rotates the device's raw beta/gamma into screen-relative x (left/right) and y (forward/back) tilt
    function computeScreenTilt(beta, gamma) {
      const angle = ((getScreenAngle() % 360) + 360) % 360;
      if (angle === 90) return { x: beta, y: -gamma };
      if (angle === 180) return { x: -gamma, y: -beta };
      if (angle === 270) return { x: -beta, y: gamma };
      return { x: gamma, y: beta };
    }

    // maps a tilt offset (in degrees) to a smooth -1..1 analog value, with a dead zone near the baseline
    function normalizeTiltAxis(deltaDeg) {
      const abs = Math.abs(deltaDeg);
      if (abs <= gyro.deadzoneDeg) return 0;
      const t = Math.min(1, (abs - gyro.deadzoneDeg) / (gyro.maxDeg - gyro.deadzoneDeg));
      return (deltaDeg < 0 ? -1 : 1) * t;
    }

    function applyGyroTilt(x, y) {
      if (!gyro.calibrated) {
        gyro.baseline.x = x;
        gyro.baseline.y = y;
        gyro.calibrated = true;
        return;
      }
      state.input.gyroX = normalizeTiltAxis(x - gyro.baseline.x);
      state.input.gyroY = normalizeTiltAxis(y - gyro.baseline.y);
    }

    // hides only the four direction buttons (not the whole grid), so the gyro
    // toggle icon in the center cell stays visible/reachable either way
    function setTouchPadVisible(visible) {
      const isTouchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      const display = visible && isTouchDevice ? "" : "none";
      [touchUp, touchLeft, touchRight, touchDown].forEach((btn) => {
        if (btn) btn.style.display = display;
      });
    }

    // Hiding the d-pad must wait for a *real* deviceorientation event — granting
    // permission does not mean the device actually reports tilt data (many Android
    // devices without a gyroscope, or desktop "mobile mode", grant permission
    // instantly but never fire the event). Hiding on activation alone left players
    // with neither the d-pad nor working tilt controls.
    let _gyroFallbackTimer = null;

    function activateGyroControls() {
      gyro.active = true;
      state.input.gyroX = 0;
      state.input.gyroY = 0;
      recalibrateGyro();
      updateGyroToggleLabel();
      if (gyro.supported) {
        // we've already confirmed real tilt data arrives (e.g. re-enabled via the toggle)
        setTouchPadVisible(false);
        updateGyroStatus("ジャイロ操作中：端末を傾けて移動します（現在の向きが基準）");
      } else {
        // keep the d-pad visible until the first real event confirms tilt actually works
        setTouchPadVisible(true);
        updateGyroStatus("ジャイロを確認中...端末を傾けてみてください（反応がなければ十字ボタンをご利用ください）");
        clearTimeout(_gyroFallbackTimer);
        _gyroFallbackTimer = setTimeout(() => {
          if (gyro.active && !gyro.supported) {
            updateGyroStatus("ジャイロが検出できませんでした。十字ボタンで操作してください");
            deactivateGyroControls();
          }
        }, 1500);
      }
    }

    function deactivateGyroControls() {
      clearTimeout(_gyroFallbackTimer);
      gyro.active = false;
      state.input.gyroX = 0;
      state.input.gyroY = 0;
      setTouchPadVisible(true);
      updateGyroStatus("キー/タッチ操作に切り替えました");
      updateGyroToggleLabel();
    }

    function handleOrientation(e) {
      if (e.beta == null || e.gamma == null) return;
      const justConfirmed = !gyro.supported;
      gyro.supported = true;
      if (!gyro.active) return;
      if (justConfirmed) {
        // first real tilt data while active: now it's safe to hide the d-pad
        clearTimeout(_gyroFallbackTimer);
        setTouchPadVisible(false);
        updateGyroStatus("ジャイロ操作中：端末を傾けて移動します（現在の向きが基準）");
      }
      const tilt = computeScreenTilt(e.beta, e.gamma);
      applyGyroTilt(tilt.x, tilt.y);
    }

    function recalibrateGyro() {
      gyro.calibrated = false;
    }

    async function requestGyroPermission() {
      if (typeof window.DeviceOrientationEvent === "undefined") return false;
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          const result = await DeviceOrientationEvent.requestPermission();
          return result === "granted";
        } catch (e) {
          return false;
        }
      }
      return true; // no explicit permission needed (Android, older iOS)
    }

    // requests permission (first time only) and attaches the listener; does not itself toggle control
    async function ensureGyroListening() {
      if (gyro.listening) return true;
      const granted = await requestGyroPermission();
      if (!granted) return false;
      gyro.listening = true;
      window.addEventListener("deviceorientation", handleOrientation);
      // rotating the phone mid-game changes what "neutral" tilt means, so recalibrate on rotation
      window.addEventListener("orientationchange", recalibrateGyro);
      if (window.screen && window.screen.orientation) {
        window.screen.orientation.addEventListener("change", recalibrateGyro);
      }
      return true;
    }

    async function enableGyroIfAvailable() {
      const ok = await ensureGyroListening();
      if (ok) activateGyroControls();
    }

    async function toggleGyroControls() {
      gyro.userChoiceMade = true;
      if (gyro.active) {
        deactivateGyroControls();
        return;
      }
      const ok = await ensureGyroListening();
      if (ok) {
        activateGyroControls();
      } else {
        updateGyroStatus("ジャイロを有効化できませんでした。キー/タッチで操作してください");
      }
    }

    function updateGyroToggleLabel() {
      if (!gyroToggleButton) return;
      // icon-only: 🕹️ = tap to switch to key/touch, 📱 = tap to switch to tilt
      gyroToggleButton.textContent = gyro.active ? "🕹️" : "📱";
      gyroToggleButton.setAttribute(
        "aria-label",
        gyro.active ? "キー/タッチ操作に切り替え" : "傾き操作に切り替え"
      );
    }

    const startButton = document.createElement("button");
    startButton.id = "startButton";
    startButton.type = "button";
    startButton.className = "start hud-start";
    startButton.textContent = "スタート";
    document.querySelector(".wrap").appendChild(startButton);

    // switches between gyro tilt control and key/touch control, without re-prompting for permission.
    // sits in the empty center cell of the d-pad grid, icon-only so it doesn't crowd the controller.
    const gyroToggleButton = document.createElement("button");
    gyroToggleButton.id = "gyroToggleButton";
    gyroToggleButton.type = "button";
    gyroToggleButton.className = "touch-btn gyro-toggle";
    gyroToggleButton.textContent = "📱";
    gyroToggleButton.setAttribute("aria-label", "傾き操作とキー/タッチ操作を切り替え");
    gyroToggleButton.style.display = "none"; // only shown once we know the device might support it
    touchPad.appendChild(gyroToggleButton);

    // pilot portrait sprite sheet: 5 expressions (①通常 ②被弾 ③怒り ④苦痛 ⑤決意), drawn onto the game canvas
    const pilotImg = new Image();
    pilotImg.src = "image01.png";
    // source slots within the sheet (row1: 3 across, row2: 2 across)
    const PILOT_SLOTS = [
      { x: 0, y: 0, w: 557, h: 470 },     // ① 通常(冷静)
      { x: 557, y: 0, w: 557, h: 470 },   // ② 被弾(衝撃)
      { x: 1114, y: 0, w: 558, h: 470 },  // ③ 怒り(戦闘モード)
      { x: 0, y: 471, w: 836, h: 470 },   // ④ 苦痛(ダメージ大)
      { x: 836, y: 471, w: 836, h: 470 }  // ⑤ 決意(集中・反撃準備)
    ];
    // center-crop each slot to a 4:3 landscape rect so all 5 frames display consistently
    const PILOT_ASPECT = 4 / 3;
    const PILOT_CROPS = PILOT_SLOTS.map((s) => {
      const slotAspect = s.w / s.h;
      if (slotAspect > PILOT_ASPECT) {
        const w = s.h * PILOT_ASPECT;
        return { x: s.x + (s.w - w) / 2, y: s.y, w, h: s.h };
      }
      const h = s.w / PILOT_ASPECT;
      return { x: s.x, y: s.y + (s.h - h) / 2, w: s.w, h };
    });

    // victory illustration shown on the CLEAR screen
    const clearImg = new Image();
    clearImg.src = "image02png.png";

    // title illustration shown on the start screen, before the player presses スタート
    const titleImg = new Image();

    // HP recovery item sprite, drawn as-is (no recoloring/redrawing)

    hpItemImg.src = "noundry-studio-glasses.PNG";

    const state = {
      running: true,
      // becomes true once the player presses スタート; gates update() so nothing moves before that
      started: false,
      score: 0,
      speed: 2.6,
      maxSpeed: 6.2,
      bullets: [],
      bombs: [],
      bases: [],
      explosions: [],
      scrollSpeed: 2.6,

      bonusTimer: 0,
      columns: [],

      ship: {

        contactFrames: 0
      },
      hpItems: [],
      // single mega HP per stage
      megaHp: null,
      megaHpSpawned: false,
      // up/down/left/right: digital (keyboard/touch). gyroX/gyroY: analog -1..1 (device tilt)
      input: { up: false, down: false, left: false, right: false, gyroX: 0, gyroY: 0 },
      effects: {
        slowTimer: 0,

      }

      // stage system
      stage: 1,
      stageTimer: 0, // frames elapsed in current stage

      caption: "",
      captionTimer: 0, // frames to show caption
      pendingStageAdvance: false
      ,

      ,
      goalHold: { active: false, frames: 0 },
      // stage intro: phases: 'countdown' -> 'narrow'
      stageIntro: { active: false, frames: 0, total: 0, startGap: 0, phase: null },
      // arena bullets during intro
      // spawnInterval: larger => fewer waves (frames)
      arena: { bullets: [], spawnTimer: 0, spawnInterval: 60 },
      // laser beam: hold X for 3s to charge, then fire

      fall: {

        introActive: false,

        landing: { active: false, timer: 0, duration: 90, progress: 0 }
      },

      // pilot portrait: brief "被弾" flash timer shown right after taking damage
      portrait: { hitTimer: 0 },
      // big ship-explosion animation played before the GAME OVER telop appears
      dying: { active: false, timer: 0, duration: 96 }
    };

    const tunnel = {
      center: canvas.height / 2,
      centerVel: 0,
      gap: 200,
      minGap: 120,
      maxGap: 260,
      roughness: 0.42,
      baseSpawnChance: 0.0014
    };

    const fallTunnel = {
      center: canvas.width / 2,
      centerVel: 0,
      gap: 260,
      minGap: 156, // 120 * 1.3 — wider shaft, lower difficulty
      maxGap: 338, // 260 * 1.3
      roughness: 0.42
    };

    const baseColors = ["red", "blue", "yellow"];
    const baseStyles = {
      red: { fill: "#cf3946", edge: "#ff8f95" },
      blue: { fill: "#2e67c9", edge: "#89b5ff" },
      yellow: { fill: "#c89c26", edge: "#ffdf85" }
    };

    for (let i = 0; i < 160; i++) {
      state.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: 0.4 + Math.random() * 0.9
      });
    }

    function seedColumns() {
      state.columns.length = 0;
      let localCenter = tunnel.center;
      for (let x = 0; x < canvas.width; x++) {
        state.columns.push(makeColumn(localCenter, tunnel.gap));
      }
    }

    function makeColumn(center, gap) {
      const half = gap * 0.5;
      return {
        top: Math.max(20, center - half),
        bottom: Math.min(canvas.height - 20, center + half)
      };
    }

    // --- part 3: vertical fall shaft (rows indexed by y, walls on left/right) ---
    function seedFallRows() {
      state.fall.rows.length = 0;
      for (let y = 0; y < canvas.height; y++) {
        state.fall.rows.push(makeFallRow(fallTunnel.center, fallTunnel.gap));
      }
    }

    function makeFallRow(center, gap) {
      const half = gap * 0.5;
      return {
        left: Math.max(20, center - half),
        right: Math.min(canvas.width - 20, center + half)
      };
    }

    function updateFallTunnel() {
      const drift = (Math.random() - 0.5) * fallTunnel.roughness;
      fallTunnel.centerVel += drift;
      fallTunnel.centerVel *= 0.96;
      fallTunnel.center += fallTunnel.centerVel;
      fallTunnel.center = Math.max(90, Math.min(canvas.width - 90, fallTunnel.center));

      const wave = Math.sin(state.frame * 0.012) * 22;
      const gapTarget = 247 + wave; // 190 * 1.3 — wider, lower difficulty
      fallTunnel.gap += (gapTarget - fallTunnel.gap) * 0.03;
      fallTunnel.gap = Math.max(fallTunnel.minGap, Math.min(fallTunnel.maxGap, fallTunnel.gap));
    }

    function updateFallRows() {
      const step = state.scrollSpeed;
      for (let i = 0; i < step; i++) {
        state.fall.rows.shift();
        updateFallTunnel();
        state.fall.rows.push(makeFallRow(fallTunnel.center, fallTunnel.gap));
      }
    }

    // returns penetration amount in pixels for the fall shaft (0 if no collision)
    function getFallPenetration() {
      const y = Math.floor(state.ship.y);
      const row = state.fall.rows[y];
      if (!row) return 0;
      if (state.ship.x - state.ship.radius < row.left) {
        return row.left - (state.ship.x - state.ship.radius);
      }
      if (state.ship.x + state.ship.radius > row.right) {
        return (state.ship.x + state.ship.radius) - row.right;
      }
      return 0;
    }

    function beginFall() {
      state.fall.active = true;
      state.fall.timer = 0;
      // intro: bullets already stopped, ship rotates 90° while it keeps easing downward —
      // no screen wipe, so it reads as a continuous descent rather than a scene cut
      state.fall.introActive = true;
      state.fall.introTimer = 0;
      state.fall.introStartY = state.ship.y;
      state.fall.shipAngle = 0;
      fallTunnel.center = canvas.width / 2;
      fallTunnel.centerVel = 0;
      fallTunnel.gap = 260;
      seedFallRows();
      state.ship.x = canvas.width / 2;
      state.ship.vx = 0;
      state.ship.vy = 0;
      state.bullets.length = 0;
      state.bombs.length = 0;
      state.arena.bullets.length = 0;
      state.arena.spawnTimer = 0;
      state.stageIntro.active = false;
      state.hpItems.length = 0;
      state.megaHp = null;
      showCaption("床が開いた……地底へ落下！", 150);
    }

    function resetGame() {

      state.effects.wideTimer = 0;

      state.pendingStageAdvance = false;
      state.gameOver = false;

      state.arena.spawnTimer = 0;
      state.displayScore = 0;

      state.laser.chargeFrames = 0;
      state.laser.beam = null;

      state.fall.timer = 0;
      state.fall.rows.length = 0;
      state.fall.introActive = false;
      state.fall.introTimer = 0;
      state.fall.introStartY = 0;
      state.fall.shipAngle = 0;
      state.fall.landing.active = false;
      state.fall.landing.timer = 0;
      state.fall.landing.progress = 0;

      // ここが抜けていると、パート2(バルカン回避)中に力尽きた直後の再スタートが
      // ステージ1のトンネルへ戻らず、古い goalHold 状態のまま再開してしまう
      state.goalHold.active = false;
      state.goalHold.frames = 0;

      tunnel.center = canvas.height / 2;
