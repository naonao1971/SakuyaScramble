<body>
  <!-- 共通UI（スタート・ポーズ・操作ボタン・スティック・ランキング・縦持ち案内・全画面の案内）は
       sakuya-kit が足す。ここに置くのはゲーム画面の canvas だけ -->
  <div class="sk-wrap">
    <canvas id="game" width="960" height="540" aria-label="Scramble tunnel game"></canvas>
  </div>

  <script type="module">
    // 共通部分は sakuya-kit（https://github.com/naonao1971/sakuya-kit）。版を上げるときは
    // kit.css と同じ番号にそろえ、CHANGELOG を読んでから実機で確かめる
    import { createKit } from "https://cdn.jsdelivr.net/gh/naonao1971/sakuya-kit@0.1.0/kit.js";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // --- ランキング (Google スプレッドシート連携) ---
    // 共通 GAS（sakuya-kit/gas/apps-script.gs）の Web App URL。?game=scramble で
    // このタイトルのシート("ranking")を読み書きする（旧版の GAS でもそのまま動く）
    const GAS_URL = "https://script.google.com/macros/s/AKfycby-UoKAfHw4eBULVb37tQzwPEhNm65B_HUktd9Sh0ZxMdOdmnRHdub0NeeXUCAqg8bG/exec";

    const kit = createKit({
      gameId: "scramble",
      title: "SAKUYA SCRAMBLE",
      subtitle: "- RESCUE 11 CNP -",
      gasUrl: GAS_URL,
      cnp: true,
      // 死亡時の爆発やクリア後の演出は結果画面の裏でも動かす（update() が止まると明滅も止まる）
      updateWhenOver: true,
      controls: {
        stick: true,
        // スタート時に自動で傾き操作へ（対応端末のみ）。🕹️ の長押しでスティックに戻せる
        gyro: true,
        buttons: [
          // 短く押す=バルカン、3秒押し続ける=レーザー
          { id: "fire", label: "X", ariaLabel: "バルカン発射", keys: ["KeyX"], primary: true,
            onPress: () => startLaserCharge(), onRelease: () => stopLaserCharge() },
          { id: "bomb", label: "💣", ariaLabel: "爆弾投下", keys: ["KeyZ"], onPress: () => dropBomb() },
        ],
        // タッチでは左の親指がスティック、右の親指がXで埋まり、バルカンを連打する余裕がない。
        // タッチ端末では既定でバルカンを自動連射し、Xはレーザーのチャージ専用として空ける
        autoFire: { interval: 10, onFire: () => autoFireShot() },
      },
      cutscenes: {
        // どちらも1回だけ流す。CLEAR は流し終えたら静止画へ戻る
        clear: { src: "clear.mp4", image: "image02png.png" },
        gameOver: { src: "gameover.mp4" },
      },
      resultScreen: {
        // CLEAR 画面: メイン画像の左右の余白に、今回救出した11体を額縁のように並べる
        decorate(g, { kind, rect }) {
          if (kind === "clear" && rect) drawClearRoster(rect.x, rect.w);
        },
      },
      share: {
        when: "clear",
        url: "https://sakuya.naoblock.jp/",
        fileName: "sakuya-scramble-clear.png",
        text: () => buildShareText(),
        image: () => buildShareCardCanvas(),
      },
      help: {
        mobile: "スタートを押すと、対応端末では傾き操作に切り替わります（右下のXでバルカン発射）",
        pc: "PCはキーボード、スマホは画面左側のスティックと右下のボタンで操作できます（Pキーで一時停止）",
        playing: "開始しました。画面の左側を押したまま倒すと移動できます",
      },
      onStart: () => startGame(),
      // ポーズ・タブ切替・通知の割り込みで入力が消えたら、レーザーの溜めも解く
      onInputReset: () => releaseLaserChargeOnHit(),
      update: () => update(),
      render: () => render(),
    });
    window.kit = kit; // デバッグ用

    // X ボタン（レーザーの溜め具合をボタンの縁の光で見せる）
    const touchFire = kit.buttonEl("fire");
    const SFX = createGameSfx(kit.sfx);

    // pilot portrait sprite sheet: 5 expressions (①通常 ②被弾 ③怒り ④苦痛 ⑤決意), drawn onto the game canvas
    const pilotImg = new Image();
    pilotImg.src = "image01.png";
    // source slots within the sheet (row1: 3 across, row2: 2 across)
    const PILOT_SLOTS = [
      { x: 0, y: 0, w: 557, h: 470 },     // ① 通常(冷静)
      { x: 557, y: 0, w: 557, h: 470 },   // ② 被弾(衝撃)
      { x: 1114, y: 0, w: 558, h: 470 },  // ③ 怒り(戦闘モード)
      { x: 0, y: 471, w: 836, h: 470 },   // ④ 苦痛(ダメージ大)
      { x: 836, y: 471, w: 836, h: 470 }  // ⑤ 決意(集中・反撃準備)
    ];
    // center-crop each slot to a 4:3 landscape rect so all 5 frames display consistently
    const PILOT_ASPECT = 4 / 3;
    const PILOT_CROPS = PILOT_SLOTS.map((s) => {
      const slotAspect = s.w / s.h;
      if (slotAspect > PILOT_ASPECT) {
        const w = s.h * PILOT_ASPECT;
        return { x: s.x + (s.w - w) / 2, y: s.y, w, h: s.h };
      }
      const h = s.w / PILOT_ASPECT;
      return { x: s.x, y: s.y + (s.h - h) / 2, w: s.w, h };
    });

    // victory illustration shown on the CLEAR screen.
    // 動画(clearVideo)が再生できたときはそちらを優先し、この静止画は
    // 読み込み前・再生失敗時のフォールバックとして残す
    const clearImg = new Image();
    clearImg.src = "image02png.png";

    // title illustration shown on the start screen, before the player presses スタート
    const titleImg = new Image();
    titleImg.src = "image01.jpg";

    // HP recovery item sprite, drawn as-is (no recoloring/redrawing)
    const hpItemImg = new Image();
    hpItemImg.src = "noundry-studio-glasses.PNG";

    // --- CNP 救出対象 ---
    // 洞窟内に浮遊している仲間。触れると救出でスコア+HP。
    //
    // 絵は sakuya-kit の assets/cnp/<id>.png（kit と一緒に CDN から届く）。
    // 読み込み前は各キャラの色でシルエットのプレースホルダを描くので、
    // 画像が届く前でも当たり判定・浮遊・救出演出はすべて動く。
    const CNP_RESCUE = {
      size: 60,          // 描画サイズ(px四方)
      radius: 20,        // 当たり判定
      spawnChance: 0.0011
    };

    // 最終着陸チャレンジの採点。的の中心に近いほど、着地速度が遅いほど加点する
    // 「10点刻みの的」。的の外(半径50px超)へ落ちるとMISSでマイナス点になる
    const LANDING_RING_STEP = 5;    // 1段あたりの半径(px)
    const LANDING_RING_COUNT = 10;  // 段数。最大半径 = 5 * 10 = 50px
    const LANDING_RING_MAX_POINTS = 100; // 中心(段1)の得点。1段ごとに10点ずつ下がる
    const LANDING_MISS_PENALTY = -30;
    // 着地速度が遅いほど乗る追加ボーナス。的の得点とは別枠で加算する
    const LANDING_SPEED_BONUS_TIERS = [
      { max: 0.3, bonus: 50 },
      { max: 0.6, bonus: 40 },
      { max: 0.9, bonus: 30 },
      { max: 1.2, bonus: 20 },
      { max: 1.5, bonus: 10 }
    ];
    function landingSpeedBonus(impactSpeed) {
      for (const tier of LANDING_SPEED_BONUS_TIERS) {
        if (impactSpeed <= tier.max) return tier.bonus;
      }
      return 0;
    }
    // 的の中心からの距離(px)を採点する。的の外ならhit:falseを返す
    function scoreLandingAccuracy(errorX) {
      const maxRadius = LANDING_RING_STEP * LANDING_RING_COUNT;
      if (errorX > maxRadius) return { hit: false, idx: LANDING_RING_COUNT + 1, points: 0 };
      const idx = Math.max(1, Math.ceil(errorX / LANDING_RING_STEP)); // 1(中心)〜10(外周)
      return { hit: true, idx, points: LANDING_RING_MAX_POINTS - (idx - 1) * 10 };
    }

    // 画面上段に並べる額縁ロスター。左のSCORE(〜x230)、右のHPバー(x753〜)、
    // 下のキャプション枠(y60〜)のいずれにも触れない寸法にしてある
    const CNP_ROSTER = {
      slot: 36,          // 額1枚の一辺
      gap: 4,
      y: 10,
      flash: 45          // 救出した瞬間に額が光るフレーム数
    };

    // レア度。得点だけ変えて出現率を据え置くと「高得点キャラを狙う」動機が
    // 生まれないので、点が高いものほど weight を下げて出にくくしている。
    // rank は見た目のピップ数にも使う（プレイヤーが遠目に価値を判断できる）
    const CNP_TIERS = [
      { rank: 1, score: 100,  heal: 4,  weight: 26 },
      { rank: 2, score: 200,  heal: 6,  weight: 16 },
      { rank: 3, score: 400,  heal: 8,  weight: 9 },
      { rank: 4, score: 800,  heal: 10, weight: 4 },
      { rank: 5, score: 1500, heal: 14, weight: 1 }
    ];

    // 11体ぶんのスロット。キャラの絵・名前・色は sakuya-kit の正典（kit.cnp.chars）を使い、
    // このゲームではレア度（tier = CNP_TIERS の添字）だけを足す。label は救出時の
    // ボーナス表示とランキングロスターのツールチップに出るキャラ名
    const CNP_TIER_OF = {
      cnp_sotai_leelee: 0, cnp_sotai_mitama: 0, cnp_sotai_narukami: 0, cnp_sotai_orochi: 0,
      cnp_sotai_luna: 1, cnp_sotai_yama: 1, cnp_sotai_makami: 1,
      cnp_sotai_towa: 2, cnp_sotai_setsuna: 2,
      cnp_sotai_ema: 3,
      cnp_sotai_taruto: 4
    };
    const cnpChars = kit.cnp.chars.map((ch) => Object.assign(ch, { tier: CNP_TIERS[CNP_TIER_OF[ch.id] || 0] }));

    // 未収集のキャラを優遇する倍率。レア度の重みをそのまま使うと最上位が0.57%で、
    // 同じキャラばかり出て収集が進まない。5倍優遇でも「レアほど出にくい」関係
    // 自体は崩れない
    const CNP_UNCOLLECTED_BOOST = 5;

    function cnpWeightOf(ch) {
      return ch.tier.weight * (state.collected[ch.index] ? 1 : CNP_UNCOLLECTED_BOOST);
    }

    function pickCnpChar() {
      let total = 0;
      for (const ch of cnpChars) total += cnpWeightOf(ch);
      let r = Math.random() * total;
      for (const ch of cnpChars) {
        r -= cnpWeightOf(ch);
        if (r <= 0) return ch;
      }
      return cnpChars[0];
    }

    // 重複無しでcount体を無作為に選ぶ(落下ステージの保証出現キャラ抽選用)
    function pickRandomDistinct(arr, count) {
      const pool = arr.slice();
      const picked = [];
      while (picked.length < count && pool.length > 0) {
        const idx = Math.floor(Math.random() * pool.length);
        picked.push(pool[idx]);
        pool.splice(idx, 1);
      }
      return picked;
    }

    const state = {
      running: true,
      // becomes true once the player presses スタート; gates update() so nothing moves before that
      started: false,
      // 一時停止中はloop()がupdate()を呼ばないので、これだけでゲーム全体が凍結する
      paused: false,
      score: 0,
      speed: 2.6,
      maxSpeed: 6.2,
      bullets: [],
      bombs: [],
      bases: [],
      explosions: [],
      scorePops: [],
      scrollSpeed: 2.6,
      bonusText: "",
      bonusTimer: 0,
      columns: [],
      stars: [],
      frame: 0,
      displayScore: 0,
      ship: {
        x: 130,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        radius: 11,
        hp: 100,
        contactFrames: 0
      },
      hpItems: [],
      // single mega HP per stage
      megaHp: null,
      megaHpSpawned: false,
      // CNP 救出対象（浮遊する仲間）と、通しでの救出数
      rescues: [],
      rescuedCount: 0,
      // このプレイで救出した11体。リスタートで消える（ランキング登録にも使う）
      rescuedChars: new Array(cnpChars.length).fill(false),
      rescueFlash: new Array(cnpChars.length).fill(0),
      // 収集状況。制覇の判定に使う。resetGame() でリスタートのたびに0/11へ
      // 戻す(1プレイ完結の仕様)。保存もしていないのでページを離れても残らない
      collected: new Array(cnpChars.length).fill(false),
      // up/down/left/right: digital (keyboard/touch). gyroX/gyroY: analog -1..1 (device tilt)
      input: { up: false, down: false, left: false, right: false, gyroX: 0, gyroY: 0, stickX: 0, stickY: 0 },
      effects: {
        slowTimer: 0,
        wideTimer: 0
      }
      ,
      // stage system
      stage: 1,
      stageTimer: 0, // frames elapsed in current stage
      stageDuration: 60, // seconds per stage
      caption: "",
      captionTimer: 0, // frames to show caption
      pendingStageAdvance: false
      ,
      gameOver: false
      ,
      goalHold: { active: false, frames: 0 },
      // stage intro: phases: 'countdown' -> 'narrow'
      stageIntro: { active: false, frames: 0, total: 0, startGap: 0, phase: null },
      // arena bullets during intro
      // spawnInterval: larger => fewer waves (frames)
      arena: { bullets: [], spawnTimer: 0, spawnInterval: 60 },
      // laser beam: hold X for 3s to charge, then fire
      laser: { charging: false, chargeFrames: 0, chargeDuration: 180, beam: null },
      // part 3: vertical fall through the floor after the arena chamber
      fall: {
        active: false,
        timer: 0,
        duration: 30 * 60,
        rows: [],
        // 未救出のうち最大3体を、この落下ステージ中に必ず出現させる予約リスト。
        // beginFall()で組み、フレームが来るごとにupdate()側で消化する
        guaranteedRescues: [],
        // intro: bullets stop, ship rotates 90° while easing downward into the shaft
        introActive: false,
        introTimer: 0,
        introDuration: 90,
        introStartY: 0,
        shipAngle: 0,
        // landing: プレイヤー操作の着陸チャレンジ。バルカン停止・スクロール停止のうえで
        // Xキー(ブースター)で降下速度を、左右で位置を合わせて着陸マーカーを狙う
        landing: {
          active: false,
          timer: 0,
          duration: 90,
          progress: 0,
          // approach: 操作を渡す前の演出フェーズ。洞窟が広い最終チャンバーへ開けていき、
          // 敵弾は鳴りを潜める。ここで「ステージが変わった」感を出してから操作を渡す
          approachActive: false,
          approachTimer: 0,
          approachDuration: 210, // 3.5秒(60fps)
          // hover: 重力落下を始める前に、いったん完全静止して狙いを整える猶予。
          // ここではタイムリミットを消費しない
          hoverActive: false,
          hoverTimer: 0,
          hoverDuration: 45, // 0.75秒(60fps)
          // ブレーキ噴射で減速/浮上できる猶予。この時間を超えると噴射が
          // 止まり、以降は重力のみの自由落下で強制的に決着させる
          timeLimit: 1800, // 30秒(60fps)
          targetX: 0,
          // 着地目標は固定ではなく、この範囲内を正弦波で左右に往復し続ける。
          // 狙いを定めている間もタイミングを読ませるための動き
          targetMoveLo: 0,
          targetMoveHi: 0,
          targetMoveTimer: 0,
          resolved: false,
          settleTimer: 0,
          settleDuration: 40,
          rank: "",
          bonus: 0
        }
      },
      cleared: false,
      // pilot portrait: brief "被弾" flash timer shown right after taking damage
      portrait: { hitTimer: 0 },
      // big ship-explosion animation played before the GAME OVER telop appears
      dying: { active: false, timer: 0, duration: 96 }
    };

    const tunnel = {
      center: canvas.height / 2,
      centerVel: 0,
      gap: 200,
      minGap: 120,
      maxGap: 260,
      roughness: 0.42,
      baseSpawnChance: 0.0014
    };

    const fallTunnel = {
      center: canvas.width / 2,
      centerVel: 0,
      gap: 260,
      minGap: 156, // 120 * 1.3 — wider shaft, lower difficulty
      maxGap: 338, // 260 * 1.3
      roughness: 0.42
    };

    const baseColors = ["red", "blue", "yellow"];
    const baseStyles = {
      red: { fill: "#cf3946", edge: "#ff8f95" },
      blue: { fill: "#2e67c9", edge: "#89b5ff" },
      yellow: { fill: "#E07A1E", edge: "#FFC46B" }
    };

    for (let i = 0; i < 160; i++) {
      state.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: 0.4 + Math.random() * 0.9
      });
    }

    function seedColumns() {
      state.columns.length = 0;
      let localCenter = tunnel.center;
      for (let x = 0; x < canvas.width; x++) {
        state.columns.push(makeColumn(localCenter, tunnel.gap));
      }
    }

    function makeColumn(center, gap) {
      const half = gap * 0.5;
      return {
        top: Math.max(20, center - half),
        bottom: Math.min(canvas.height - 20, center + half)
      };
    }

    // --- part 3: vertical fall shaft (rows indexed by y, walls on left/right) ---
    function seedFallRows() {
      state.fall.rows.length = 0;
      for (let y = 0; y < canvas.height; y++) {
        state.fall.rows.push(makeFallRow(fallTunnel.center, fallTunnel.gap));
      }
    }

    function makeFallRow(center, gap) {
      const half = gap * 0.5;
      return {
        left: Math.max(20, center - half),
        right: Math.min(canvas.width - 20, center + half)
      };
    }

    function updateFallTunnel() {
      const drift = (Math.random() - 0.5) * fallTunnel.roughness;
      fallTunnel.centerVel += drift;
      fallTunnel.centerVel *= 0.96;
      fallTunnel.center += fallTunnel.centerVel;
      fallTunnel.center = Math.max(90, Math.min(canvas.width - 90, fallTunnel.center));

      const wave = Math.sin(state.frame * 0.012) * 22;
      const gapTarget = 247 + wave; // 190 * 1.3 — wider, lower difficulty
      fallTunnel.gap += (gapTarget - fallTunnel.gap) * 0.03;
      fallTunnel.gap = Math.max(fallTunnel.minGap, Math.min(fallTunnel.maxGap, fallTunnel.gap));
    }

    function updateFallRows() {
      const step = state.scrollSpeed;
      for (let i = 0; i < step; i++) {
        state.fall.rows.shift();
        updateFallTunnel();
        state.fall.rows.push(makeFallRow(fallTunnel.center, fallTunnel.gap));
      }
    }

    // returns penetration amount in pixels for the fall shaft (0 if no collision)
    function getFallPenetration() {
      const y = Math.floor(state.ship.y);
      const row = state.fall.rows[y];
      if (!row) return 0;
      if (state.ship.x - state.ship.radius < row.left) {
        return row.left - (state.ship.x - state.ship.radius);
      }
      if (state.ship.x + state.ship.radius > row.right) {
        return (state.ship.x + state.ship.radius) - row.right;
      }
      return 0;
    }

    function beginFall() {
      state.fall.active = true;
      state.fall.timer = 0;
      // intro: bullets already stopped, ship rotates 90° while it keeps easing downward —
      // no screen wipe, so it reads as a continuous descent rather than a scene cut
      state.fall.introActive = true;
      state.fall.introTimer = 0;
      state.fall.introStartY = state.ship.y;
      state.fall.shipAngle = 0;
      fallTunnel.center = canvas.width / 2;
      fallTunnel.centerVel = 0;
      fallTunnel.gap = 260;
      seedFallRows();
      state.ship.x = canvas.width / 2;
      state.ship.vx = 0;
      state.ship.vy = 0;
      state.bullets.length = 0;
      state.bombs.length = 0;
      state.arena.bullets.length = 0;
      state.arena.spawnTimer = 0;
      state.stageIntro.active = false;
      state.hpItems.length = 0;
      state.rescues.length = 0;
      state.megaHp = null;

      // 11体コンプリートを運任せにしないため、まだ救出していないキャラのうち
      // 最大3体を、この落下ステージの30秒間に必ず出現させる予約を組む
      const missing = cnpChars.filter((ch) => !state.rescuedChars[ch.index]);
      const guaranteed = pickRandomDistinct(missing, Math.min(3, missing.length));
      state.fall.guaranteedRescues = guaranteed.map((ch, i) => {
        // durationの中で偏りなく分散させる(1体なら20%地点、2体なら20%/50%地点…)。
        // 前後にランダムな幅を持たせ、毎回同じタイミングにならないようにする
        const baseFrame = Math.round(state.fall.duration * (0.2 + 0.3 * i));
        const jitter = Math.round((Math.random() - 0.5) * 80);
        return { frame: Math.max(60, baseFrame + jitter), ch };
      });

      showCaption("床が開いた……地底へ落下！", 150);
    }

    function resetGame() {
      state.running = true;
      state.score = 0;
      state.speed = 2.6;
      state.frame = 0;
      state.ship.x = 130;
      state.ship.y = canvas.height / 2;
      state.ship.vx = 0;
      state.ship.vy = 0;
      state.bullets.length = 0;
      state.bombs.length = 0;
      state.bases.length = 0;
      state.explosions.length = 0;
      state.scorePops.length = 0;
      state.bonusText = "";
      state.bonusTimer = 0;
      state.effects.slowTimer = 0;
      state.effects.wideTimer = 0;
      state.ship.hp = 100;
      state.ship.contactFrames = 0;
      state.ship.invincibleFrames = 0;
      // reset stage
      state.stage = 1;
      state.stageTimer = 0;
      state.caption = "";
      state.captionTimer = 0;
      state.pendingStageAdvance = false;
      state.gameOver = false;
      state.megaHp = null;
      state.megaHpSpawned = false;
      state.rescues.length = 0;
      state.rescuedCount = 0;
      state.rescuedChars.fill(false);
      state.rescueFlash.fill(0);
      // 通算の収集状況(state.collected)も再スタートのたびに0/11へ戻す。
      // 以前は意図的に持ち越す仕様だった(1プレイ平均5.2種類しか集まらず
      // 11/11制覇が統計的にほぼ不可能だったため)が、今回それより
      // 毎回リセットする挙動を優先する方針に変更した
      state.collected.fill(false);
      state.stageIntro = { active: false, frames: 0, total: 0, startGap: 0 };
      state.arena.bullets.length = 0;
      state.arena.spawnTimer = 0;
      state.displayScore = 0;
      state.laser.charging = false;
      state.laser.chargeFrames = 0;
      state.laser.beam = null;
      state.fall.active = false;
      state.fall.timer = 0;
      state.fall.rows.length = 0;
      state.fall.guaranteedRescues.length = 0;
      state.fall.introActive = false;
      state.fall.introTimer = 0;
      state.fall.introStartY = 0;
      state.fall.shipAngle = 0;
      state.fall.landing.active = false;
      state.fall.landing.timer = 0;
      state.fall.landing.progress = 0;
      state.fall.landing.hoverActive = false;
      state.fall.landing.hoverTimer = 0;
      state.fall.landing.targetMoveTimer = 0;
      state.cleared = false;
      state.portrait.hitTimer = 0;
      state.dying.active = false;
      state.dying.timer = 0;
      // ここが抜けていると、パート2(バルカン回避)中に力尽きた直後の再スタートが
      // ステージ1のトンネルへ戻らず、古い goalHold 状態のまま再開してしまう
      state.goalHold.active = false;
      state.goalHold.frames = 0;

      tunnel.center = canvas.height / 2;
      tunnel.centerVel = 0;
      tunnel.gap = 200;
      seedColumns();
    }

    // スタート（kit のスタートボタン・Enter/Space から kit が呼ぶ）
    function startGame() {
      resetGame();
      state.started = true;
      // begin stage with wide intro
      beginStage();
    }

    // 1プレイの終わり。結果画面・演出動画・ジングル・ランキング登録は kit が受け持つ
    function finishRun(cleared) {
      const rescued = [];
      for (let i = 0; i < state.rescuedChars.length; i++) if (state.rescuedChars[i]) rescued.push(i + 1);
      kit.gameOver({ score: Math.floor(state.score), cleared, rescued });
    }

    // 効果音。音源（矩形波とノイズの合成・ミュート・解錠）は kit.sfx が持ち、
    // ここではこのゲーム固有の音だけを足す。クリア/ゲームオーバーのジングルは kit が鳴らす
    //
    // 演出は3階層（頻度と強度は逆相関。全部を鳴らすと何も特別でなくなる）:
    //   弱 毎秒        バルカン        極小音・ピッチを散らす
    //   中 ときどき    被弾/取得/開始   中音量
    //   強 まれ        レーザー/終了    専用の音
    function createGameSfx(base) {
      const S = base;
      S.vulcan = () => base.shot();
      S.bomb = () => base.explode();
      S._chargeNodes = null;
      // 溜め: 低音から上昇していく。3秒のチャージ時間に合わせる。
      // 途中で指を離した場合(＝バルカン)に鳴り続けないよう、停止できる形で持つ
      S.charge = () => {
        S.stopCharge();
        if (!S.ctx || S.muted) return;
        const t0 = S.ctx.currentTime;
        const dur = 3.0;
        const osc = S.ctx.createOscillator();
        const g = S.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(110, t0);
        osc.frequency.exponentialRampToValueAtTime(880, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.06, t0 + 0.08);
        osc.connect(g).connect(S.master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.05);
        S._chargeNodes = { osc, g };
      };
      S.stopCharge = () => {
        const n = S._chargeNodes;
        S._chargeNodes = null;
        if (!n || !S.ctx) return;
        try {
          const t = S.ctx.currentTime;
          // 急に切るとプツッと鳴るので、ごく短いフェードで落とす
          n.g.gain.cancelScheduledValues(t);
          n.g.gain.setValueAtTime(Math.max(0.0001, n.g.gain.value), t);
          n.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
          n.osc.stop(t + 0.06);
        } catch (e) { /* すでに停止済みなら無視 */ }
      };
      S.laser = () => {
        S.tone({ freq: 1200, to: 180, dur: 0.5, type: "sawtooth", gain: 0.3 });
        S.noise({ dur: 0.4, gain: 0.16, filterFrom: 3000, filterTo: 300 });
      };
      return S;
    }

    function grantBaseBonus(color, x, y) {
      if (color === "red") {
        state.score += 180;
        state.bonusText = "RED BONUS +180 SCORE";
        spawnScorePop(x, y, "+180");
      } else if (color === "blue") {
        state.effects.slowTimer = 360;
        state.bonusText = "BLUE BONUS TUNNEL SLOW";
      } else {
        state.score += 80;
        state.effects.wideTimer = 360;
        state.bonusText = "YELLOW BONUS WIDE GAP";
        spawnScorePop(x, y, "+80");
      }
      state.bonusTimer = 140;
      SFX.bonus();
    }

    // 撃破位置にふわっと浮かんで消える得点テキスト。基地を倒した瞬間の
    // 手応えを一目で伝えるための軽量な演出(ロジックには影響しない)
    function spawnScorePop(x, y, text) {
      state.scorePops.push({ x, y, text, life: 36, maxLife: 36 });
    }

    function updateScorePops() {
      for (const p of state.scorePops) {
        p.y -= 0.6;
        p.life -= 1;
      }
      state.scorePops = state.scorePops.filter((p) => p.life > 0);
    }

    function drawScorePops() {
      ctx.font = RETRO.font(10);
      ctx.textAlign = "center";
      for (const p of state.scorePops) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = RETRO.gold;
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = "left";
    }

    function createExplosion(x, y, color) {
      const particles = [];
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.26;
        const speed = 1.4 + Math.random() * 3.1;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 30 + Math.floor(Math.random() * 12),
          maxLife: 42,
          color
        });
      }
      state.explosions.push(...particles);
    }

    // several large overlapping bursts, staggered slightly so it reads as one big blast
    function createShipDeathExplosion(x, y) {
      const colors = ["red", "yellow", "red", "yellow"];
      colors.forEach((color, i) => {
        const jitterX = x + (Math.random() - 0.5) * 14;
        const jitterY = y + (Math.random() - 0.5) * 14;
        const particles = [];
        const count = 18;
        for (let p = 0; p < count; p++) {
          const angle = (Math.PI * 2 * p) / count + Math.random() * 0.3;
          const speed = 2.2 + Math.random() * 5.5;
          particles.push({
            x: jitterX,
            y: jitterY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 55 + Math.floor(Math.random() * 25) + i * 4,
            maxLife: 90,
            color
          });
        }
        state.explosions.push(...particles);
      });
    }

    // freezes gameplay and plays a big explosion before GAME OVER appears (see the
    // "dying" block near the top of update())
    function triggerShipDeath() {
      if (state.dying.active || state.gameOver) return;
      state.dying.active = true;
      state.dying.timer = 0;
      state.running = false;
      createShipDeathExplosion(state.ship.x, state.ship.y);
    }

    function spawnBaseAtRight() {
      const x = canvas.width + 16;
      const col = state.columns[Math.max(0, canvas.width - 2)];
      if (!col) return;

      const width = 14 + Math.random() * 14;
      const maxProtrusion = Math.max(12, Math.min(28, (col.bottom - col.top) * 0.42));
      const protrusion = 12 + Math.random() * (maxProtrusion - 12);
      const side = Math.random() < 0.5 ? "top" : "bottom";
      const color = baseColors[(Math.random() * baseColors.length) | 0];

      if (side === "top") {
        state.bases.push({ x, y: col.top, w: width, h: protrusion, side, color });
      } else {
        state.bases.push({ x, y: col.bottom - protrusion, w: width, h: protrusion, side, color });
      }
    }

    function shiftBases(step) {
      for (let i = 0; i < step; i++) {
        for (const base of state.bases) {
          base.x -= 1;
        }
        if (Math.random() < tunnel.baseSpawnChance) {
          spawnBaseAtRight();
        }
      }
      state.bases = state.bases.filter((b) => b.x + b.w > -24);
    }

    function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
      const nearestX = Math.max(rx, Math.min(cx, rx + rw));
      const nearestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nearestX;
      const dy = cy - nearestY;
      return dx * dx + dy * dy <= cr * cr;
    }

    function fireVulcan() {
      if (!state.running) return;
      const shipSpeed = Math.max(1, Math.hypot(state.ship.vx, state.ship.vy));
      const bulletSpeed = shipSpeed * 10;
      state.bullets.push({
        x: state.ship.x + state.ship.radius + 6,
        y: state.ship.y,
        vx: bulletSpeed,
        vy: state.ship.vy * 0.12,
        radius: 3
      });
      SFX.vulcan();
    }

    function updateTunnel() {
      const drift = (Math.random() - 0.5) * tunnel.roughness;
      tunnel.centerVel += drift;
      tunnel.centerVel *= 0.96;
      tunnel.center += tunnel.centerVel;
      tunnel.center = Math.max(90, Math.min(canvas.height - 90, tunnel.center));

      const wave = Math.sin(state.frame * 0.012) * 22;
      const wideBonus = state.effects.wideTimer > 0 ? 24 : 0;
      const gapTarget = 190 + wave - Math.min(38, state.speed * 7) + wideBonus;
      tunnel.gap += (gapTarget - tunnel.gap) * 0.03;
      tunnel.gap = Math.max(tunnel.minGap, Math.min(tunnel.maxGap, tunnel.gap));
    }

    function updateColumns() {
      const step = state.scrollSpeed;
      for (let i = 0; i < step; i++) {
        state.columns.shift();
        updateTunnel();
        state.columns.push(makeColumn(tunnel.center, tunnel.gap));
      }
      shiftBases(step);
    }

    function updateShip() {
      const verticalThrust = 0.34;
      const horizontalThrust = 0.28;
      const drag = 0.985;
      // キー・スティック・傾きを合成した移動量（kit が効き具合をそろえている）
      const axis = kit.input.axis();
      state.ship.vx += horizontalThrust * axis.x;
      state.ship.vy += verticalThrust * axis.y;
      state.ship.vx *= drag;
      state.ship.vy *= drag;
      state.ship.x += state.ship.vx;
      state.ship.y += state.ship.vy;
      state.ship.x = Math.max(state.ship.radius + 8, Math.min(canvas.width - state.ship.radius - 8, state.ship.x));
      state.ship.y = Math.max(state.ship.radius, Math.min(canvas.height - state.ship.radius, state.ship.y));
      // 被弾後の無敵時間をここで消化する(0になるまでダメージを無効化)
      if (state.ship.invincibleFrames > 0) state.ship.invincibleFrames--;
    }

    // returns penetration amount in pixels (0 if no collision)
    function getCollisionPenetration() {
      const x = Math.floor(state.ship.x);
      const column = state.columns[x];
      if (!column) return 0;
      if (state.ship.y - state.ship.radius < column.top) {
        return column.top - (state.ship.y - state.ship.radius);
      }
      if (state.ship.y + state.ship.radius > column.bottom) {
        return (state.ship.y + state.ship.radius) - column.bottom;
      }
      return 0;
    }

    function updateStars() {
      for (const s of state.stars) {
        s.x -= state.scrollSpeed * s.z * 0.4;
        if (s.x < -2) {
          s.x = canvas.width + Math.random() * 16;
          s.y = Math.random() * canvas.height;
        }
      }
    }

    function updateBullets() {
      for (const b of state.bullets) {
        b.x += b.vx;
        b.y += b.vy;
      }

      const hitBases = new Set();
      const hitBullets = new Set();
      for (let i = 0; i < state.bullets.length; i++) {
        const b = state.bullets[i];
        for (let j = 0; j < state.bases.length; j++) {
          if (hitBases.has(j)) continue;
          const base = state.bases[j];
          if (circleRectHit(b.x, b.y, b.radius, base.x, base.y, base.w, base.h)) {
            hitBases.add(j);
            hitBullets.add(i);
            grantBaseBonus(base.color, base.x + base.w * 0.5, base.y + base.h * 0.5);
            createExplosion(base.x + base.w * 0.5, base.y + base.h * 0.5, base.color);
            break;
          }
        }
      }

      if (hitBases.size > 0) {
        state.bases = state.bases.filter((_, idx) => !hitBases.has(idx));
      }
      if (hitBullets.size > 0) {
        state.bullets = state.bullets.filter((_, idx) => !hitBullets.has(idx));
      }

      state.bullets = state.bullets.filter(
        (b) => b.x < canvas.width + 40 && b.y > -20 && b.y < canvas.height + 20
      );
    }

    function dropBomb() {
      if (!state.running) return;
      const initialVx = state.ship.vx * 0.6 + 1.2;
      state.bombs.push({
        x: state.ship.x - 6,
        y: state.ship.y + 6,
        vx: initialVx,
        vy: 0,
        radius: 6
      });
      SFX.bomb();
    }

    function updateBombs() {
      const gravity = 0.42;
      const toRemove = new Set();
      for (let i = 0; i < state.bombs.length; i++) {
        const b = state.bombs[i];
        b.vy += gravity;
        b.x += b.vx;
        b.y += b.vy;

        // hit base?
        for (let j = 0; j < state.bases.length; j++) {
          const base = state.bases[j];
          if (circleRectHit(b.x, b.y, b.radius, base.x, base.y, base.w, base.h)) {
            // explode and apply bonuses to affected bases within blast radius
            const blastR = 36;
            createExplosion(b.x, b.y, base.color);
            const removed = [];
            for (let k = 0; k < state.bases.length; k++) {
              const bb = state.bases[k];
              if (circleRectHit(b.x, b.y, blastR, bb.x, bb.y, bb.w, bb.h)) {
                grantBaseBonus(bb.color);
                removed.push(k);
              }
            }
            state.bases = state.bases.filter((_, idx) => !removed.includes(idx));
            toRemove.add(i);
            break;
          }
        }

        // hit floor or ceiling
        if (b.y > canvas.height - 4 || b.y < 4) {
          createExplosion(b.x, Math.max(4, Math.min(canvas.height - 4, b.y)), "red");
          toRemove.add(i);
        }
      }
      if (toRemove.size > 0) {
        state.bombs = state.bombs.filter((_, idx) => !toRemove.has(idx));
      }

      state.bombs = state.bombs.filter((b) => b.x > -60 && b.x < canvas.width + 60 && b.y < canvas.height + 200);
    }

    // --- HP 回復アイテム (ゆらゆら浮遊) ---
    function spawnHpItem() {
      const x = canvas.width + 24;
      // spawn within tunnel gap area near center of current column at right edge
      const col = state.columns[Math.max(0, canvas.width - 2)];
      let baseY = canvas.height / 2;
      if (col) {
        // choose a y between column.top + 16 and column.bottom - 16
        baseY = Math.max(col.top + 16, Math.min(col.bottom - 16, col.top + Math.random() * (col.bottom - col.top - 32)));
      } else {
        baseY = 40 + Math.random() * (canvas.height - 80);
      }
      const phase = Math.random() * Math.PI * 2;
      const item = {
        x,
        baseY,
        radius: 12,
        vx: 0.6 + Math.random() * 0.8,
        phase,
        bobAmp: 6 + Math.random() * 6
      };
      state.hpItems.push(item);
    }

    // パート3(落下)用のHP回復アイテム。spawnRescueFall()と同じく、
    // 画面下から湧いてシャフト幅に収まるx位置を取り、上へ流れる
    function spawnHpItemFall() {
      const row = state.fall.rows[canvas.height - 1];
      let baseX = canvas.width / 2;
      if (row) {
        const lo = row.left + 24;
        const hi = row.right - 24;
        baseX = hi > lo ? lo + Math.random() * (hi - lo) : (row.left + row.right) / 2;
      }
      const phase = Math.random() * Math.PI * 2;
      state.hpItems.push({
        mode: "v",
        x: baseX,
        baseX,
        y: canvas.height + 24,
        radius: 12,
        vx: 0.6 + Math.random() * 0.8,
        phase,
        bobAmp: 6 + Math.random() * 6
      });
    }

    function updateHpItems(fall) {
      // occasional spawn (不定期)
      const HP_SPAWN_CHANCE = 0.00064; // reduced to ~1/5 the previous rate
      if (Math.random() < HP_SPAWN_CHANCE) {
        if (fall) spawnHpItemFall(); else spawnHpItem();
      }

      const collected = new Set();
      for (let i = 0; i < state.hpItems.length; i++) {
        const it = state.hpItems[i];
        if (it.mode === "v") {
          // 落下シャフト用: 下から上へ流れ、左右にゆらぐ
          it.y -= state.scrollSpeed * 0.9 + it.vx;
          it.x = it.baseX + Math.sin(state.frame * 0.06 + it.phase) * it.bobAmp;
        } else {
          it.x -= state.scrollSpeed * 0.9 + it.vx;
          // bobbing using global frame so movement is smooth
          it.y = it.baseY + Math.sin(state.frame * 0.06 + it.phase) * it.bobAmp;
        }

        // collision with ship
        const dx = it.x - state.ship.x;
        const dy = it.y - state.ship.y;
        const dist2 = dx * dx + dy * dy;
        const r = it.radius + state.ship.radius;
        if (dist2 <= r * r) {
          collected.add(i);
          // heal
          state.ship.hp = Math.min(100, (state.ship.hp || 0) + 10);
          SFX.pickup();
          state.bonusText = "HP +10";
          state.bonusTimer = 90;
          // small visual feedback
          createExplosion(it.x, it.y, "blue");
        }
      }

      if (collected.size > 0) {
        state.hpItems = state.hpItems.filter((_, idx) => !collected.has(idx));
      }

      // remove offscreen
      state.hpItems = state.hpItems.filter((it) => it.x > -40 && it.y > -40 && it.y < canvas.height + 40);
    }

    function drawHpItems() {
      if (!hpItemImg.complete || !hpItemImg.naturalWidth) return;
      const size = 50; // 40 * 1.25
      // no shadowBlur — cost multiplies per floating item, and this runs every frame
      for (const it of state.hpItems) {
        ctx.drawImage(hpItemImg, it.x - size / 2, it.y - size / 2, size, size);
      }
    }

    // --- CNP 救出対象 (浮遊する仲間) ---
    function spawnRescue() {
      const col = state.columns[Math.max(0, canvas.width - 2)];
      let baseY = canvas.height / 2;
      if (col) {
        baseY = Math.max(col.top + 30, Math.min(col.bottom - 30, col.top + Math.random() * (col.bottom - col.top - 60)));
      } else {
        baseY = 50 + Math.random() * (canvas.height - 100);
      }
      state.rescues.push({
        ch: pickCnpChar(),
        mode: "h",
        x: canvas.width + 40,
        baseX: 0,
        sx: canvas.width + 40,
        baseY,
        y: baseY,
        sy: baseY,
        radius: CNP_RESCUE.radius,
        vx: 0.3 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        // 上下のボビングに横のスウェイを重ねると、ただ流れるのではなく
        // 「その場に浮いているものが流されている」ように見える
        bobAmp: 9 + Math.random() * 7,
        swayAmp: 4 + Math.random() * 4,
        tilt: 0.06 + Math.random() * 0.06
      });
    }

    // パート3(落下)用。縦スクロールなので画面下から湧いて上へ流れる。
    // 横穴と違い左右の壁が近いため、シャフトの幅に収まる範囲にx位置を取る。
    // forceChを渡すと、通常の重み付き抽選の代わりにそのキャラを出す
    // (落下ステージの保証出現で使う)
    function spawnRescueFall(forceCh) {
      const row = state.fall.rows[canvas.height - 1];
      let baseX = canvas.width / 2;
      if (row) {
        const lo = row.left + 34;
        const hi = row.right - 34;
        baseX = hi > lo ? lo + Math.random() * (hi - lo) : (row.left + row.right) / 2;
      }
      state.rescues.push({
        ch: forceCh || pickCnpChar(),
        mode: "v",
        x: baseX,
        baseX,
        sx: baseX,
        baseY: 0,
        y: canvas.height + 40,
        sy: canvas.height + 40,
        radius: CNP_RESCUE.radius,
        vx: 0.3 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        bobAmp: 9 + Math.random() * 7,
        // 縦モードでは揺れが壁への接触に直結するので、振幅は控えめにする
        swayAmp: 5 + Math.random() * 4,
        tilt: 0.06 + Math.random() * 0.06
      });
    }

    // fall = パート3(落下)中かどうか。スクロール方向が90度変わる
    function updateRescues(fall) {
      if (Math.random() < CNP_RESCUE.spawnChance) {
        if (fall) spawnRescueFall(); else spawnRescue();
      }

      for (let i = 0; i < state.rescueFlash.length; i++) {
        if (state.rescueFlash[i] > 0) state.rescueFlash[i]--;
      }

      const rescued = new Set();
      for (let i = 0; i < state.rescues.length; i++) {
        const it = state.rescues[i];
        // sx/sy が描画と当たり判定の両方で使う実効座標（揺れ込み）
        if (it.mode === "v") {
          it.y -= state.scrollSpeed * 0.85 + it.vx;
          it.sy = it.y + Math.sin(state.frame * 0.05 + it.phase) * it.bobAmp * 0.4;
          it.sx = it.baseX + Math.cos(state.frame * 0.037 + it.phase) * it.swayAmp;
        } else {
          it.x -= state.scrollSpeed * 0.85 + it.vx;
          it.sy = it.baseY + Math.sin(state.frame * 0.05 + it.phase) * it.bobAmp;
          it.sx = it.x + Math.cos(state.frame * 0.037 + it.phase) * it.swayAmp;
        }

        const dx = it.sx - state.ship.x;
        const dy = it.sy - state.ship.y;
        const dist2 = dx * dx + dy * dy;
        const r = it.radius + state.ship.radius;
        if (dist2 <= r * r) {
          rescued.add(i);
          const tier = it.ch.tier;
          state.score += tier.score;
          state.ship.hp = Math.min(100, (state.ship.hp || 0) + tier.heal);
          state.rescuedCount++;
          state.rescuedChars[it.ch.index] = true;
          state.rescueFlash[it.ch.index] = CNP_ROSTER.flash;
          state.collected[it.ch.index] = true;
          state.bonusText = "RESCUED " + it.ch.label + " +" + tier.score;
          // 高レアほど余韻を長く。取れたことが演出の大きさで分かるようにする
          state.bonusTimer = 120 + tier.rank * 12;
          SFX.bonus();
          createExplosion(it.sx, it.sy, tier.rank >= 4 ? "yellow" : "blue");
          if (tier.rank >= 3) createExplosion(it.sx, it.sy, "yellow");
        }
      }

      if (rescued.size > 0) {
        state.rescues = state.rescues.filter((_, idx) => !rescued.has(idx));
      }
      state.rescues = state.rescues.filter((it) => (it.mode === "v" ? it.y > -80 : it.x > -80));
    }

    // 画像が未配置のスロット用の仮絵。原点はキャラ中心。
    // 差し替え待ちだと一目で分かるよう「?」を入れてある
    // mono を立てると色を落として黒シルエットになる（ロスターの未救出枠用）
    function drawCnpPlaceholder(ch, s, mono) {
      ctx.fillStyle = mono ? "hsl(220,14%,24%)" : `hsl(${ch.hue},70%,62%)`;
      ctx.beginPath();
      ctx.ellipse(0, s * 0.16, s * 0.24, s * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, -s * 0.16, s * 0.23, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s * 0.20, -s * 0.30);
      ctx.lineTo(-s * 0.08, -s * 0.46);
      ctx.lineTo(-s * 0.02, -s * 0.28);
      ctx.closePath();
      ctx.moveTo(s * 0.20, -s * 0.30);
      ctx.lineTo(s * 0.08, -s * 0.46);
      ctx.lineTo(s * 0.02, -s * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = `hsl(${ch.hue},55%,26%)`;
      ctx.fillRect(-s * 0.23, -s * 0.21, s * 0.46, s * 0.09);
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.font = `${Math.round(s * 0.26)}px "Press Start 2P", monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("?", 0, s * 0.18);
    }

    function drawRescues() {
      const s = CNP_RESCUE.size;
      for (const it of state.rescues) {
        const ch = it.ch;
        const rank = ch.tier.rank;
        const pulse = 0.5 + 0.5 * Math.sin(state.frame * 0.07 + it.phase);

        // 背後のオーラ。接地影が置けない洞窟内で「浮いている」ことを読ませる役。
        // 高レアほど広く濃くして、遠目でも価値が分かるようにしている
        const glowR = s * (0.5 + rank * 0.045 + pulse * 0.1);
        const glowA = 0.3 + rank * 0.055;
        const grd = ctx.createRadialGradient(it.sx, it.sy, s * 0.12, it.sx, it.sy, glowR);
        grd.addColorStop(0, `hsla(${ch.hue},95%,72%,${glowA})`);
        grd.addColorStop(0.55, `hsla(${ch.hue},90%,60%,${glowA * 0.45})`);
        grd.addColorStop(1, `hsla(${ch.hue},85%,55%,0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(it.sx, it.sy, glowR, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(it.sx, it.sy);
        ctx.rotate(Math.sin(state.frame * 0.03 + it.phase) * it.tilt);
        if (ch.ready) {
          ctx.drawImage(ch.img, -s / 2, -s / 2, s, s);
        } else {
          drawCnpPlaceholder(ch, s);
        }
        ctx.restore();

        // 救出フィールドの弧。別パスで引く（1パスに繋げると弧同士が線で結ばれる）。
        // rank4以上は逆回転の弧をもう1周足して、最上位だと一目で分かるようにする
        ctx.strokeStyle = `hsla(${ch.hue},95%,70%,${0.35 + pulse * 0.3})`;
        ctx.lineWidth = 2;
        const ringR = s * 0.46;
        const a0 = state.frame * 0.035 + it.phase;
        for (let k = 0; k < 2; k++) {
          ctx.beginPath();
          ctx.arc(it.sx, it.sy, ringR, a0 + Math.PI * k, a0 + Math.PI * k + Math.PI * 0.55);
          ctx.stroke();
        }
        if (rank >= 4) {
          ctx.lineWidth = 1.5;
          const a1 = -state.frame * 0.05 + it.phase;
          for (let k = 0; k < 2; k++) {
            ctx.beginPath();
            ctx.arc(it.sx, it.sy, ringR * 1.2, a1 + Math.PI * k, a1 + Math.PI * k + Math.PI * 0.4);
            ctx.stroke();
          }
        }

        // レア度ピップ。得点表示は救出後にしか出ないので、取る前に価値を
        // 判断できる手掛かりを足元に置く（rankぶんの菱形）
        const pipY = it.sy + s * 0.5;
        const pipGap = 7;
        const pipX = it.sx - ((rank - 1) * pipGap) / 2;
        ctx.fillStyle = `hsla(${ch.hue},95%,${68 + rank * 3}%,0.95)`;
        for (let k = 0; k < rank; k++) {
          const px = pipX + k * pipGap;
          ctx.beginPath();
          ctx.moveTo(px, pipY - 3);
          ctx.lineTo(px + 2.6, pipY);
          ctx.lineTo(px, pipY + 3);
          ctx.lineTo(px - 2.6, pipY);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    // 未救出スロットに出すシルエット。素材は透過切り抜き(四隅のalphaが0)なので、
    // source-in で塗り潰すとキャラの輪郭だけが残る。
    // 誰がまだ埋まっていないかを額の中で読ませるのが目的なので、色は落としつつ
    // hue は残す(11枠が同じ灰色の塊に見えないように)。
    // 額の2倍解像度で焼いてから縮小描画し、輪郭のジャギーを均す。
    const CNP_SIL_PX = CNP_ROSTER.slot * 2;

    function cnpSilhouette(ch) {
      if (ch.sil) return ch.sil;
      // 画像がまだ来ていないうちはキャッシュを作らない(次フレームで再試行される)
      if (!ch.ready) return null;
      const c = document.createElement("canvas");
      c.width = c.height = CNP_SIL_PX;
      const g = c.getContext("2d");
      g.drawImage(ch.img, 0, 0, CNP_SIL_PX, CNP_SIL_PX);
      g.globalCompositeOperation = "source-in";
      g.fillStyle = `hsl(${ch.hue},38%,26%)`;
      g.fillRect(0, 0, CNP_SIL_PX, CNP_SIL_PX);
      ch.sil = c;
      return c;
    }

    // 画面上段の額縁ロスター。収集状況(state.collected)は resetGame() で
    // 毎回0/11に戻る(1プレイ完結の仕様)。
    // このプレイで救出した枠だけを起こして、今どれを取ったのかも同時に読ませる。
    //   未収集       … 実際の絵のシルエット + 減光した琥珀の枠
    //   収集済み     … 絵を落として表示 + くすんだキャラ色の枠
    //   今回救出      … 絵を全光量で表示 + キャラ色の枠
    // 未収集に「?」の仮絵を出さないこと。あれは素材未配置を知らせる開発用の絵で、
    // 「まだ取っていない」の意味に流用すると11枠が全部同じ顔になる。
    function drawRescueRoster() {
      const n = cnpChars.length;
      const s = CNP_ROSTER.slot;
      const totalW = n * s + (n - 1) * CNP_ROSTER.gap;
      const x0 = Math.round((canvas.width - totalW) / 2);
      const y = CNP_ROSTER.y;

      for (let i = 0; i < n; i++) {
        const ch = cnpChars[i];
        const x = x0 + i * (s + CNP_ROSTER.gap);
        const got = state.rescuedChars[i];   // このプレイで救出した
        const have = state.collected[i];     // 収集済み(resetGameで毎プレイ戻る)
        const fl = state.rescueFlash[i] > 0 ? state.rescueFlash[i] / CNP_ROSTER.flash : 0;

        // 額の中身。走査線の上に乗るので下地はしっかり沈めておく
        ctx.fillStyle = have ? "rgba(6,10,20,0.92)" : "rgba(4,6,12,0.82)";
        ctx.fillRect(x, y, s, s);

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, s, s);
        ctx.clip();
        ctx.translate(x + s / 2, y + s / 2 + s * 0.04);
        // 今回の救出だけ全光量。通算で持っているだけの枠は落として、
        // 「今回どれを取ったか」が一目で分かるようにする
        if (!got) ctx.globalAlpha = have ? 0.42 : 1;
        const d = s * 0.88;
        if (have && ch.ready) {
          ctx.drawImage(ch.img, -d / 2, -d / 2, d, d);
        } else {
          const sil = cnpSilhouette(ch);
          if (sil) {
            ctx.drawImage(sil, -d / 2, -d / 2, d, d);
          } else {
            // 素材そのものが届いていないときだけ仮絵に落とす
            drawCnpPlaceholder(ch, s * 0.8, !have);
          }
        }
        ctx.restore();

        // 額縁。未収集は琥珀を落として沈ませ、収集済みはキャラ色で起こす
        ctx.lineWidth = 2;
        ctx.strokeStyle = got
          ? `hsla(${ch.hue},90%,${66 + fl * 30}%,${0.85 + fl * 0.15})`
          : have
            ? `hsla(${ch.hue},45%,52%,0.55)`
            : "rgba(232, 197, 106, 0.26)";
        ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);

        // 救出した瞬間だけ額が白く光る（どの枠が埋まったか視線を誘導する）
        if (fl > 0) {
          ctx.fillStyle = `rgba(255,255,255,${fl * 0.45})`;
          ctx.fillRect(x, y, s, s);

          // 額の外側に広がるリングを重ねて、達成感をもう一段強める
          const ringExpand = (1 - fl) * 10;
          ctx.strokeStyle = `hsla(${ch.hue},90%,70%,${fl * 0.8})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(x - ringExpand, y - ringExpand, s + ringExpand * 2, s + ringExpand * 2);
        }
      }

      // 収集率はこのプレイぶん(resetGame()で毎回0/11に戻る)。
      // 全員そろったら琥珀で点滅させて達成を知らせる
      const done = state.collected.reduce((a, b) => a + (b ? 1 : 0), 0);
      const complete = done === n;
      ctx.fillStyle = complete && !RETRO.blinkOn() ? RETRO.ink : RETRO.gold;
      ctx.font = RETRO.font(9);
      ctx.textAlign = "center";
      ctx.fillText(complete ? "COMPLETE!" : `${done} / ${n}`, canvas.width / 2, y + s + 11);
      ctx.textAlign = "left";
    }

    // CLEAR画面用の1枠。見た目の分岐(救出済みは絵、未救出はシルエット)は
    // drawRescueRoster()と揃えるが、こちらは常に全光量で表示する
    // (クリア画面はこのプレイの結果一覧が主目的で、「今回どれを取ったか」の
    // 経時的な強調は不要なため)。
    // gctxを引数に取るのは、Xシェア用カード(buildShareCardCanvas)を描く
    // オフスクリーンcanvasからも同じ見た目を再利用するため
    function drawClearRosterSlot(gctx, ch, x, y, s) {
      const got = state.rescuedChars[ch.index];

      gctx.fillStyle = got ? "rgba(6,10,20,0.92)" : "rgba(4,6,12,0.82)";
      gctx.fillRect(x, y, s, s);

      gctx.save();
      gctx.beginPath();
      gctx.rect(x, y, s, s);
      gctx.clip();
      gctx.translate(x + s / 2, y + s / 2 + s * 0.04);
      const d = s * 0.88;
      if (got && ch.ready) {
        gctx.drawImage(ch.img, -d / 2, -d / 2, d, d);
      } else {
        const sil = cnpSilhouette(ch);
        if (sil) {
          gctx.drawImage(sil, -d / 2, -d / 2, d, d);
        } else if (gctx === ctx) {
          // プレースホルダはメインcanvasのグローバル ctx 前提で書かれているため、
          // 共有カード側(画像が全て読み込み済みのはずの場面)では出さない
          drawCnpPlaceholder(ch, s * 0.8, !got);
        }
      }
      gctx.restore();

      gctx.lineWidth = 2;
      gctx.strokeStyle = got ? `hsla(${ch.hue},90%,66%,0.9)` : "rgba(232, 197, 106, 0.26)";
      gctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
    }

    // メイン画像を挟む2列に11体を振り分けて並べる。今回の救出結果が
    // 画像を額縁のように取り囲む見せ方にする(画面上部の額縁ロスターとは別に表示)
    function drawClearRoster(imgX, imgW) {
      const n = cnpChars.length;
      const s = 52;
      const gap = 10;
      const leftCount = Math.ceil(n / 2);
      // 上はSCORE/額縁ロスター、右上はHPバーと被らない下限に揃える
      const colTop = 92;
      const colBottom = canvas.height - 20;
      const midY = (colTop + colBottom) / 2;
      const leftX = imgX / 2;
      const rightX = imgX + imgW + (canvas.width - (imgX + imgW)) / 2;

      const drawColumn = (start, count, cx) => {
        const totalH = count * s + (count - 1) * gap;
        let y = midY - totalH / 2;
        for (let i = start; i < start + count; i++) {
          drawClearRosterSlot(ctx, cnpChars[i], cx - s / 2, y, s);
          y += s + gap;
        }
      };

      drawColumn(0, leftCount, leftX);
      drawColumn(leftCount, n - leftCount, rightX);
    }

    // Xシェア用のリザルトカードを、ゲーム中とは別のオフスクリーンcanvasに描く。
    // 常にゲーム内HUD(走査線・SCORE/SPD/TIME等)を含めず、スコア・救出結果
    // だけをすっきり読める専用レイアウトにする。動画中の見た目に依存しないよう
    // メイン画像は常に静止画(clearImg)を使う
    function buildShareCardCanvas() {
      const W = 1200, H = 675;
      const card = document.createElement("canvas");
      card.width = W;
      card.height = H;
      const g = card.getContext("2d");

      g.fillStyle = "#06070C";
      g.fillRect(0, 0, W, H);
      const grad = g.createRadialGradient(W / 2, H * 0.35, 60, W / 2, H * 0.35, W * 0.7);
      grad.addColorStop(0, "rgba(69,32,102,0.35)");
      grad.addColorStop(1, "rgba(6,7,12,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, W, H);

      g.strokeStyle = RETRO.gold;
      g.lineWidth = 4;
      g.strokeRect(10, 10, W - 20, H - 20);

      g.textAlign = "center";
      g.fillStyle = RETRO.gold;
      g.font = RETRO.font(16);
      g.fillText("SAKUYA SCRAMBLE", W / 2, 52);
      g.fillStyle = RETRO.ink;
      g.font = RETRO.font(40);
      g.fillText("CLEAR!", W / 2, 108);

      if (clearImg.complete && clearImg.naturalWidth) {
        const imgW = 460;
        const imgH = imgW * (clearImg.naturalHeight / clearImg.naturalWidth);
        const imgX = 60;
        const imgY = 150;
        g.save();
        g.shadowColor = "rgba(0,0,0,0.5)";
        g.shadowBlur = 20;
        g.drawImage(clearImg, imgX, imgY, imgW, imgH);
        g.restore();
        g.strokeStyle = RETRO.gold;
        g.lineWidth = 2;
        g.strokeRect(imgX + 1, imgY + 1, imgW - 2, imgH - 2);
      }

      const rescuedCount = state.rescuedChars.reduce((a, b) => a + (b ? 1 : 0), 0);
      g.textAlign = "left";
      g.fillStyle = RETRO.dim;
      g.font = RETRO.font(14);
      g.fillText("SCORE", 560, 210);
      g.fillStyle = RETRO.gold;
      g.font = RETRO.font(44);
      g.fillText(String(Math.floor(state.score)).padStart(7, "0"), 560, 260);

      g.fillStyle = RETRO.dim;
      g.font = RETRO.font(14);
      g.fillText("RESCUE", 560, 320);
      g.fillStyle = rescuedCount === cnpChars.length ? RETRO.gold : RETRO.ink;
      g.font = RETRO.font(34);
      g.fillText(`${rescuedCount} / ${cnpChars.length}`, 560, 358);

      const n = cnpChars.length;
      const s = 66, gap = 10;
      const totalW = n * s + (n - 1) * gap;
      const x0 = (W - totalW) / 2;
      for (let i = 0; i < n; i++) {
        drawClearRosterSlot(g, cnpChars[i], x0 + i * (s + gap), 440, s);
      }

      g.textAlign = "center";
      g.fillStyle = RETRO.gold;
      g.font = RETRO.font(16);
      g.fillText("#咲耶スクランブル", W / 2, 570);
      g.fillStyle = RETRO.dim;
      g.font = RETRO.font(11);
      g.fillText("sakuya.naoblock.jp", W / 2, 598);

      return card;
    }

    function buildShareText() {
      const rescuedCount = state.rescuedChars.reduce((a, b) => a + (b ? 1 : 0), 0);
      const score = Math.floor(state.score);
      return `咲耶スクランブルをクリア！\nスコア ${score.toLocaleString()}\n救出 ${rescuedCount}/${cnpChars.length}\n#咲耶スクランブル`;
    }


    // --- Mega HP (stage-once, full heal) ---
    function spawnMegaHp() {
      const x = canvas.width + 40;
      const col = state.columns[Math.max(0, canvas.width - 2)];
      let baseY = canvas.height / 2;
      if (col) baseY = Math.max(col.top + 24, Math.min(col.bottom - 24, col.top + Math.random() * (col.bottom - col.top - 48)));
      state.megaHp = {
        x,
        baseY,
        y: baseY,
        vx: 0.5 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        bobAmp: 8,
        radius: 18,
        hue: Math.floor(Math.random() * 360)
      };
      state.megaHpSpawned = true;
    }

    function updateMegaHp() {
      if (!state.megaHp) {
        // check spawn timing: spawn once per stage in later half (60%)
        const stageSecs = state.stageDuration + (state.stage - 1) * 10;
        const stageFrames = Math.round(stageSecs * 60);
        const spawnFrame = Math.round(stageFrames * 0.6);
        if (!state.megaHpSpawned && state.stageTimer >= spawnFrame) {
          spawnMegaHp();
        }
        return;
      }

      const it = state.megaHp;
      it.x -= state.scrollSpeed * 0.9 + it.vx;
      it.y = it.baseY + Math.sin(state.frame * 0.06 + it.phase) * it.bobAmp;

      // collision with ship
      const dx = it.x - state.ship.x;
      const dy = it.y - state.ship.y;
      const dist2 = dx * dx + dy * dy;
      const r = it.radius + state.ship.radius;
      if (dist2 <= r * r) {
        // full heal
        state.ship.hp = 100;
        state.ship.invincibleFrames = 0;
        state.bonusText = "HP FULL";
        SFX.bonus();
        state.bonusTimer = 140;
        createExplosion(it.x, it.y, "yellow");
        state.megaHp = null;
      }

      // remove if offscreen
      if (it.x < -80) state.megaHp = null;
    }

    function drawMegaHp() {
      const it = state.megaHp;
      if (!it) return;
      // pulsing radial glow with hue
      const pulse = 0.5 + 0.5 * Math.sin(state.frame * 0.08 + it.phase);
      const outerR = it.radius * (1.6 + pulse * 0.6);
      const grd = ctx.createRadialGradient(it.x, it.y, it.radius * 0.2, it.x, it.y, outerR);
      const h = it.hue;
      grd.addColorStop(0, `hsla(${h},100%,75%,0.98)`);
      grd.addColorStop(0.4, `hsla(${h},90%,60%,0.55)`);
      grd.addColorStop(1, `hsla(${(h + 40) % 360},80%,50%,0.08)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(it.x, it.y, outerR, 0, Math.PI * 2);
      ctx.fill();

      // central badge (white circle)
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.radius * 0.8, 0, Math.PI * 2);
      ctx.fill();

      // plus sign
      ctx.fillStyle = `hsl(${h},70%,30%)`;
      ctx.fillRect(it.x - 3, it.y - 10, 6, 20);
      ctx.fillRect(it.x - 10, it.y - 3, 20, 6);
    }

    // Arena bullets during stage intro
    // return arena parameters based on stage (difficulty scales with stage)
    function getArenaParams(stage) {
      const s = Math.max(1, stage);
      // stage 1 = 66 frames between waves (~1.1s); each stage -5 frames; floor 20
      const spawnInterval = Math.max(20, 66 - (s - 1) * 5);
      // fixed speed in px/frame: stage 1 = 1.8, each stage +0.4
      const bulletSpeed = 1.8 + (s - 1) * 0.4;
      return { spawnInterval, bulletSpeed };
    }
    function spawnArenaBullets() {
      const shipX = state.ship.x;
      const shipY = state.ship.y;
      const params = getArenaParams(state.stage);
      const speed = params.bulletSpeed; // fixed speed, independent of ship velocity
      const margin = 12;
      // all 4 sides always fire
      const positions = [
        { x: -margin, y: Math.random() * canvas.height },
        { x: canvas.width + margin, y: Math.random() * canvas.height },
        { x: Math.random() * canvas.width, y: -margin },
        { x: Math.random() * canvas.width, y: canvas.height + margin }
      ];
      for (const p of positions) {
        const dx = shipX - p.x;
        const dy = shipY - p.y;
        const len = Math.hypot(dx, dy) || 1;
        const vx = (dx / len) * speed;
        const vy = (dy / len) * speed;
        state.arena.bullets.push({ x: p.x, y: p.y, vx, vy, radius: 4 });
      }
    }

    function updateArenaBullets() {
      // spawn timing
      state.arena.spawnTimer++;
        const params = getArenaParams(state.stage);
        if (state.arena.spawnTimer >= params.spawnInterval) {
          state.arena.spawnTimer = 0;
          spawnArenaBullets();
        }

      const toRemove = new Set();
      for (let i = 0; i < state.arena.bullets.length; i++) {
        const b = state.arena.bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        // collision with ship
        const dx = b.x - state.ship.x;
        const dy = b.y - state.ship.y;
        if (dx * dx + dy * dy <= (b.radius + state.ship.radius) * (b.radius + state.ship.radius)) {
          toRemove.add(i);
          // allow one-time shield when laser is fully charged
          if (!tryUseLaserShield() && !(state.ship.invincibleFrames > 0)) {
            // reset any in-progress laser charge when actually taking damage
            releaseLaserChargeOnHit();
            state.ship.hp = Math.max(0, state.ship.hp - 5);
            state.ship.invincibleFrames = 18;
            state.portrait.hitTimer = 18;
            SFX.hit();
            createExplosion(b.x, b.y, "red");
            if (state.ship.hp <= 0) {
              triggerShipDeath();
            }
          }
        }
        // remove offscreen far
        if (b.x < -120 || b.x > canvas.width + 120 || b.y < -120 || b.y > canvas.height + 120) {
          toRemove.add(i);
        }
      }
      if (toRemove.size > 0) {
        state.arena.bullets = state.arena.bullets.filter((_, idx) => !toRemove.has(idx));
      }
    }

    function drawArenaBullets() {
      for (const b of state.arena.bullets) {
        ctx.fillStyle = "rgba(255,80,60,0.95)";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,160,140,0.35)";
        ctx.fillRect(b.x - 6, b.y - 1, 12, 2);
      }
    }

    function updateExplosions() {
      for (const p of state.explosions) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life -= 1;
      }
      state.explosions = state.explosions.filter((p) => p.life > 0);
    }

    // レーザーのチャージ/ビーム発射中は自動連射を止める。stopLaserCharge()の
    // 「タップならバルカン」判定と競合しないよう、あくまで手動発射(startLaserCharge/
    // stopLaserCharge)とは別経路でfireVulcan()を呼ぶだけに留める
    // 自動連射の間隔とオン/オフは kit（controls.autoFire）が持ち、撃つ瞬間にここが呼ばれる
    function autoFireShot() {
      if (!state.running || state.dying.active) return;
      if (state.fall.active && state.fall.landing.active) return; // 着陸チャレンジ中はバルカン停止
      if (state.laser.charging || state.laser.beam) return;
      fireVulcan();
    }

    function update() {
      // always advance global frame (keeps animations consistent) and caption timer
      state.frame++;
      if (state.captionTimer > 0) state.captionTimer--;
      if (state.portrait.hitTimer > 0) state.portrait.hitTimer--;

      // HP hit 0: freeze gameplay and play the big explosion before GAME OVER shows
      if (state.dying.active) {
        state.dying.timer++;
        updateExplosions();
      updateScorePops();
        state.displayScore += (state.score - state.displayScore) * 0.18;
        if (state.dying.timer >= state.dying.duration) {
          state.dying.active = false;
          state.gameOver = true;
          // 演出動画・ジングル・結果画面は kit が出す
          finishRun(false);
        }
        return;
      }

      // handle goal hold countdown (runs even while paused)
      if (state.goalHold && state.goalHold.active) {
        state.goalHold.frames--;
        // update arena bullets during goal hold
        updateArenaBullets();
        if (state.goalHold.frames <= 0) {
          state.goalHold.active = false;
          state.pendingStageAdvance = false;
          // part 2 (arena dodge) cleared — the floor opens, begin the part 3 fall
          beginFall();
        }
      }

      // part 3: vertical fall through the shaft, separate from the tunnel/arena flow above
      if (state.fall.active) {
        if (!state.running) return;

        // intro: bullets already stopped, ship rotates 90° while easing downward —
        // no screen wipe, so the transition reads as continuing straight down
        if (state.fall.introActive) {
          state.fall.introTimer++;
          const p = Math.min(1, state.fall.introTimer / state.fall.introDuration);
          const eased = 1 - Math.pow(1 - p, 2); // ease-out, so the descent starts gently and picks up
          // rotate nose-up (negative = counter-clockwise in canvas' y-down space)
          state.fall.shipAngle = p * (-Math.PI / 2);
          // ship keeps easing toward the top of the shaft instead of sitting still
          state.ship.y = state.fall.introStartY + (70 - state.fall.introStartY) * eased;
          // scroll speed ramps up from 0 instead of freezing, so motion never fully stops
          state.scrollSpeed = state.speed * 0.7 * eased;
          updateStars();
          updateExplosions();
      updateScorePops();
          updateLaser();
          state.displayScore += (state.score - state.displayScore) * 0.18;
          if (p >= 1) {
            state.fall.introActive = false;
            state.fall.timer = 0;
          }
          return;
        }

        // landing: プレイヤー操作の着陸チャレンジ。バルカン停止・スクロール停止のうえで
        // Xキー(ブースター)で降下、左右で位置合わせして着陸マーカーを狙う
        if (state.fall.landing.active) {
          state.scrollSpeed = 0;
          updateStars();
          updateExplosions();
      updateScorePops();
          state.displayScore += (state.score - state.displayScore) * 0.18;

          const L = state.fall.landing;
          const groundY = canvas.height - 70;

          // 着地目標は狙いを定めている間もタイミングを読ませるため、演出中と
          // 着地後を除いて常に左右へ往復させる(位置合わせ中の静止フェーズも含む)
          if (!L.approachActive && !L.resolved && L.targetMoveHi > L.targetMoveLo) {
            L.targetMoveTimer++;
            const moveCenter = (L.targetMoveLo + L.targetMoveHi) / 2;
            const moveAmp = (L.targetMoveHi - L.targetMoveLo) / 2;
            const moveSpeed = (Math.PI * 2) / 240; // 4秒(60fps)で1往復
            L.targetX = moveCenter + moveAmp * Math.sin(L.targetMoveTimer * moveSpeed);
          }

          if (L.approachActive) {
            // 演出フェーズ: まだ操作を渡さず、洞窟が広い最終チャンバーへ開けていく。
            // スクロールはゆっくり続け、「奥へ進んでいる」感を切らさない
            L.approachTimer++;
            state.scrollSpeed = state.speed * 0.35;
            updateFallRows();
            const targetGap = 300; // ドッキング用の広い最終空間
            fallTunnel.gap += (targetGap - fallTunnel.gap) * 0.045;
            // 機体はまだ自動操縦。徐々にシャフト中央・一定の高さへ寄せて、
            // 着地チャレンジの開始位置を整える。
            // yを合わせずにいると、直前の縦シャフトで既に低い位置にいた場合、
            // 自由落下フェーズに入った瞬間に着地判定が出て何もできず終わってしまうため、
            // 必ず同じ高さ(70)から始まるようにする
            state.ship.x += (fallTunnel.center - state.ship.x) * 0.03;
            state.ship.y += (70 - state.ship.y) * 0.05;
            state.ship.vx = 0;
            state.ship.vy = 0;

            if (L.approachTimer >= L.approachDuration) {
              L.approachActive = false;
              const row = state.fall.rows[Math.floor(state.ship.y)] || state.fall.rows[state.fall.rows.length - 1];
              const lo = row ? row.left + 40 : 70;
              const hi = row ? row.right - 40 : canvas.width - 70;
              // 固定位置ではなく、この範囲を往復し続ける可動目標にする。
              // 開始位相はランダムにして、毎回同じ動きの読み合いにならないようにする
              L.targetMoveLo = lo;
              L.targetMoveHi = hi;
              L.targetMoveTimer = Math.random() * 1000;
              // すぐには落とさず、いったん完全静止させて狙いを整える猶予を挟む
              L.hoverActive = true;
              L.hoverTimer = 0;
              showCaption("動く着地目標に合わせて降下せよ！", 90);
            }
            return;
          }

          if (L.hoverActive) {
            // 静止フェーズ: 重力はまだかからず、位置合わせだけできる
            L.hoverTimer++;
            const horizontalThrust = 0.28;
            const drag = 0.985;
            state.ship.vx += horizontalThrust * kit.input.axis().x;
            state.ship.vx *= drag;
            state.ship.x += state.ship.vx;
            const row = state.fall.rows[Math.floor(state.ship.y)] || state.fall.rows[state.fall.rows.length - 1];
            if (row) {
              state.ship.x = Math.max(row.left + state.ship.radius + 4, Math.min(row.right - state.ship.radius - 4, state.ship.x));
            }
            state.ship.vy = 0; // 完全静止

            if (L.hoverTimer >= L.hoverDuration) {
              L.hoverActive = false;
              showCaption("自由落下開始！Xでブレーキ噴射", 90);
            }
            return;
          }

          if (!L.resolved) {
            L.timer++;

            // 横方向: 通常飛行と同じ操作感で、左右キー(ジャイロ含む)のみ反映
            const horizontalThrust = 0.28;
            const drag = 0.985;
            state.ship.vx += horizontalThrust * kit.input.axis().x;
            state.ship.vx *= drag;
            state.ship.x += state.ship.vx;
            const row = state.fall.rows[Math.floor(state.ship.y)] || state.fall.rows[state.fall.rows.length - 1];
            if (row) {
              state.ship.x = Math.max(row.left + state.ship.radius + 4, Math.min(row.right - state.ship.radius - 4, state.ship.x));
            }

            // 縦方向: 静止フェーズを終えると重力で自然に落下が始まる(常に加速)。
            // Xキーでブレーキ噴射をかけて減速し、着地の瞬間に速度を殺せるかが腕の見せ所。
            // ブレーキ加速度(0.09)は重力(0.035)より強いので、当て続ければ逆に浮上もできる
            // (下げすぎたときの立て直し用。抜けば重力がまた効いてくる)。
            // ただし燃料は無限ではなく、timeLimit(30秒)を超えると噴射が止まり、
            // 以降は純粋な自由落下のみで強制的に決着させる(詰み防止)
            const gravity = 0.035;
            const brakeAccel = 0.09;
            const maxFallSpeed = 2.2;
            const maxBrakeSpeed = -0.6;
            const thrustAvailable = L.timer < L.timeLimit;
            if (L.timer === L.timeLimit) {
              showCaption("噴射停止！自由落下で着地せよ", 90);
            }
            state.ship.vy = Math.min(maxFallSpeed, state.ship.vy + gravity);
            if (state.laser.charging && thrustAvailable) {
              state.ship.vy = Math.max(maxBrakeSpeed, state.ship.vy - brakeAccel);
            }
            state.ship.y += state.ship.vy;
            // ブレーキを噴かし続けると上昇し続けられてしまうので、画面外へ抜けないよう
            // 静止フェーズの高度より上には行かせない(それでも十分に立て直せる余地がある)
            state.ship.y = Math.max(40, state.ship.y);

            const touchedGround = state.ship.y >= groundY;

            if (touchedGround) {
              L.resolved = true;
              state.ship.vx = 0;
              state.ship.y = Math.min(state.ship.y, groundY);
              const errorX = Math.abs(state.ship.x - L.targetX);
              const impactSpeed = state.ship.vy;
              const acc = scoreLandingAccuracy(errorX);

              if (acc.hit) {
                // 的の中心からの近さ(10点刻み)と、着地速度の遅さの2つを別枠で加点する
                const speedBonus = landingSpeedBonus(impactSpeed);
                L.bonus = acc.points + speedBonus;
                L.rank = acc.idx === 1 ? "PERFECT" : acc.idx <= 3 ? "GREAT" : acc.idx <= 6 ? "GOOD" : "OK";
              } else {
                // 的を外すとマイナス点。速度ボーナスは対象外(位置がそもそも的の外のため)
                L.bonus = LANDING_MISS_PENALTY;
                L.rank = "MISS";
              }

              state.ship.vy = 0;
              // 総スコアが的ハズレのマイナスでマイナス表示になるのは見た目上おかしいので0で床を作る
              state.score = Math.max(0, state.score + L.bonus);
              const bonusLabel = (L.bonus >= 0 ? "+" : "") + L.bonus;
              spawnScorePop(state.ship.x, state.ship.y - 20, L.rank + " " + bonusLabel);
              state.bonusText = (acc.hit ? L.rank + "! " : "的ハズレ... ") + bonusLabel + " SCORE";
              state.bonusTimer = 140;
              SFX.bonus();
            }
            return;
          }

          // resolved: ランク表示を読ませるための小休止のあと、CLEARへ
          state.fall.landing.progress = L.settleTimer / L.settleDuration;
          L.settleTimer++;
          if (L.settleTimer >= L.settleDuration) {
            state.fall.landing.active = false;
            state.fall.active = false;
            state.running = false;
            state.cleared = true;
            // クリアボーナス：残りHP x10 ポイント加算
            state.score += Math.max(0, state.ship.hp) * 10;
            // 演出動画・ジングル・結果画面は kit が出す（ボーナス込みのスコアで）
            finishRun(true);
          }
          return;
        }

        state.fall.timer++;
        // fall scroll speed is ~30% slower than the normal forward speed
        state.scrollSpeed = state.speed * 0.7;
        // holding X flares the under-ship thruster and brakes the descent by ~10%
        if (state.laser.charging) state.scrollSpeed *= 0.9;
        updateStars();
        updateFallRows();
        updateArenaBullets();
        updateShip();
        updateBullets();
        updateBombs();
        // 通常のランダム出現(updateRescues)とは別に、予約した保証出現を消化する
        for (let gi = state.fall.guaranteedRescues.length - 1; gi >= 0; gi--) {
          const g = state.fall.guaranteedRescues[gi];
          if (state.fall.timer >= g.frame) {
            spawnRescueFall(g.ch);
            state.fall.guaranteedRescues.splice(gi, 1);
          }
        }
        updateRescues(true);
        updateHpItems(true);
        updateExplosions();
      updateScorePops();
        updateLaser();
        state.displayScore += (state.score - state.displayScore) * 0.18;

        const penetration = getFallPenetration();
        const CONTACT_FRAMES_THRESHOLD = Math.max(1, Math.round(0.1 * 60));
        if (penetration > 0) {
          state.ship.contactFrames++;
          if (state.ship.contactFrames >= CONTACT_FRAMES_THRESHOLD) {
            state.ship.contactFrames = 0;
            if (!tryUseLaserShield() && !(state.ship.invincibleFrames > 0)) {
              releaseLaserChargeOnHit();
              state.ship.hp = Math.max(0, state.ship.hp - 5);
              state.ship.invincibleFrames = 18;
            state.portrait.hitTimer = 18;
            SFX.hit();
              if (state.ship.hp <= 0) {
                triggerShipDeath();
              }
            }
          }
        } else {
          state.ship.contactFrames = 0;
          state.score += 1;
        }

        if (state.fall.timer >= state.fall.duration) {
          state.fall.landing.active = true;
          state.fall.landing.timer = 0;
          state.fall.landing.approachActive = true;
          state.fall.landing.approachTimer = 0;
          state.fall.landing.hoverActive = false;
          state.fall.landing.hoverTimer = 0;
          state.fall.landing.resolved = false;
          state.fall.landing.settleTimer = 0;
          state.fall.landing.rank = "";
          state.fall.landing.bonus = 0;
          // 敵弾は鳴りを潜める。approach演出の間は新規スポーンも止まる(updateArenaBulletsを呼ばないため)
          state.arena.bullets.length = 0;
          showCaption("洞窟が開ける……最終着陸シーケンス", 120);
        }
        return;
      }

      if (!state.running) return;

      // advance stage timer (frames)
      state.stageTimer++;
      // stage duration increases by 10 seconds per stage (stage 1 = base duration)
      const stageSecs = state.stageDuration + (state.stage - 1) * 10;
      const stageFrames = Math.round(stageSecs * 60);
      if (state.stageTimer >= stageFrames) {
        // stage goal reached — trigger goal caption once and mark pending advance
        state.stageTimer = stageFrames;
        if (!state.pendingStageAdvance) {
          state.pendingStageAdvance = true;
          // show GOAL caption
          showCaption("STAGE " + state.stage + " GOAL", 180);
          // initialize goal hold: create full-width chamber and pause scroll for 30s
          state.goalHold.active = true;
          state.goalHold.frames = 30 * 60;
          // reset arena spawn timer and bullets for hold
          state.arena.spawnTimer = 0;
          state.arena.bullets.length = 0;
          // start the NEXT STAGE countdown when entering the wide chamber
          state.stageIntro.active = true;
          state.stageIntro.phase = 'countdown';
          state.stageIntro.total = state.goalHold.frames;
          state.stageIntro.frames = state.goalHold.frames;
          state.stageIntro.startGap = tunnel.gap;
          // widen the entire visible tunnel to form a chamber (full screen)
          for (let cx = 0; cx < canvas.width; cx++) {
            state.columns[cx] = { top: 24, bottom: canvas.height - 24 };
          }
        }
      }

      state.speed = Math.min(state.maxSpeed, state.speed + 0.00075);
      state.scrollSpeed = state.effects.slowTimer > 0 ? state.speed * 0.72 : state.speed;
      // enforce scroll freeze during goal hold
      if (state.goalHold && state.goalHold.active) state.scrollSpeed = 0;
      // handle stage intro phases
      if (state.stageIntro && state.stageIntro.active) {
        // countdown phase
        if (state.stageIntro.phase === 'countdown') {
          state.stageIntro.frames = Math.max(0, state.stageIntro.frames - 1);
          if (state.stageIntro.frames <= 0) {
            // switch to narrowing phase
            state.stageIntro.phase = 'narrow';
            state.stageIntro.total = Math.round(3 * 60);
            state.stageIntro.frames = state.stageIntro.total;
            state.stageIntro.startGap = tunnel.gap;
            // clear arena bullets
            state.arena.bullets.length = 0;
          }
        } else if (state.stageIntro.phase === 'narrow') {
          state.stageIntro.frames = Math.max(0, state.stageIntro.frames - 1);
          const total = Math.max(1, state.stageIntro.total || 1);
          const progress = 1 - state.stageIntro.frames / total; // 0..1
          const targetGap = 170;
          const startGap = state.stageIntro.startGap || tunnel.gap;
          tunnel.gap = startGap * (1 - progress) + targetGap * progress;
          if (state.stageIntro.frames <= 0) {
            state.stageIntro.active = false;
          }
        }
      }
      if (state.effects.slowTimer > 0) state.effects.slowTimer--;
      if (state.effects.wideTimer > 0) state.effects.wideTimer--;
      if (state.bonusTimer > 0) state.bonusTimer--;
      updateStars();
      updateColumns();
      updateShip();
      updateBullets();
      updateBombs();
      updateExplosions();
      updateScorePops();
      updateLaser();
      updateHpItems();
      updateRescues();
      updateMegaHp();
      // smooth display score for visible count-up
      state.displayScore += (state.score - state.displayScore) * 0.18;
      // collision handling: count contact duration and apply 5 HP every 0.1s
      const penetration = getCollisionPenetration();
      // assume ~60fps; 0.1s -> ~6 frames (round to nearest)
      const CONTACT_FRAMES_THRESHOLD = Math.max(1, Math.round(0.1 * 60));
      if (penetration > 0) {
        state.ship.contactFrames++;
        if (state.ship.contactFrames >= CONTACT_FRAMES_THRESHOLD) {
          state.ship.contactFrames = 0;
          if (!tryUseLaserShield() && !(state.ship.invincibleFrames > 0)) {
            // reset any in-progress laser charge when actually taking contact damage
            releaseLaserChargeOnHit();
            state.ship.hp = Math.max(0, state.ship.hp - 5);
            state.ship.invincibleFrames = 18;
            state.portrait.hitTimer = 18;
            SFX.hit();
            if (state.ship.hp <= 0) {
              triggerShipDeath();
            }
          }
        }
      } else {
        // reset contact counter and award score when not touching
        state.ship.contactFrames = 0;
        state.score += 1;
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#030611";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (const s of state.stars) {
        const a = 0.3 + s.z * 0.5;
        ctx.fillStyle = `rgba(180, 200, 255, ${a})`;
        ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
      }
    }

    function drawTunnel() {
      ctx.fillStyle = RETRO.cave;
      for (let x = 0; x < state.columns.length; x++) {
        const c = state.columns[x];
        ctx.fillRect(x, 0, 1, c.top);
        ctx.fillRect(x, c.bottom, 1, canvas.height - c.bottom);
      }

      ctx.fillStyle = RETRO.caveEdge;
      for (let x = 0; x < state.columns.length; x += 3) {
        const c = state.columns[x];
        ctx.fillRect(x, c.top - 2, 2, 2);
        ctx.fillRect(x, c.bottom, 2, 2);
      }

      for (const base of state.bases) {
        const style = baseStyles[base.color];
        ctx.fillStyle = style.fill;
        ctx.fillRect(base.x, base.y, base.w, base.h);
        ctx.strokeStyle = style.edge;
        ctx.lineWidth = 1;
        ctx.strokeRect(base.x + 0.5, base.y + 0.5, base.w - 1, base.h - 1);

        // 視認性向上: 洞窟の色に紛れやすいので、輪郭を明滅させて
        // プレイヤーが高さ判断しやすくする(既存のpulse系演出と同じ書き方)
        const blink = 0.35 + 0.65 * Math.max(0, Math.sin(state.frame * 0.15));
        ctx.save();
        ctx.globalAlpha = blink;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.strokeRect(base.x - 1.5, base.y - 1.5, base.w + 3, base.h + 3);
        ctx.restore();

        // 壁に接する側の装甲ライン。Bで通したパレットに乗せる
        ctx.fillStyle = RETRO.gold;
        if (base.side === "top") ctx.fillRect(base.x + 1, base.y, base.w - 2, 1);
        else                     ctx.fillRect(base.x + 1, base.y + base.h - 1, base.w - 2, 1);

        // ノグルズはトンネル側(露出している端)に寄せて、こちらを見ている顔にする
        // 基地の最小幅は14pxで、比例させると潰れて眼鏡に見えない。
        // Nounsのアートでもノグルズは頭の輪郭からはみ出すので、
        // 小さいときは基地幅を超えて出してよい
        const nogW = Math.max(base.w * 0.86, 17);
        const nogH = nogW * 0.42;
        const inset = 2;
        const cy = base.side === "top"
          ? base.y + base.h - nogH / 2 - inset
          : base.y + nogH / 2 + inset;
        drawNoggles(base.x + base.w / 2, cy, nogW, nogH, style.edge);
      }
    }

    // Nouns のノグルズ。元が矩形だけで出来ているので、画像を貼らずに同じ形を
    // 矩形で組める(基地の幅が14〜28pxで毎回変わるため、ドット絵を非整数倍で
    // 縮小すると潰れる。比例して描けば常にくっきり出る)。
    // フレーム色は baseStyles から引くので、赤青黄の3色が1本のコードで片付き、
    // 後でパレットを触っても自動で追従する。
    function drawNoggles(cx, cy, w, h, frame) {
      const x = cx - w / 2;
      const y = cy - h / 2;
      const armW    = w * 0.16;
      const lensW   = w * 0.38;
      const bridgeW = w * 0.08;
      const px = (v) => Math.max(1, Math.round(v)); // 極小でも1px下回らせない

      ctx.fillStyle = frame;
      // つる。左のレンズから伸びる短い棒
      ctx.fillRect(x, y + h * 0.32, armW, px(h * 0.36));
      // ブリッジ
      ctx.fillRect(x + armW + lensW, y + h * 0.32, bridgeW, px(h * 0.36));

      const lensX = [x + armW, x + armW + lensW + bridgeW];
      const bw = px(h * 0.16);            // フレームの太さ
      for (const lx of lensX) {
        ctx.fillStyle = frame;
        ctx.fillRect(lx, y, lensW, h);
        // 白いレンズ面
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(lx + bw, y + bw, lensW - bw * 2, h - bw * 2);
        // 黒い瞳。中央よりやや右に置くのがノグルズの顔
        ctx.fillStyle = "#000000";
        ctx.fillRect(lx + bw + (lensW - bw * 2) * 0.42, y + bw,
                     px((lensW - bw * 2) * 0.38), h - bw * 2);
      }
    }

    // part 3: vertical fall shaft — walls on left/right, rows indexed by y
    function drawFallTunnel() {
      // same base colors as the horizontal tunnel, for visual continuity across the stage transition
      ctx.fillStyle = RETRO.cave;
      for (let y = 0; y < state.fall.rows.length; y++) {
        const r = state.fall.rows[y];
        ctx.fillRect(0, y, r.left, 1);
        ctx.fillRect(r.right, y, canvas.width - r.right, 1);
      }

      ctx.fillStyle = RETRO.caveEdge;
      for (let y = 0; y < state.fall.rows.length; y += 3) {
        const r = state.fall.rows[y];
        ctx.fillRect(r.left - 2, y, 2, 2);
        ctx.fillRect(r.right, y, 2, 2);
      }
    }

    // ground the ship auto-lands on at the end of the fall (0 = not visible, 1 = fully risen)
    function drawFallLanding(progress) {
      const groundH = 70 * progress;
      const grd = ctx.createLinearGradient(0, canvas.height - groundH, 0, canvas.height);
      grd.addColorStop(0, "#3a2f55");
