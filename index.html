    //   収集済み(通算)  … 絵を落として表示 + くすんだキャラ色の枠
    //   今回救出        … 絵を全光量で表示 + キャラ色の枠
    function drawRescueRoster() {
      const n = cnpChars.length;
      const s = CNP_ROSTER.slot;
      const totalW = n * s + (n - 1) * CNP_ROSTER.gap;
      const x0 = Math.round((canvas.width - totalW) / 2);
      const y = CNP_ROSTER.y;

      for (let i = 0; i < n; i++) {
        const ch = cnpChars[i];
        const x = x0 + i * (s + CNP_ROSTER.gap);
        const got = state.rescuedChars[i];   // このプレイで救出した
        const have = state.collected[i];     // 通算で収集済み
        const fl = state.rescueFlash[i] > 0 ? state.rescueFlash[i] / CNP_ROSTER.flash : 0;

        // 額の中身。走査線の上に乗るので下地はしっかり沈めておく
        ctx.fillStyle = have ? "rgba(6,10,20,0.92)" : "rgba(4,6,12,0.82)";
        ctx.fillRect(x, y, s, s);

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, s, s);
        ctx.clip();
        ctx.translate(x + s / 2, y + s / 2 + s * 0.04);
        // 今回の救出だけ全光量。通算で持っているだけの枠は落として、
        // 「今回どれを取ったか」が一目で分かるようにする
        if (!got) ctx.globalAlpha = have ? 0.42 : 1;
        if (have && ch.ready) {
          const d = s * 0.88;
          ctx.drawImage(ch.img, -d / 2, -d / 2, d, d);
        } else {
          drawCnpPlaceholder(ch, s * 0.8, !have);
        }
        ctx.restore();

        // 額縁。未収集は琥珀を落として沈ませ、収集済みはキャラ色で起こす
        ctx.lineWidth = 2;
        ctx.strokeStyle = got
          ? `hsla(${ch.hue},90%,${66 + fl * 30}%,${0.85 + fl * 0.15})`
          : have
            ? `hsla(${ch.hue},45%,52%,0.55)`
            : "rgba(255, 176, 32, 0.26)";
        ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);

        // 救出した瞬間だけ額が白く光る（どの枠が埋まったか視線を誘導する）
        if (fl > 0) {
          ctx.fillStyle = `rgba(255,255,255,${fl * 0.45})`;
          ctx.fillRect(x, y, s, s);
        }
      }

      // 収集率はこのプレイぶん(resetGame()で毎回0/11に戻る)。
      // 全員そろったら琥珀で点滅させて達成を知らせる
      const done = state.collected.reduce((a, b) => a + (b ? 1 : 0), 0);
      const complete = done === n;
      ctx.fillStyle = complete && !RETRO.blinkOn() ? RETRO.ink : RETRO.amber;
      ctx.font = RETRO.font(9);
      ctx.textAlign = "center";
      ctx.fillText(complete ? "COMPLETE!" : `${done} / ${n}`, canvas.width / 2, y + s + 11);
      ctx.textAlign = "left";
    }

    // --- Mega HP (stage-once, full heal) ---
    function spawnMegaHp() {
      const x = canvas.width + 40;
      const col = state.columns[Math.max(0, canvas.width - 2)];
      let baseY = canvas.height / 2;
      if (col) baseY = Math.max(col.top + 24, Math.min(col.bottom - 24, col.top + Math.random() * (col.bottom - col.top - 48)));
      state.megaHp = {
        x,
        baseY,
        y: baseY,
        vx: 0.5 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        bobAmp: 8,
        radius: 18,
        hue: Math.floor(Math.random() * 360)
      };
      state.megaHpSpawned = true;
    }

    function updateMegaHp() {
      if (!state.megaHp) {
        // check spawn timing: spawn once per stage in later half (60%)
        const stageSecs = state.stageDuration + (state.stage - 1) * 10;
        const stageFrames = Math.round(stageSecs * 60);
        const spawnFrame = Math.round(stageFrames * 0.6);
        if (!state.megaHpSpawned && state.stageTimer >= spawnFrame) {
          spawnMegaHp();
        }
        return;
      }

      const it = state.megaHp;
      it.x -= state.scrollSpeed * 0.9 + it.vx;
      it.y = it.baseY + Math.sin(state.frame * 0.06 + it.phase) * it.bobAmp;

      // collision with ship
      const dx = it.x - state.ship.x;
      const dy = it.y - state.ship.y;
      const dist2 = dx * dx + dy * dy;
      const r = it.radius + state.ship.radius;
      if (dist2 <= r * r) {
        // full heal
        state.ship.hp = 100;
        state.bonusText = "HP FULL";
        SFX.bonus();
        state.bonusTimer = 140;
        createExplosion(it.x, it.y, "yellow");
        state.megaHp = null;
      }

      // remove if offscreen
      if (it.x < -80) state.megaHp = null;
    }

    function drawMegaHp() {
      const it = state.megaHp;
      if (!it) return;
      // pulsing radial glow with hue
      const pulse = 0.5 + 0.5 * Math.sin(state.frame * 0.08 + it.phase);
      const outerR = it.radius * (1.6 + pulse * 0.6);
      const grd = ctx.createRadialGradient(it.x, it.y, it.radius * 0.2, it.x, it.y, outerR);
      const h = it.hue;
      grd.addColorStop(0, `hsla(${h},100%,75%,0.98)`);
      grd.addColorStop(0.4, `hsla(${h},90%,60%,0.55)`);
      grd.addColorStop(1, `hsla(${(h + 40) % 360},80%,50%,0.08)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(it.x, it.y, outerR, 0, Math.PI * 2);
      ctx.fill();

      // central badge (white circle)
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.radius * 0.8, 0, Math.PI * 2);
      ctx.fill();

      // plus sign
      ctx.fillStyle = `hsl(${h},70%,30%)`;
      ctx.fillRect(it.x - 3, it.y - 10, 6, 20);
      ctx.fillRect(it.x - 10, it.y - 3, 20, 6);
    }

    // Arena bullets during stage intro
    // return arena parameters based on stage (difficulty scales with stage)
    function getArenaParams(stage) {
      const s = Math.max(1, stage);
      // stage 1 = 66 frames between waves (~1.1s); each stage -5 frames; floor 20
      const spawnInterval = Math.max(20, 66 - (s - 1) * 5);
      // fixed speed in px/frame: stage 1 = 1.8, each stage +0.4
      const bulletSpeed = 1.8 + (s - 1) * 0.4;
      return { spawnInterval, bulletSpeed };
    }
    function spawnArenaBullets() {
      const shipX = state.ship.x;
      const shipY = state.ship.y;
      const params = getArenaParams(state.stage);
      const speed = params.bulletSpeed; // fixed speed, independent of ship velocity
      const margin = 12;
      // all 4 sides always fire
      const positions = [
        { x: -margin, y: Math.random() * canvas.height },
        { x: canvas.width + margin, y: Math.random() * canvas.height },
        { x: Math.random() * canvas.width, y: -margin },
        { x: Math.random() * canvas.width, y: canvas.height + margin }
      ];
      for (const p of positions) {
        const dx = shipX - p.x;
        const dy = shipY - p.y;
        const len = Math.hypot(dx, dy) || 1;
        const vx = (dx / len) * speed;
        const vy = (dy / len) * speed;
        state.arena.bullets.push({ x: p.x, y: p.y, vx, vy, radius: 4 });
      }
    }

    function updateArenaBullets() {
      // spawn timing
      state.arena.spawnTimer++;
        const params = getArenaParams(state.stage);
        if (state.arena.spawnTimer >= params.spawnInterval) {
          state.arena.spawnTimer = 0;
          spawnArenaBullets();
        }

      const toRemove = new Set();
      for (let i = 0; i < state.arena.bullets.length; i++) {
        const b = state.arena.bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        // collision with ship
        const dx = b.x - state.ship.x;
        const dy = b.y - state.ship.y;
        if (dx * dx + dy * dy <= (b.radius + state.ship.radius) * (b.radius + state.ship.radius)) {
          toRemove.add(i);
          // allow one-time shield when laser is fully charged
          if (!tryUseLaserShield()) {
            // reset any in-progress laser charge when actually taking damage
            releaseLaserChargeOnHit();
            state.ship.hp = Math.max(0, state.ship.hp - 5);
            state.portrait.hitTimer = 18;
            SFX.hit();
            createExplosion(b.x, b.y, "red");
            if (state.ship.hp <= 0) {
              triggerShipDeath();
            }
          }
        }
        // remove offscreen far
        if (b.x < -120 || b.x > canvas.width + 120 || b.y < -120 || b.y > canvas.height + 120) {
          toRemove.add(i);
        }
      }
      if (toRemove.size > 0) {
        state.arena.bullets = state.arena.bullets.filter((_, idx) => !toRemove.has(idx));
      }
    }

    function drawArenaBullets() {
      for (const b of state.arena.bullets) {
        ctx.fillStyle = "rgba(255,80,60,0.95)";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,160,140,0.35)";
        ctx.fillRect(b.x - 6, b.y - 1, 12, 2);
      }
    }

    function updateExplosions() {
      for (const p of state.explosions) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life -= 1;
      }
      state.explosions = state.explosions.filter((p) => p.life > 0);
    }

    // レーザーのチャージ/ビーム発射中は自動連射を止める。stopLaserCharge()の
    // 「タップならバルカン」判定と競合しないよう、あくまで手動発射(startLaserCharge/
    // stopLaserCharge)とは別経路でfireVulcan()を呼ぶだけに留める
    function updateAutoFire() {
      if (!autoFireEnabled || !state.running || state.dying.active) return;
      if (state.laser.charging || state.laser.beam) return;
      autoFireTimer++;
      if (autoFireTimer < AUTO_FIRE_INTERVAL) return;
      autoFireTimer = 0;
      fireVulcan();
    }

    function update() {
      // always advance global frame (keeps animations consistent) and caption timer
      state.frame++;
      updateAutoFire();
      if (state.captionTimer > 0) state.captionTimer--;
      if (state.portrait.hitTimer > 0) state.portrait.hitTimer--;

      // HP hit 0: freeze gameplay and play the big explosion before GAME OVER shows
      if (state.dying.active) {
        state.dying.timer++;
        updateExplosions();
        state.displayScore += (state.score - state.displayScore) * 0.18;
        if (state.dying.timer >= state.dying.duration) {
          state.dying.active = false;
          state.gameOver = true;
          SFX.gameOver();
        }
        return;
      }

      // handle goal hold countdown (runs even while paused)
      if (state.goalHold && state.goalHold.active) {
        state.goalHold.frames--;
        // update arena bullets during goal hold
        updateArenaBullets();
        if (state.goalHold.frames <= 0) {
          state.goalHold.active = false;
          state.pendingStageAdvance = false;
          // part 2 (arena dodge) cleared — the floor opens, begin the part 3 fall
          beginFall();
        }
      }

      // part 3: vertical fall through the shaft, separate from the tunnel/arena flow above
      if (state.fall.active) {
        if (!state.running) return;

        // intro: bullets already stopped, ship rotates 90° while easing downward —
        // no screen wipe, so the transition reads as continuing straight down
        if (state.fall.introActive) {
          state.fall.introTimer++;
          const p = Math.min(1, state.fall.introTimer / state.fall.introDuration);
          const eased = 1 - Math.pow(1 - p, 2); // ease-out, so the descent starts gently and picks up
          // rotate nose-up (negative = counter-clockwise in canvas' y-down space)
          state.fall.shipAngle = p * (-Math.PI / 2);
          // ship keeps easing toward the top of the shaft instead of sitting still
          state.ship.y = state.fall.introStartY + (70 - state.fall.introStartY) * eased;
          // scroll speed ramps up from 0 instead of freezing, so motion never fully stops
          state.scrollSpeed = state.speed * 0.7 * eased;
          updateStars();
          updateExplosions();
          updateLaser();
          state.displayScore += (state.score - state.displayScore) * 0.18;
          if (p >= 1) {
            state.fall.introActive = false;
            state.fall.timer = 0;
          }
          return;
        }

        // landing: auto-fly to the floor and settle down, then show CLEAR
        if (state.fall.landing.active) {
          state.fall.landing.timer++;
          const p = Math.min(1, state.fall.landing.timer / state.fall.landing.duration);
          state.fall.landing.progress = p;
          const targetX = canvas.width / 2;
          const targetY = canvas.height - 70;
          state.ship.x += (targetX - state.ship.x) * 0.07;
          state.ship.y += (targetY - state.ship.y) * 0.07;
          state.ship.vx = 0;
          state.ship.vy = 0;
          state.scrollSpeed = 0;
          updateStars();
          updateExplosions();
          state.displayScore += (state.score - state.displayScore) * 0.18;
          if (p >= 1) {
            state.fall.landing.active = false;
            state.fall.active = false;
            state.running = false;
            state.cleared = true;
            SFX.clear();
            // クリアボーナス：残りHP x10 ポイント加算
            state.score += Math.max(0, state.ship.hp) * 10;
          }
          return;
        }

        state.fall.timer++;
        // fall scroll speed is ~30% slower than the normal forward speed
        state.scrollSpeed = state.speed * 0.7;
        // holding X flares the under-ship thruster and brakes the descent by ~10%
        if (state.laser.charging) state.scrollSpeed *= 0.9;
        updateStars();
        updateFallRows();
        updateArenaBullets();
        updateShip();
        updateBullets();
        updateBombs();
        updateRescues(true);
        updateExplosions();
        updateLaser();
        state.displayScore += (state.score - state.displayScore) * 0.18;

        const penetration = getFallPenetration();
        const CONTACT_FRAMES_THRESHOLD = Math.max(1, Math.round(0.1 * 60));
        if (penetration > 0) {
          state.ship.contactFrames++;
          if (state.ship.contactFrames >= CONTACT_FRAMES_THRESHOLD) {
            state.ship.contactFrames = 0;
            if (!tryUseLaserShield()) {
              releaseLaserChargeOnHit();
              state.ship.hp = Math.max(0, state.ship.hp - 5);
            state.portrait.hitTimer = 18;
            SFX.hit();
              if (state.ship.hp <= 0) {
                triggerShipDeath();
              }
            }
          }
        } else {
          state.ship.contactFrames = 0;
          state.score += 1;
        }

        if (state.fall.timer >= state.fall.duration) {
          state.fall.landing.active = true;
          state.fall.landing.timer = 0;
        }
        return;
      }

      if (!state.running) return;

      // advance stage timer (frames)
      state.stageTimer++;
      // stage duration increases by 10 seconds per stage (stage 1 = base duration)
      const stageSecs = state.stageDuration + (state.stage - 1) * 10;
      const stageFrames = Math.round(stageSecs * 60);
      if (state.stageTimer >= stageFrames) {
        // stage goal reached — trigger goal caption once and mark pending advance
        state.stageTimer = stageFrames;
        if (!state.pendingStageAdvance) {
          state.pendingStageAdvance = true;
          // show GOAL caption
          showCaption("STAGE " + state.stage + " GOAL", 180);
          // initialize goal hold: create full-width chamber and pause scroll for 30s
          state.goalHold.active = true;
          state.goalHold.frames = 30 * 60;
          // reset arena spawn timer and bullets for hold
          state.arena.spawnTimer = 0;
          state.arena.bullets.length = 0;
          // start the NEXT STAGE countdown when entering the wide chamber
          state.stageIntro.active = true;
          state.stageIntro.phase = 'countdown';
          state.stageIntro.total = state.goalHold.frames;
          state.stageIntro.frames = state.goalHold.frames;
          state.stageIntro.startGap = tunnel.gap;
          // widen the entire visible tunnel to form a chamber (full screen)
          for (let cx = 0; cx < canvas.width; cx++) {
            state.columns[cx] = { top: 24, bottom: canvas.height - 24 };
          }
        }
      }

      state.speed = Math.min(state.maxSpeed, state.speed + 0.00075);
      state.scrollSpeed = state.effects.slowTimer > 0 ? state.speed * 0.72 : state.speed;
      // enforce scroll freeze during goal hold
      if (state.goalHold && state.goalHold.active) state.scrollSpeed = 0;
      // handle stage intro phases
      if (state.stageIntro && state.stageIntro.active) {
        // countdown phase
        if (state.stageIntro.phase === 'countdown') {
          state.stageIntro.frames = Math.max(0, state.stageIntro.frames - 1);
          if (state.stageIntro.frames <= 0) {
            // switch to narrowing phase
            state.stageIntro.phase = 'narrow';
            state.stageIntro.total = Math.round(3 * 60);
            state.stageIntro.frames = state.stageIntro.total;
            state.stageIntro.startGap = tunnel.gap;
            // clear arena bullets
            state.arena.bullets.length = 0;
          }
        } else if (state.stageIntro.phase === 'narrow') {
          state.stageIntro.frames = Math.max(0, state.stageIntro.frames - 1);
          const total = Math.max(1, state.stageIntro.total || 1);
          const progress = 1 - state.stageIntro.frames / total; // 0..1
          const targetGap = 170;
          const startGap = state.stageIntro.startGap || tunnel.gap;
          tunnel.gap = startGap * (1 - progress) + targetGap * progress;
          if (state.stageIntro.frames <= 0) {
            state.stageIntro.active = false;
          }
        }
      }
      if (state.effects.slowTimer > 0) state.effects.slowTimer--;
      if (state.effects.wideTimer > 0) state.effects.wideTimer--;
      if (state.bonusTimer > 0) state.bonusTimer--;
      updateStars();
      updateColumns();
      updateShip();
      updateBullets();
      updateBombs();
      updateExplosions();
      updateLaser();
      updateHpItems();
      updateRescues();
      updateMegaHp();
      // smooth display score for visible count-up
      state.displayScore += (state.score - state.displayScore) * 0.18;
      // collision handling: count contact duration and apply 5 HP every 0.1s
      const penetration = getCollisionPenetration();
      // assume ~60fps; 0.1s -> ~6 frames (round to nearest)
      const CONTACT_FRAMES_THRESHOLD = Math.max(1, Math.round(0.1 * 60));
      if (penetration > 0) {
        state.ship.contactFrames++;
        if (state.ship.contactFrames >= CONTACT_FRAMES_THRESHOLD) {
          state.ship.contactFrames = 0;
          if (!tryUseLaserShield()) {
            // reset any in-progress laser charge when actually taking contact damage
            releaseLaserChargeOnHit();
            state.ship.hp = Math.max(0, state.ship.hp - 5);
            state.portrait.hitTimer = 18;
            SFX.hit();
            if (state.ship.hp <= 0) {
              triggerShipDeath();
            }
          }
        }
      } else {
        // reset contact counter and award score when not touching
        state.ship.contactFrames = 0;
        state.score += 1;
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#030611";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (const s of state.stars) {
        const a = 0.3 + s.z * 0.5;
        ctx.fillStyle = `rgba(180, 200, 255, ${a})`;
        ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
      }
    }

    function drawTunnel() {
      ctx.fillStyle = "#193164";
      for (let x = 0; x < state.columns.length; x++) {
        const c = state.columns[x];
        ctx.fillRect(x, 0, 1, c.top);
        ctx.fillRect(x, c.bottom, 1, canvas.height - c.bottom);
      }

      ctx.fillStyle = "#5ca2ff";
      for (let x = 0; x < state.columns.length; x += 3) {
        const c = state.columns[x];
        ctx.fillRect(x, c.top - 2, 2, 2);
        ctx.fillRect(x, c.bottom, 2, 2);
      }

      for (const base of state.bases) {
        const style = baseStyles[base.color];
        ctx.fillStyle = style.fill;
        ctx.fillRect(base.x, base.y, base.w, base.h);
        ctx.strokeStyle = style.edge;
        ctx.lineWidth = 1;
        ctx.strokeRect(base.x + 0.5, base.y + 0.5, base.w - 1, base.h - 1);
      }
    }

    // part 3: vertical fall shaft — walls on left/right, rows indexed by y
    function drawFallTunnel() {
      // same base colors as the horizontal tunnel, for visual continuity across the stage transition
      ctx.fillStyle = "#193164";
      for (let y = 0; y < state.fall.rows.length; y++) {
        const r = state.fall.rows[y];
        ctx.fillRect(0, y, r.left, 1);
        ctx.fillRect(r.right, y, canvas.width - r.right, 1);
      }

      ctx.fillStyle = "#5ca2ff";
      for (let y = 0; y < state.fall.rows.length; y += 3) {
        const r = state.fall.rows[y];
        ctx.fillRect(r.left - 2, y, 2, 2);
        ctx.fillRect(r.right, y, 2, 2);
      }
    }

    // ground the ship auto-lands on at the end of the fall (0 = not visible, 1 = fully risen)
    function drawFallLanding(progress) {
      const groundH = 70 * progress;
      const grd = ctx.createLinearGradient(0, canvas.height - groundH, 0, canvas.height);
      grd.addColorStop(0, "#3a2f55");
      grd.addColorStop(1, "#150f22");
      ctx.fillStyle = grd;
      ctx.fillRect(0, canvas.height - groundH, canvas.width, groundH);
      ctx.fillStyle = "rgba(180,150,255,0.55)";
      ctx.fillRect(0, canvas.height - groundH - 2, canvas.width, 2);
    }

    function drawShip() {
      if (state.dying.active) return; // ship is gone — the explosion particles are the visual now
      const { x, y, radius } = state.ship;
      // holding X during the fall flares the under-ship thruster to brake the descent
      const boosting = state.fall.active && !state.fall.introActive && !state.fall.landing.active && state.laser.charging;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(state.ship.vy * 0.05 + (state.fall.shipAngle || 0));

      // 咲耶カラー: 基調はピンク、サブ(コックピット窓)は黒
      ctx.fillStyle = "#ff3da6";
      ctx.beginPath();
      ctx.moveTo(radius + 6, 0);
      ctx.lineTo(-radius, -radius * 0.85);
      ctx.lineTo(-radius + 4, 0);
      ctx.lineTo(-radius, radius * 0.85);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#15121a";
      ctx.beginPath();
      ctx.arc(-2, 0, 4, 0, Math.PI * 2);
      ctx.fill();

      if (state.running) {
        const flame = (boosting ? 18 : 8) + Math.random() * (boosting ? 16 : 8);
        const flameW = boosting ? 6 : 3;
        ctx.fillStyle = boosting ? "#ffe27a" : "#ff8c42";
        ctx.beginPath();
        ctx.moveTo(-radius + 2, 0);
        ctx.lineTo(-radius - flame, -flameW);
        ctx.lineTo(-radius - flame, flameW);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBullets() {
      for (const b of state.bullets) {
        ctx.fillStyle = "#ffcf70";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 180, 80, 0.45)";
        ctx.fillRect(b.x - 12, b.y - 1, 10, 2);
      }
    }

    function drawBombs() {
      for (const b of state.bombs) {
        // shadow
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        ctx.beginPath();
        ctx.ellipse(b.x + 3, b.y + 6, b.radius + 2, b.radius * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // bomb body
        ctx.fillStyle = "#b05b2c";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        // small fuse glow
        ctx.fillStyle = "rgba(255,140,40,0.18)";
        ctx.fillRect(b.x - 2, b.y - 6, 4, 6);
      }
    }

    function drawExplosions() {
      for (const p of state.explosions) {
        const alpha = Math.max(0, p.life / p.maxLife);
        const style = baseStyles[p.color];
        ctx.fillStyle = `${style.edge}${alpha < 0.7 ? "" : ""}`;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.6 + (1 - alpha) * 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawHud() {
      // スコアは琥珀のゼロ埋め7桁。アーケードのスコアパネルの文法で、
      // 桁が伸び縮みしないぶん視線も落ち着く
      ctx.fillStyle = RETRO.amber;
      ctx.font = RETRO.font(16);
      ctx.fillText(`SCORE ${String(Math.floor(state.displayScore)).padStart(7, "0")}`, 20, 34);
      // 副情報は色でなくサイズで一段落とす。減光色＋小サイズの二重の弱体化は
      // 走査線と重なると判読不能になるため、色は本文色を保つ
      ctx.fillStyle = RETRO.ink;
      ctx.font = RETRO.font(10);
      ctx.fillText(`SPD ${state.scrollSpeed.toFixed(2)}`, 20, 58);

      // remaining time for current stage / fall
      if (state.running && state.fall.active) {
        const remainingFrames = Math.max(0, state.fall.duration - state.fall.timer);
        const remainingSecs = Math.ceil(remainingFrames / 60);
        ctx.fillText(`DIVE ${remainingSecs}S`, 20, 78);
      } else if (state.running) {
        const stageSecs = state.stageDuration + (state.stage - 1) * 10;
        const stageFrames = Math.round(stageSecs * 60);
        const remainingFrames = Math.max(0, stageFrames - state.stageTimer);
        const remainingSecs = Math.ceil(remainingFrames / 60);
        ctx.fillText(`TIME ${remainingSecs}S`, 20, 78);
      }

      // 救出数。TIME/DIVE と同じ行の右隣に置く（下の行はボーナス表示が使う）
      if (state.running) {
        ctx.fillStyle = RETRO.amber;
        ctx.fillText(`RESCUE ${state.rescuedCount}`, 150, 78);
        ctx.fillStyle = RETRO.ink;
      }

      // 額縁ロスターはスタート後のみ。タイトル画面はイラストを見せる場なので出さない
      if (state.started) drawRescueRoster();

      // HP bar (右上): 連続バーではなく10個のセグメント。往年の
      // エナジーゲージの読み方で、残量が「数」で即座に分かる
      const hp = typeof state.ship.hp === 'number' ? state.ship.hp : 0;
      const maxHp = 100;
      const segs = 10;
      const segW = 16;
      const segH = 12;
      const segGap = 3;
      const barW = segs * segW + (segs - 1) * segGap;
      const bx = canvas.width - barW - 20;
      const by = 20;
      const pct = Math.max(0, Math.min(1, hp / maxHp));
      const lit = Math.ceil(pct * segs);
      const hpColor = pct > 0.6 ? RETRO.hp : pct > 0.3 ? RETRO.amber : RETRO.danger;
      for (let i = 0; i < segs; i++) {
        const sx = bx + i * (segW + segGap);
        if (i < lit) {
          ctx.fillStyle = hpColor;
          ctx.fillRect(sx, by, segW, segH);
        } else {
          ctx.fillStyle = "rgba(255,255,255,0.10)";
          ctx.fillRect(sx, by, segW, segH);
        }
      }
      // ラベルは置かない: セグメントゲージは形状だけで残量が読め、
      // この位置はパイロット窓と重なるため（HUDは5秒3点まで）

      if (state.bonusTimer > 0) {
        ctx.fillStyle = RETRO.amber;
        ctx.font = RETRO.font(10);
        ctx.fillText(state.bonusText, 20, 104);
      }

      if (state.gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.fillStyle = RETRO.danger;
        ctx.font = RETRO.font(34);
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 16);
        // 再スタートの導線は矩形波で明滅させる（アーケードのコンティニュー表示）
        if (RETRO.blinkOn()) {
          ctx.fillStyle = RETRO.ink;
          ctx.font = RETRO.font(12);
          ctx.fillText("PUSH START", canvas.width / 2, canvas.height / 2 + 32);
        }
        ctx.textAlign = "left";
      }

      if (state.cleared) {
        ctx.fillStyle = "rgba(6, 20, 16, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let textTop = canvas.height / 2 - 30;
        if (clearImg.complete && clearImg.naturalWidth) {
          const imgW = 560;
          const imgH = imgW * (clearImg.naturalHeight / clearImg.naturalWidth);
          const imgX = (canvas.width - imgW) / 2;
          const imgY = 20;
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.5)";
          ctx.shadowBlur = 20;
          ctx.drawImage(clearImg, imgX, imgY, imgW, imgH);
          ctx.restore();
          ctx.strokeStyle = RETRO.amber;
          ctx.lineWidth = 2;
          ctx.strokeRect(imgX + 1, imgY + 1, imgW - 2, imgH - 2);
          textTop = imgY + imgH + 42;
        }

        ctx.textAlign = "center";
        ctx.fillStyle = RETRO.amber;
        ctx.font = RETRO.font(30);
        ctx.fillText("CLEAR", canvas.width / 2, textTop);
        ctx.fillStyle = RETRO.ink;
        ctx.font = RETRO.font(14);
        ctx.fillText(`SCORE ${String(Math.floor(state.score)).padStart(7, "0")}`, canvas.width / 2, textTop + 36);
        // ここに "PUSH START" は描かない。真下に明滅するスタートボタン(DOM)が
        // 出るため、CTAが2つ並んで衝突する。CLEAR画面の主役はスコア
        ctx.textAlign = "left";
      }

      // arena countdown display (during stage intro countdown, before the floor opens)
      if (state.stageIntro && state.stageIntro.active && state.stageIntro.phase === 'countdown') {
        const remaining = Math.ceil(state.stageIntro.frames / 60);
        ctx.save();
        RETRO.panel(canvas.width / 2 - 150, 16, 300, 46);
        ctx.fillStyle = RETRO.amber;
        ctx.textAlign = "center";
        ctx.font = RETRO.font(13); // 和文はDotGothic16へフォールバックする
        ctx.fillText(`床が開くまで ${remaining}s`, canvas.width / 2, 16 + 30);
        ctx.restore();
        ctx.textAlign = "left";
      }

      // caption (stage start / goal)
      if (state.captionTimer > 0 && state.caption) {
        ctx.save();
        RETRO.panel(canvas.width / 2 - 260, 60, 520, 64);
        ctx.fillStyle = RETRO.ink;
        ctx.textAlign = "center";
        ctx.font = RETRO.font(20);
        ctx.fillText(state.caption, canvas.width / 2, 60 + 40);
        ctx.restore();
        ctx.textAlign = "left";
      }
    }

    // ── レトロ描画のヘルパー（canvas側の正典。色は方向宣言のトークンと一致） ──
    const RETRO = {
      ink: "#D6E4F0",
      dim: "#7C8BA6",
      amber: "#FFB020",
      danger: "#FF3B6B",
      hp: "#35E08A",
      // 欧文/数字はPress Start 2P、和文はDotGothic16へ落ちる（和欧混植: 欧文先）
      font(px) {
        return `${px}px "Press Start 2P", "DotGothic16", monospace`;
      },
      // 明滅は矩形波。フェードでなく本物のアーケードの点滅にする
      blinkOn() {
        if (RETRO.reduceMotion) return true;
        return Math.floor(state.frame / 30) % 2 === 0;
      },
      // テロップの下敷き。琥珀のヘアラインだけで枠を作る（面には塗らない）
      panel(x, y, w, h) {
        ctx.fillStyle = "rgba(4, 6, 12, 0.82)";
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = "rgba(255, 176, 32, 0.55)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      },
      reduceMotion: false,
      _scan: null,
      _vignette: null,
      // 走査線パターンは一度だけ作って使い回す（毎フレーム生成すると重い）
      scanPattern() {
        if (RETRO._scan) return RETRO._scan;
        const c = document.createElement("canvas");
        c.width = 1;
        c.height = 3;
        const g = c.getContext("2d");
        g.fillStyle = "rgba(0,0,0,0.30)";
        g.fillRect(0, 0, 1, 1);
        RETRO._scan = ctx.createPattern(c, "repeat");
        return RETRO._scan;
      },
      vignette() {
        if (RETRO._vignette) return RETRO._vignette;
        const g = ctx.createRadialGradient(
          canvas.width / 2, canvas.height / 2, canvas.height * 0.35,
          canvas.width / 2, canvas.height / 2, canvas.height * 0.78
        );
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(1, "rgba(0,0,0,0.55)");
        RETRO._vignette = g;
        return RETRO._vignette;
      }
    };

    // シグネチャー「筐体化」: 全描画の最後に走査線とビネットを焼き、
    // 画面をブラウン管に見せる。CSSでなくcanvasに焼くのは、拡大率が
    // 変わっても線のピッチがゲーム画面と一致し続けるため
    function drawCrtOverlay() {
      ctx.save();
      ctx.fillStyle = RETRO.scanPattern();
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = RETRO.vignette();
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function getPortraitFrameIndex() {
      if (state.portrait.hitTimer > 0) return 1; // ② 被弾(衝撃)
      const hp = typeof state.ship.hp === "number" ? state.ship.hp : 100;
      if (hp > 70) return 0; // ① 通常(冷静)
      if (hp > 40) return 2; // ③ 怒り(戦闘モード)
      if (hp > 20) return 3; // ④ 苦痛(ダメージ大)
      return 4; // ⑤ 決意(集中・反撃準備)
    }

    // picks a corner that keeps clear of the ship's current position
    function getPortraitPosition(w, h) {
      const margin = 20;
      const rightX = canvas.width - w - margin;
      const leftX = margin;
      const topY = 40; // below the HP gauge
      const bottomY = canvas.height - h - margin;
      const nearRightEdge = state.ship.x > canvas.width - (w + margin + 80);
      if (nearRightEdge) {
        return { x: leftX, y: bottomY };
      }
      return state.ship.y < canvas.height / 2 ? { x: rightX, y: bottomY } : { x: rightX, y: topY };
    }

    function drawPilotPortrait() {
      // クリア画面は image02png.png(メイン画像)が主役。コックピット窓が
      // 隣に残っていると視線が割れるので、クリア中は描かない
      if (state.cleared) return;
      if (!pilotImg.complete || !pilotImg.naturalWidth) return;
      const w = 156; // 120 * 1.3
      const h = 117; // 90 * 1.3
      const crop = PILOT_CROPS[getPortraitFrameIndex()];
      const pos = getPortraitPosition(w, h);
      // no shadowBlur — this draws every frame during actual gameplay, and
      // shadowBlur is expensive enough on mobile to noticeably slow the game down
      ctx.save();
      // パイロット窓は筐体のモニタ枠に見せる（琥珀のヘアライン2px）
      ctx.strokeStyle = "rgba(255, 176, 32, 0.5)";
      ctx.lineWidth = 2;
      ctx.drawImage(pilotImg, crop.x, crop.y, crop.w, crop.h, pos.x, pos.y, w, h);
      ctx.strokeRect(pos.x + 1, pos.y + 1, w - 2, h - 2);
      ctx.restore();
    }

    // start screen: image01.jpg centered, shown until the player presses スタート
    // fixed canvas-space anchor for the "start here" hint — the スタート button is
    // positioned on top of this same spot each frame (see positionStartButton)
    const TITLE_HINT_X = canvas.width / 2;
    const TITLE_HINT_Y = canvas.height - 34;

    function drawTitleScreen() {
      drawBackground();
      // 走査線は背景の星空まで。この後のタイトルイラストには乗せない
      drawCrtOverlay();
      // ゲームタイトル。イラストの上、canvas上端の余白に収まる位置
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = RETRO.amber;
      ctx.font = RETRO.font(30);
      ctx.fillText("SAKUYA SCRAMBLE", canvas.width / 2, 48);
      ctx.restore();
      if (titleImg.complete && titleImg.naturalWidth) {
        const maxW = canvas.width * 0.72;
        const maxH = canvas.height * 0.6;
        const scale = Math.min(maxW / titleImg.naturalWidth, maxH / titleImg.naturalHeight);
        const w = titleImg.naturalWidth * scale;
        const h = titleImg.naturalHeight * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2 - 30;
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 24;
        ctx.drawImage(titleImg, x, y, w, h);
        ctx.restore();
        ctx.strokeStyle = "rgba(255, 176, 32, 0.5)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      }
    }

    // maps a canvas-internal coordinate to CSS pixels within .wrap (canvas sits at
    // its top-left corner), so the DOM button lines up with the drawn hint spot
    // regardless of how much the canvas is scaled down on smaller screens
    function positionStartButton() {
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width / canvas.width;
      const scaleY = rect.height / canvas.height;
      let left = TITLE_HINT_X * scaleX;
      let top = TITLE_HINT_Y * scaleY;
      // ボタンは transform: translate(-50%, -50%) で中心合わせなので、
      // アンカーが縁に近いと半分がキャンバスの外へ出る。表示倍率によって
      // 縮尺が変わるぶん、座標を決め打ちで上げるのではなく実寸で内側へ
      // クランプする（将来ボタンの大きさを変えても破綻しない）
      const halfW = startButton.offsetWidth / 2;
      const halfH = startButton.offsetHeight / 2;
      const inset = 6; // 筐体ベゼルに食い込ませないための余白
      left = Math.max(halfW + inset, Math.min(rect.width - halfW - inset, left));
      top = Math.max(halfH + inset, Math.min(rect.height - halfH - inset, top));
      startButton.style.left = `${left}px`;
      startButton.style.top = `${top}px`;
    }

    // start button only shows while waiting to start: before the first スタート press,
    // or after GAME OVER / CLEAR (where it doubles as the restart trigger)
    let _startButtonWasShown = false;
    function updateStartButtonVisibility() {
      const shouldShow = !state.started || state.gameOver || state.cleared;
      startButton.style.display = shouldShow ? "" : "none";
      // getBoundingClientRect() forces a layout reflow — only pay that cost on the
      // rising edge (button just appeared), not every single frame it stays visible.
      // window resize/orientationchange (below) keep it correctly positioned otherwise.
      if (shouldShow && !_startButtonWasShown) positionStartButton();
      _startButtonWasShown = shouldShow;
    }

    // 操作ボタン(十字/ジャイロトグル/X/💣)はプレイ中だけ出す。スタートボタンが
    // 出ている間(タイトル・ゲームオーバー・クリア)は、押しても update() が動かず
    // 反応しないうえ、タイトルイラストやクリア時のランキング登録フォームに
    // position: fixed のまま重なってしまうため隠す。
    // PCでは touchControlsEnabled が false のままなので従来通り常に非表示。
    let touchControlsEnabled = false;
    let _gameControlsWereShown = null;
    function updateGameControlsVisibility() {
      if (!touchControlsEnabled) return;
      const shouldShow = state.started && !state.gameOver && !state.cleared;
      if (shouldShow === _gameControlsWereShown) return;
      firePad.style.display = shouldShow ? "block" : "none";
      controlsBottom.style.display = shouldShow ? "flex" : "none";
      _gameControlsWereShown = shouldShow;
    }

    window.addEventListener("resize", () => {
      if (_startButtonWasShown) positionStartButton();
      if (orientationBlocked) positionOrientationOverlay();
    });

    // same left/top-at-canvas-origin mapping as positionStartButton, sized to
    // the canvas's current rendered box so the overlay covers it exactly
    function positionOrientationOverlay() {
      const rect = canvas.getBoundingClientRect();
      orientationOverlay.style.left = "0px";
      orientationOverlay.style.top = "0px";
      orientationOverlay.style.width = `${rect.width}px`;
      orientationOverlay.style.height = `${rect.height}px`;
    }

    // PC (isMobileDevice === false) は縦長ウィンドウでも絶対に出さない。
    // 表示中は loop() 内の update() をスキップしてゲームを一時停止し、
    // 横向きに戻ったら自動的に再開する。
    //
    // 判定はイベント任せにせず loop() から毎フレーム呼び直す。iOS Safari の
    // orientationchange はビューポート(=メディアクエリ)の更新より先に発火する
    // ことがあり、その時点の古い値で orientationBlocked = true を書くと、実際は
    // 横向きなのに二度と再評価されず、ゲームが一時停止のまま固まってしまう
    // （ジャイロの傾き値は正常に届いているのに宇宙船が動かせない状態になる）。
    let _orientationBlockedApplied = null;
    function updateOrientationOverlay() {
      const shouldBlock = isMobileDevice && portraitMQ.matches;
      orientationBlocked = shouldBlock;
      // DOM操作は状態が変わった時だけ。positionOrientationOverlay() は
      // getBoundingClientRect() でリフローを起こすので毎フレームは走らせない
      if (shouldBlock === _orientationBlockedApplied) return;
      if (shouldBlock) positionOrientationOverlay();
      orientationOverlay.classList.toggle("visible", shouldBlock);
      _orientationBlockedApplied = shouldBlock;
    }
    // 即応性のためイベントも購読する（毎フレームの再評価が最終的な保険）。
    // addEventListener 未対応の古い Safari では addListener にフォールバック
    if (typeof portraitMQ.addEventListener === "function") {
      portraitMQ.addEventListener("change", updateOrientationOverlay);
    } else if (typeof portraitMQ.addListener === "function") {
      portraitMQ.addListener(updateOrientationOverlay);
    }
    window.addEventListener("orientationchange", updateOrientationOverlay);
    updateOrientationOverlay();

    // ランキングパネルはタイトル画面とクリア画面の下段にのみ表示。
    // クリア直後、TOP10入りしていれば一度だけ登録フォームを開く。
    function updateLeaderboardVisibility() {
      const shouldShow = !state.started || state.cleared;
      setLeaderboardVisible(shouldShow);
      if (state.cleared && !scoreSubmitted) {
        scoreSubmitted = true;
        if (qualifiesForTop10(state.score)) {
          showScoreRegisterForm();
        } else {
          hideScoreRegisterForm();
        }
      }
      if (!shouldShow) {
        hideScoreRegisterForm();
      }
    }

    function render() {
      updateStartButtonVisibility();
      updateGameControlsVisibility();
      updateLeaderboardVisibility();
      if (!state.started) {
        drawTitleScreen(); // 走査線は関数内で星空にだけ敷く
        return;
      }
      drawBackground();
      if (state.fall.active && state.fall.introActive) {
        // no screen wipe here on purpose — keep the open chamber visible so the
        // ship's rotation + descent reads as continuous motion, not a scene cut
        drawTunnel();
      } else if (state.fall.active && state.fall.landing.active) {
        drawFallTunnel();
        drawFallLanding(state.fall.landing.progress);
      } else if (state.fall.active) {
        drawFallTunnel();
      } else {
        drawTunnel();
      }
      // 走査線とビネットは「背景と洞窟」にだけ敷く。ここより後に描くものは
      // 一切削らない——アイテム画像やイラストの上に走査線が乗ると、
      // レトロではなく単に低解像度に見えるため（既定の描画順は変えていないので
      // 自機とアイテムの重なり順は従来どおり）
      drawCrtOverlay();
      drawMegaHp();
      drawArenaBullets();
      drawHpItems();
      drawRescues();
      drawBullets();
      drawBombs();
      drawExplosions();
      drawShip();
      drawLaser();
      drawHud();
      drawPilotPortrait();
    }

    function showCaption(text, frames) {
      state.caption = text;
      state.captionTimer = Math.max(0, frames | 0);
    }

    function beginStage() {
      // show caption
      showCaption(`STAGE ${state.stage} START`, 120);
      SFX.stage();
      // set wide starting gap and seed columns to show wide space
      const wideGap = Math.max(tunnel.maxGap, tunnel.gap, 360);
      tunnel.gap = wideGap;
      // immediately enter narrowing phase for stage start (no initial countdown)
      state.stageIntro.total = Math.round(3 * 60);
      state.stageIntro.frames = state.stageIntro.total;
      state.stageIntro.startGap = wideGap;
      state.stageIntro.phase = 'narrow';
      state.stageIntro.active = true;
      // rebuild columns as wide
      for (let cx = 0; cx < canvas.width; cx++) {
        state.columns[cx] = { top: 24, bottom: canvas.height - 24 };
      }
      // ensure game runs and scrolling happens
      state.running = true;
      // reset arena bullets
      state.arena.bullets.length = 0;
      state.arena.spawnTimer = 0;
    }

    // ── Laser beam ──────────────────────────────────────────────────────────
    function startLaserCharge() {
      if (!state.running) { fireVulcan(); return; }
      state.laser.charging = true;
      state.laser.chargeFrames = 0;
      state.laser._pressStartFrame = state.frame;
      // reset one-time shield consumption when starting a new charge
      state.laser._shieldConsumed = false;
      SFX.charge();
    }

    function stopLaserCharge() {
      const laser = state.laser;
      SFX.stopCharge(); // 溜め音は発射・不発を問わずここで必ず止める
      if (laser.charging) {
        const pressFrames = (laser._pressStartFrame != null) ? (state.frame - laser._pressStartFrame) : laser.chargeFrames;
        const TAP_THRESHOLD = 8; // frames (~133ms at 60fps) considered a tap
        if (laser.chargeFrames >= laser.chargeDuration) {
          // fully charged on release → fire laser
          fireLaserBeam();
        } else if (pressFrames <= TAP_THRESHOLD) {
          // short tap -> fire vulcan
          fireVulcan();
        }
        // reset charge state in all cases
        laser.charging = false;
        laser.chargeFrames = 0;
        laser._pressStartFrame = null;
        laser._shieldConsumed = false;
      }
    }

    function fireLaserBeam() {
      const laser = state.laser;
      const height = state.ship.radius * 2; // beam height = ship diameter
      const yCenter = state.ship.y;
      laser.beam = { x: state.ship.x + state.ship.radius + 4, yCenter, height, speed: 22, frames: 0 };
      laser.chargeFrames = 0;
      laser.charging = false;
      // firing clears the one-time shield state
      laser._shieldConsumed = false;
      SFX.laser();
    }

    function updateLaser() {
      const laser = state.laser;
      // accumulate charge (no auto-fire; beam fires on release via stopLaserCharge)
      if (laser.charging && !laser.beam) {
        laser.chargeFrames = Math.min(laser.chargeDuration, laser.chargeFrames + 1);
      }
      // update charge glow on X button
      if (touchFire) {
        const pct = laser.chargeFrames / laser.chargeDuration;
        if (laser.charging && pct > 0 && !laser.beam) {
          touchFire.style.boxShadow = `0 0 ${6 + pct * 22}px rgba(80,210,255,${0.4 + pct * 0.6})`;
          touchFire.style.borderColor = `hsl(${190 + pct * 30},100%,70%)`;
        } else if (!laser.charging) {
          touchFire.style.boxShadow = '';
          touchFire.style.borderColor = '';
        }
      }
      // move beam
      if (!laser.beam) return;
      const b = laser.beam;
      b.x += b.speed;
      b.frames++;
      // break walls: widen columns swept by beam
      const cx0 = Math.max(0, Math.floor(b.x) - 6);
      const cx1 = Math.min(state.columns.length - 1, Math.floor(b.x) + 6);
      for (let cx = cx0; cx <= cx1; cx++) {
        const col = state.columns[cx];
        const beamTop    = b.yCenter - b.height / 2 - 6;
        const beamBottom = b.yCenter + b.height / 2 + 6;
        if (col.top  > beamTop)    col.top    = Math.max(4, beamTop);
        if (col.bottom < beamBottom) col.bottom = Math.min(canvas.height - 4, beamBottom);
      }
      // beam exits screen → clean up
      if (b.x > canvas.width + 60) laser.beam = null;
    }

    function tryUseLaserShield() {
      const laser = state.laser;
      // only while fully charged and before beam has been fired
      if (laser && laser.chargeFrames >= laser.chargeDuration && !laser.beam && !laser._shieldConsumed) {
        // consume single-use shield without releasing the charge
        laser._shieldConsumed = true;
        // small visual feedback
        createExplosion(state.ship.x, state.ship.y, "cyan");
        return true;
      }
      return false;
    }

    function releaseLaserChargeOnHit() {
      const laser = state.laser;
      if (!laser) return;
      // If currently charging (but not necessarily full), release/reset the charge
      if (laser.charging || laser.chargeFrames > 0) {
        SFX.stopCharge(); // 被弾でチャージが解けたら溜め音も止める
        laser.charging = false;
        laser.chargeFrames = 0;
        laser._pressStartFrame = null;
        laser._shieldConsumed = false;
        // clear touch button visuals if present
        if (touchFire) {
          touchFire.style.boxShadow = '';
          touchFire.style.borderColor = '';
        }
      }
    }

    function drawLaser() {
      const laser = state.laser;
      // charge ring around ship
      if (laser.charging && laser.chargeFrames > 0 && !laser.beam) {
        const pct = laser.chargeFrames / laser.chargeDuration;
        ctx.save();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = `rgba(80,210,255,${0.5 + 0.5 * pct})`;
        ctx.shadowColor = '#44ccff';
        ctx.shadowBlur = 10 * pct;
        ctx.beginPath();
        ctx.arc(state.ship.x, state.ship.y,
          state.ship.radius + 8 + pct * 6,
          -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * pct);
        ctx.stroke();
        // fully charged flash
        if (pct >= 1) {
          ctx.globalAlpha = 0.3 + 0.3 * Math.sin(state.frame * 0.4);
          ctx.fillStyle = 'rgba(80,210,255,0.25)';
          ctx.beginPath();
          ctx.arc(state.ship.x, state.ship.y, state.ship.radius + 16, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      // draw beam
      if (!laser.beam) return;
      const b = laser.beam;
      const tailX   = state.ship.x;
      const headX   = b.x;
      const halfH   = b.height / 2;
      ctx.save();
      // no shadowBlur here on purpose — blurring a full-width filled rect every
      // frame is one of the costliest things you can do on canvas, especially on
      // mobile; the gradient glow below already reads as a bloom without it
      // wide glow
      const glowGrad = ctx.createLinearGradient(tailX, 0, headX + 10, 0);
      glowGrad.addColorStop(0,   'rgba(40,180,255,0.0)');
      glowGrad.addColorStop(0.15,'rgba(40,180,255,0.55)');
      glowGrad.addColorStop(1,   'rgba(180,240,255,0.35)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(tailX, b.yCenter - halfH, headX - tailX + 10, b.height);
      // bright core
      const coreGrad = ctx.createLinearGradient(tailX, 0, headX + 10, 0);
      coreGrad.addColorStop(0, 'rgba(200,240,255,0.0)');
      coreGrad.addColorStop(0.2,'rgba(255,255,255,0.95)');
      coreGrad.addColorStop(1, 'rgba(255,255,255,1.0)');
      ctx.fillStyle = coreGrad;
      ctx.fillRect(tailX, b.yCenter - 4, headX - tailX + 10, 8);
      ctx.restore();
    }
    // ── End laser ──────────────────────────────────────────────────────────────

    // Fixed-timestep loop with catch-up: runs one 60Hz update() per 16.67ms of real
    // time elapsed, running extra update() calls (bounded) when the browser can't
    // sustain 60fps. Without this, a device stuck at e.g. 30fps only advances game
    // time at half speed — every timer (frames assume 60/sec) then takes ~2x as
    // long in real seconds, which is exactly the "1秒が1秒以上かかる" symptom.
    const TARGET_FRAME_MS = 1000 / 60;
    const MAX_CATCHUP_STEPS = 5; // avoid a death-spiral on very slow devices/tab switches
    let _accumulatedMs = 0;
    let _lastFrameTime = 0;
    // プレイ中(スタート後〜ゲームオーバー/クリア前)かつタッチデバイスの間だけ、
    // ページ全体のスクロール/pull-to-refreshを止める。終了後はランキングを
    // 読めるようロックを外す
    function isActivelyPlaying() {
      return isMobileDevice && state.started && !state.gameOver && !state.cleared;
    }
    function updatePlayLock() {
      document.body.classList.toggle("is-playing-lock", isActivelyPlaying());
    }

    // iOSのピンチズームは touch-action だけでは塞ぎきれないことがある
    // (gesturestart/gesturechange という WebKit独自イベント経由で発生するため)。
    // プレイ中だけ明示的に打ち消す。タイトル/ランキング閲覧時はズームできる
    // ままにして、アクセシビリティ(文字を拡大して読みたい場合)を残す
    ["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
      document.addEventListener(type, (e) => {
        if (isActivelyPlaying()) e.preventDefault();
      });
    });
    // 上記に対応しないブラウザ(Android Chrome等)向けの保険。touch-action: none
    // で通常は止まるはずだが、2本指の動きそのものも念のため打ち消しておく
    document.addEventListener("touchmove", (e) => {
      if (isActivelyPlaying() && e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    function loop(timestamp) {
      requestAnimationFrame(loop);
      // the very first call (from the direct loop() invocation at the bottom of this
      // script, not from rAF) has no timestamp — treat that, or any other non-finite
      // value, as "no time has passed yet". Without this guard, undefined - undefined
      // produces NaN, which poisons _accumulatedMs forever (NaN + anything is NaN),
      // permanently failing the while-loop condition below and freezing the game.
      if (!Number.isFinite(timestamp)) timestamp = _lastFrameTime || 0;
      if (!_lastFrameTime) _lastFrameTime = timestamp;
      let elapsed = timestamp - _lastFrameTime;
      _lastFrameTime = timestamp;
      if (elapsed > 1000) elapsed = TARGET_FRAME_MS; // tab was backgrounded — don't try to catch up on that gap
      _accumulatedMs += elapsed;
      // 毎フレーム、実際の画面の向きから orientationBlocked を引き直す。
      // イベントの取りこぼしや発火順序に関係なく必ず現状に追従させるため
      updateOrientationOverlay();
      let steps = 0;
      while (_accumulatedMs >= TARGET_FRAME_MS && steps < MAX_CATCHUP_STEPS) {
        if (state.started && !orientationBlocked) update();
        _accumulatedMs -= TARGET_FRAME_MS;
        steps++;
      }
      if (steps === MAX_CATCHUP_STEPS) _accumulatedMs = 0; // device can't keep up — drop the debt instead of spiraling
      updatePlayLock();
      render();
    }

    // ランキング登録フォームなどの入力欄にフォーカスがある間は、ゲーム操作キー
    // （WASD/矢印/X/Z/Space）を奪わない。スマホの仮想キーボードで "a" などの
    // 半角文字が入力できなくなっていたのはこれが原因。
    function isTypingInFormField(e) {
      const el = e.target;
      return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
    }

    window.addEventListener("keydown", (e) => {
      if (isTypingInFormField(e)) return;
      if (e.code === "ArrowUp" || e.code === "KeyW") {
        state.input.up = true;
        e.preventDefault();
      } else if (e.code === "ArrowDown" || e.code === "KeyS") {
        state.input.down = true;
        e.preventDefault();
      } else if (e.code === "ArrowLeft" || e.code === "KeyA") {
        state.input.left = true;
        e.preventDefault();
      } else if (e.code === "ArrowRight" || e.code === "KeyD") {
        state.input.right = true;
        e.preventDefault();
      } else if (e.code === "KeyX" && !e.repeat) {
        startLaserCharge();
        e.preventDefault();
      } else if (e.code === "KeyZ" && !e.repeat) {
        dropBomb();
        e.preventDefault();
      } else if (e.code === "Space" && !state.running) {
        if (gyro.active) recalibrateGyro();
        startGame();
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (isTypingInFormField(e)) return;
      if (e.code === "ArrowUp" || e.code === "KeyW") {
        state.input.up = false;
      } else if (e.code === "ArrowDown" || e.code === "KeyS") {
        state.input.down = false;
      } else if (e.code === "ArrowLeft" || e.code === "KeyA") {
        state.input.left = false;
      } else if (e.code === "ArrowRight" || e.code === "KeyD") {
        state.input.right = false;
      } else if (e.code === "KeyX") {
        stopLaserCharge();
      }
    });

    // restart button removed for mobile UI; use in-game controls to restart

    startButton.addEventListener("click", async () => {
      // AudioContext はユーザー操作を経ないと鳴らない(特にiOS)。ジャイロ許可と
      // 同じく、ここが唯一の起こせる場所なので await より前に呼ぶ
      SFX.unlock();
      // first start: try to enable gyro automatically. after that, respect the toggle button's choice.
      if (!gyro.userChoiceMade) {
        await enableGyroIfAvailable();
      } else if (gyro.active) {
        recalibrateGyro();
      }
      startGame();
    });

    // 十字の中央(🕹️)と発射ボタンの隣(🔫)にあるトグルは、方向ボタン間を
    // 親指が移動するたびに通過するため、タップ即作動だと誤爆する。
    // 長押ししてから指を離したときだけ切り替える。
    //
    // 閾値に到達した瞬間ではなく pointerup で実行するのは、iOSのジャイロ
    // 許可ダイアログ(DeviceOrientationEvent.requestPermission)がユーザー操作
    // 起点でないと出せないため。setTimeout から呼ぶと許可を求められなくなる。
    const HOLD_TOGGLE_MS = 600; // CSSの --hold-ms と一致させること
    function bindHoldToggle(button, action, onShortTap) {
      if (!button) return;
      let startedAt = 0;
      let readyTimer = null;
      const clearHold = () => {
        clearTimeout(readyTimer);
        readyTimer = null;
        startedAt = 0;
        button.classList.remove("holding", "hold-ready", "active");
      };
      button.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        capture(button, e);
        startedAt = performance.now();
        // .active は付けない——一瞬かすめただけで「押して確定した」見た目に
        // なってしまい、長押しにした意味が視覚的に消えるため
        button.classList.add("holding");
        readyTimer = setTimeout(() => button.classList.add("hold-ready"), HOLD_TOGGLE_MS);
      }, { passive: false });
      button.addEventListener("pointerup", (e) => {
        e.preventDefault();
        const heldLongEnough = startedAt > 0 && (performance.now() - startedAt) >= HOLD_TOGGLE_MS;
        clearHold();
        // 短いタップは切り替えず、代わりに操作方法を伝える（誤爆を防ぎつつ
        // 「押しても効かない」と誤解させない）
        if (heldLongEnough) action();
        else if (onShortTap) onShortTap();
      }, { passive: false });
      button.addEventListener("pointercancel", clearHold, { passive: false });
      button.addEventListener("lostpointercapture", clearHold, { passive: false });
      button._clearHold = clearHold; // resetAllInputs から呼べるように
    }

    bindHoldToggle(
      gyroToggleButton,
      toggleGyroControls,
      () => updateGyroStatus("長押しで傾き操作とキー/タッチを切り替えます")
    );

    function setTouchControl(button, actionKey, enabled) {
      state.input[actionKey] = enabled;
      button.classList.toggle("active", enabled);
    }

    // Pointer Events だけで統一して管理する。setPointerCapture() したポインタは
    // 指が要素の外に滑り出ても pointerup/pointercancel が必ずこの要素に届くため、
    // 従来 pointerleave に頼っていた「指がボタン外に出たら離したとみなす」判定
    // (ブラウザによっては touch 由来のポインタで信頼できない) が不要になる。
    // Pointer Events はマウス/タッチ/ペンを一本化しているので touchstart や
    // mousedown の別系統リスナーは重複となり削除。各ボタン・各指(pointerId)は
    // 独立して捕捉されるため、複数ボタン同時押し(斜め移動など)もそのまま効く
    function capture(button, e) {
      if (button.setPointerCapture) {
        try { button.setPointerCapture(e.pointerId); } catch (err) { /* すでに解放済み等は無視 */ }
      }
    }

    function bindTouchControl(button, actionKey) {
      const start = (e) => {
        e.preventDefault();
        capture(button, e);
        setTouchControl(button, actionKey, true);
      };
      const end = (e) => {
        e.preventDefault();
        setTouchControl(button, actionKey, false);
      };

      button.addEventListener("pointerdown", start, { passive: false });
      button.addEventListener("pointerup", end, { passive: false });
      button.addEventListener("pointercancel", end, { passive: false });
      button.addEventListener("lostpointercapture", end, { passive: false });
    }

    bindTouchControl(touchUp, "up");
    bindTouchControl(touchLeft, "left");
    bindTouchControl(touchRight, "right");
    bindTouchControl(touchDown, "down");

    // Fire and Bomb buttons: single tap only, no repeat
    function makeTapButton(button, action) {
      if (!button) return;
      const press   = (e) => { e.preventDefault(); capture(button, e); action(); button.classList.add('active'); };
      const release = () => button.classList.remove('active');
      button.addEventListener('pointerdown', press,   { passive: false });
      button.addEventListener('pointerup',   release, { passive: false });
      button.addEventListener('pointercancel', release, { passive: false });
      button.addEventListener('lostpointercapture', release, { passive: false });
    }

    // X button: short tap = vulcan, hold 3s = laser beam
    if (touchFire) {
      const firePress   = (e) => { e.preventDefault(); capture(touchFire, e); startLaserCharge(); touchFire.classList.add('active'); };
      const fireRelease = (e) => { e.preventDefault(); stopLaserCharge();  touchFire.classList.remove('active'); };
      touchFire.addEventListener('pointerdown', firePress, { passive: false });
      touchFire.addEventListener('pointerup',   fireRelease, { passive: false });
      touchFire.addEventListener('pointercancel', fireRelease, { passive: false });
      touchFire.addEventListener('lostpointercapture', fireRelease, { passive: false });
    }
    makeTapButton(touchBomb, () => dropBomb());

    // 自動連射のオン/オフ。X/💣のすぐ隣にあるので、🕹️と同じく長押しで切り替える
    function updateAutoFireToggleUI() {
      if (!autoFireToggle) return;
      autoFireToggle.classList.toggle("on", autoFireEnabled);
      autoFireToggle.setAttribute(
        "aria-label",
        autoFireEnabled ? "自動連射:オン(長押しでオフ)" : "自動連射:オフ(長押しでオン)"
      );
    }
    bindHoldToggle(
      autoFireToggle,
      () => {
        autoFireEnabled = !autoFireEnabled;
        autoFireTimer = 0;
        updateAutoFireToggleUI();
        updateGyroStatus(autoFireEnabled ? "自動連射: オン" : "自動連射: オフ");
      },
      () => updateGyroStatus("長押しで自動連射を切り替えます")
    );
    updateAutoFireToggleUI();

    // 効果音のオン/オフ。音が出るゲームには必須の逃げ道で、特にモバイルでは
    // 「音を出せない場所で開いてしまった」を即座に解消できる必要がある
    function updateMuteToggleUI() {
      if (!muteToggle) return;
      muteToggle.classList.toggle("on", !SFX.muted);
      muteToggle.textContent = SFX.muted ? "🔇" : "🔊";
      muteToggle.setAttribute(
        "aria-label",
        SFX.muted ? "効果音:オフ(長押しでオン)" : "効果音:オン(長押しでオフ)"
      );
    }
    bindHoldToggle(
      muteToggle,
      () => {
        SFX.unlock(); // オンに戻した直後から鳴るように、ここでも起こしておく
        SFX.setMuted(!SFX.muted);
        updateMuteToggleUI();
        updateGyroStatus(SFX.muted ? "効果音: オフ" : "効果音: オン");
        if (!SFX.muted) SFX.pickup(); // 音量の確認用に一発鳴らす
      },
      () => updateGyroStatus("長押しで効果音を切り替えます")
    );
    updateMuteToggleUI();

    // タッチ操作の途中でアプリがバックグラウンドに回った/タブが非表示になった
    // 場合、pointerup/pointercancel が届かないことがある(通知バナーやOSの
    // ジェスチャーに割り込まれる等)。その場合に方向入力が押しっぱなしのまま
    // 残って自機が動き続けないよう、blur/visibilitychangeで全入力を強制リセット
    function resetAllInputs() {
      state.input.up = false;
      state.input.down = false;
      state.input.left = false;
      state.input.right = false;
      state.input.gyroX = 0;
      state.input.gyroY = 0;
      [touchUp, touchLeft, touchRight, touchDown, touchFire, touchBomb, autoFireToggle, muteToggle, gyroToggleButton].forEach((btn) => {
        if (!btn) return;
        btn.classList.remove("active");
        // 長押し中に割り込まれた場合、進捗と計測をここで確実に捨てる
        // （復帰後に古い開始時刻が残っていると一瞬のタップで作動してしまう）
        if (btn._clearHold) btn._clearHold();
      });
      releaseLaserChargeOnHit();
    }
    window.addEventListener("blur", resetAllInputs);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) resetAllInputs();
    });

    if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
      // shown by default; hidden automatically once real tilt events start arriving
      touchPad.style.display = "grid";
      firePad.style.display = "block";
      // ここから先は updateGameControlsVisibility() がプレイ中だけ出すよう制御する
      touchControlsEnabled = true;
      if (window.DeviceOrientationEvent) {
        gyroToggleButton.style.display = "inline-block";
        updateGyroToggleLabel();
        updateGyroStatus("スタートを押すと、対応端末では傾き操作に切り替わります（右のXでバルカン発射）");
      } else {
        updateGyroStatus("iPhoneは右下の十字キーで移動、右のXでバルカン発射できます");
      }
    } else {
      updateGyroStatus("PCはキーボード、スマホは右下コントローラーで移動と発射ができます");
    }

    // reduced-motion なら明滅を止める（走査線は静止画なのでそのまま残す）
    const _reduceMotionMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
    RETRO.reduceMotion = _reduceMotionMQ.matches;
    if (typeof _reduceMotionMQ.addEventListener === "function") {
      _reduceMotionMQ.addEventListener("change", (e) => { RETRO.reduceMotion = e.matches; });
    }

    // canvasのテキストはCSSのfont-familyを見ないので、描画前にレトロ書体を
    // 明示ロードする。未ロードのままだと最初の数フレームだけ既定書体で描かれる
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('16px "Press Start 2P"'),
        document.fonts.load('16px "DotGothic16"')
      ])
        // 書体が変わるとスタートボタンの実寸も変わる。読み込み前に測った
        // 寸法でクランプしたままだと位置がずれるので、確定後に測り直す
        .then(() => { if (_startButtonWasShown) positionStartButton(); })
        .catch(() => { /* 取得失敗時は monospace にフォールバックする */ });
    }

    // populate an idle scene (columns/ship/stars) before the player presses スタート
    resetGame();
    loadLeaderboard();
    loop();
  </script>
</body>
</html>
