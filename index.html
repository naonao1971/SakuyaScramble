<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SAKUYA SCRAMBLE</title>
  <!-- OGP / Twitter Card -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SAKUYA SCRAMBLE" />
  <meta property="og:description" content="クリプト忍者咲耶の宇宙船で洞窟を駆け抜けるブラウザゲーム" />
  <meta property="og:url" content="https://naonao1971.github.io/SakuyaScramble/" />
  <meta property="og:image" content="https://naonao1971.github.io/SakuyaScramble/image01.jpg" />
  <meta property="og:image:width" content="1672" />
  <meta property="og:image:height" content="941" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SAKUYA SCRAMBLE" />
  <meta name="twitter:description" content="クリプト忍者咲耶の宇宙船で洞窟を駆け抜けるブラウザゲーム" />
  <meta name="twitter:image" content="https://naonao1971.github.io/SakuyaScramble/image01.jpg" />
  <!-- レトロアーケード書体。display=欧文/数字、body=和文。どちらもOFLで組込み可 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;

      /* --- レトロアーケード トークン（方向宣言の正典。ここ以外に色を書かない） --- */
      --bg: #08090F;        /* 地 */
      --panel: #12141F;     /* 面 */
      --ink: #D6E4F0;       /* 文字（燐光の白） */
      --dim: #7C8BA6;       /* 減光した補助文字 */
      --amber: #FFB020;     /* 徴: スコア・CTA・選択のみ。面に塗らない */
      --danger: #FF3B6B;
      --hp: #35E08A;
      /* 筐体のベベル: ぼかし0のハードな3色で金属の縁を作る。
         lit=光の当たる上辺/左辺、lo=影になる下辺/右辺 */
      --edge-hi: #2A3242;
      --edge-lit: #39445A;
      --edge-lo: #05060A;
      /* ベベルの共通処方。押下時はinsetの向きを反転させて物理的に沈ませる */
      --bevel-up: inset 2px 2px 0 var(--edge-lit), inset -2px -2px 0 var(--edge-lo);
      --bevel-down: inset 2px 2px 0 var(--edge-lo), inset -2px -2px 0 var(--edge-lit);

      /* 角丸はレトロでは立てる。7種あったものを0に統一 */
      --radius: 0px;

      /* 長押しトグルの必要保持時間。JS側の閾値と必ず同じ値にする */
      --hold-ms: 600ms;

      /* 和欧混植は欧文を先に書き、数字とラテンを欧文側へ拾わせる */
      --font-display: "Press Start 2P", "DotGothic16", monospace;
      --font-body: "DotGothic16", "Press Start 2P", monospace;
    }
    html, body {
      overscroll-behavior: none;
    }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      min-height: 100dvh;
      padding: 20px 12px 40px;
      box-sizing: border-box;
      touch-action: manipulation;
      /* スマホでボタンや画面を長押し/ドラッグしたときに、テキストや要素が
         選択状態(青い反転)になったり、iOSのコピー/調べる のメニューが
         出たり、タップのたびに灰色のハイライトが乗るのを止める。
         いずれも継承プロパティなので body に指定すれば全体に効く */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* ランキング登録の入力欄だけは、文字の選択・カーソル移動ができないと
       困るので選択を戻す */
    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }
    /* プレイ中のみ付与: スワイプでのページスクロール／pull-to-refreshを止める。
       ゲームオーバー/クリア後はランキングを読めるよう外す */
    body.is-playing-lock {
      touch-action: none;
      overflow: hidden;
    }
    .wrap {
      position: relative;
      text-align: center;
    }
    canvas {
      width: min(92vw, 960px);
      height: auto;
      max-height: 72vh;
      /* 筐体のベゼル: ぼかし無しの2色ベベルで金属の縁を作る。
         一律1pxグレー枠(スロップ第1兆候)は使わない */
      border: 2px solid var(--edge-hi);
      box-shadow:
        inset 0 0 0 2px var(--edge-lo),
        0 0 0 2px var(--edge-lo),
        0 0 24px rgba(255, 176, 32, 0.10);
      background: #02040a;
      image-rendering: pixelated;
      touch-action: none;
    }
    /* covers the canvas 1:1 (left/top/width/height set in JS from its
       getBoundingClientRect(), matching how positionStartButton lines up
       with the canvas) while the device is held in portrait */
    .orientation-overlay {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(5, 8, 16, 0.94);
      border: 2px solid var(--amber);
      z-index: 30;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
      pointer-events: auto;
    }
    .orientation-overlay.visible {
      display: flex;
    }
    .orientation-overlay-icon {
      font-size: 42px;
    }
    .orientation-overlay-title {
      margin: 0;
      font-family: var(--font-display);
      color: var(--amber);
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }
    .orientation-overlay p {
      margin: 0;
      font-family: var(--font-body);
      color: var(--amber);
      font-size: 16px;
      line-height: 1.5;
    }
    .help {
      margin-top: 10px;
      color: var(--dim);
      font-size: 12px;
    }
    .mobile-controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .mobile-controls button {
      appearance: none;
      border: 2px solid var(--edge-hi);
      background: var(--panel);
      color: var(--ink);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-family: var(--font-display);
      font-size: 11px;
      /* 筐体ボタンのハードベベル。blur 0 が命——ぼかすと途端に現代のUIになる */
      box-shadow: var(--bevel-up);
    }
    .mobile-controls button:disabled {
      opacity: 0.4;
    }
    .hud-start {
      /* left/top are set per-frame in JS (positionStartButton) to track the
         canvas-space "start here" hint spot at any display scale */
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 2;
      /* UA既定のボタン外観に任せず、筐体ボタンとして明示的に組む */
      appearance: none;
      padding: 12px 20px;
      font-family: var(--font-body);
      font-size: 13px;
      border-radius: var(--radius);
      background: var(--panel);
      /* 徴の琥珀は「線と文字」に置く。面に塗ると一気に安くなる */
      color: var(--amber);
      border: 2px solid var(--amber);
      box-shadow: var(--bevel-up);
      /* アーケードの「PUSH START」の明滅。steps()で矩形波にすると
         フェードでなく本物の点滅になる */
      animation: arcade-blink 1.1s steps(1, end) infinite;
    }
    .hud-start:active {
      box-shadow: var(--bevel-down);
      transform: translate(-50%, -50%) translateY(2px);
    }
    @keyframes arcade-blink {
      /* 消灯側は0.62まで。これより落とすと琥珀×面のコントラストが
         4.5:1を割り、点滅の谷でCTAが読めなくなる（実測: 0.35で2.29:1） */
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0.62; }
    }
    /* sits in the empty center cell of the 3x3 touch d-pad grid */
    .gyro-toggle {
      grid-column: 2;
      grid-row: 2;
      font-size: 18px;
      padding: 0;
    }
    .status {
      min-height: 1.4em;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
    }
    .touch-pad {
      /* scales down on narrow screens instead of staying a fixed 56px */
      --dpad-size: clamp(34px, 9vw, 56px);
      --dpad-gap: clamp(4px, 1.2vw, 8px);
      position: relative;
      z-index: 1;
      display: none;
      grid-template-columns: repeat(3, var(--dpad-size));
      grid-template-rows: repeat(3, var(--dpad-size));
      gap: var(--dpad-gap);
      pointer-events: auto;
    }
    .touch-pad .touch-btn {
      width: var(--dpad-size);
      height: var(--dpad-size);
      font-size: clamp(14px, 4vw, 22px);
      border-radius: var(--radius);
    }
    .touch-up {
      grid-column: 2;
      grid-row: 1;
    }
    .touch-left {
      grid-column: 1;
      grid-row: 2;
    }
    .touch-right {
      grid-column: 3;
      grid-row: 2;
    }
    .touch-down {
      grid-column: 2;
      grid-row: 3;
    }
    .fire-pad {
      /* pin fire/bomb buttons to the left-bottom of the viewport, clear of
         the iPhone home-indicator / notch via safe-area-inset */
      position: fixed;
      left: calc(18px + env(safe-area-inset-left));
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 6;
      display: none;
      pointer-events: auto;
      flex-direction: column;
      gap: 8px;
    }
    .touch-fire {
      /* 発射ボタンだけ徴の琥珀で縁取り、押すべき場所を1つに絞る。
         寸法は .touch-btn の56pxに揃える（筐体の同型ボタンの並び）——
         ここで width/height を書いても後続の .touch-btn に負けるので書かない */
      border-color: var(--amber);
      color: var(--amber);
      font-family: var(--font-display);
      font-size: 14px;
    }
    .touch-btn {
      width: 56px;
      height: 56px;
      border-radius: var(--radius);
      border: 2px solid var(--edge-hi);
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      font-weight: 400;
      /* backdrop-filterは中級端末で15〜30%のFPS低下を招くため、
         ゲーム中に常時出る操作ボタンからは外す */
      box-shadow: var(--bevel-up);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 長押しトグルは :active から除外する。押した瞬間に縁が徴の色になると
       「確定した」見た目になり、閾値に到達したかどうかが区別できなくなる */
    .touch-btn:not(.hold-toggle):active,
    .touch-btn.active {
      /* 押下でベベルを反転させ、物理的に沈み込ませる */
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: var(--bevel-down);
      transform: translateY(2px);
    }
    /* 長押しトグル: 十字の中央や発射ボタンの隣にあり、指がかすめただけで
       作動すると誤爆になる。押している間だけ琥珀が下から満ちていき、
       満ちてから指を離したときに初めて切り替わる */
    .hold-toggle {
      position: relative;
      overflow: hidden;
    }
    .hold-toggle::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 0;
      background: rgba(255, 176, 32, 0.38);
      pointer-events: none;
    }
    .hold-toggle.holding::after {
      height: 100%;
      transition: height var(--hold-ms) linear;
    }
    /* 押している間は沈ませるだけで、縁の色は変えない。ここで .active と
       同じ「確定した見た目」にすると、閾値に達したかどうかが区別できない */
    .hold-toggle.holding {
      box-shadow: var(--bevel-down);
      transform: translateY(2px);
    }
    /* 閾値に到達＝「離せば切り替わる」。ここで初めて縁を徴の色にする */
    .hold-toggle.hold-ready {
      border-color: var(--amber);
      color: var(--amber);
    }
    /* X/💣より一回り小さい常設トグル。ONの間だけ徴の色で縁取る。
       小さくしても44ptの床は割らない（モバイルのタップ目標の最小） */
    .auto-fire-toggle {
      width: 44px;
      height: 44px;
      font-size: 17px;
      align-self: center;
      opacity: 0.55;
    }
    .auto-fire-toggle.on {
      opacity: 1;
      border-color: var(--amber);
    }
    .controls-bottom {
      /* fire-pad と同じ position: fixed に統一し、画面サイズ/向きが変わっても
         2つのボタン群の相対位置がズレないようにする */
      position: fixed;
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 3;
      display: flex;
      gap: 14px;
      align-items: flex-end;
      pointer-events: none;
    }
    .controls-bottom > * {
      pointer-events: auto;
    }

    /* --- ランキング（TOP10） --- */
    .leaderboard {
      width: min(92vw, 960px);
      box-sizing: border-box;
      background: var(--panel);
      border: 2px solid var(--edge-hi);
      border-radius: var(--radius);
      box-shadow: var(--bevel-up);
      padding: 16px 18px 20px;
      display: none;
    }
    .leaderboard.visible {
      display: block;
    }
    .leaderboard-title {
      margin: 0 0 16px;
      font-family: var(--font-display);
      font-size: 13px;
      line-height: 1.5;
      color: var(--amber);
      text-align: center;
    }
    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    /* columns: 順位 / ニックネーム / Xの名称 / スコア */
    .leaderboard-row {
      display: grid;
      grid-template-columns: 40px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: var(--radius);
      font-size: 13px;
    }
    .leaderboard-row .lb-rank {
      color: var(--dim);
      font-family: var(--font-display);
      font-size: 11px;
      text-align: center;
    }
    .leaderboard-row .lb-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .leaderboard-row .lb-xname {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .leaderboard-row .lb-avatar {
      width: 22px;
      height: 22px;
      border-radius: var(--radius);
      object-fit: cover;
      background: var(--panel);
      flex: none;
    }
    .leaderboard-row .lb-xlink {
      color: var(--dim);
      text-decoration: none;
      font-size: 11px;
      white-space: nowrap;
    }
    .leaderboard-row .lb-xlink:hover {
      text-decoration: underline;
    }
    .leaderboard-row .lb-score {
      color: var(--amber);
      font-family: var(--font-display);
      font-size: 11px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    /* 救出ロスター: 行の全幅を使う2段目に置く。1段目に並べると
       スマホ幅でニックネームが潰れるため */
    .leaderboard-row .lb-roster {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 2px;
    }
    .leaderboard-row .lb-slot {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(255, 176, 32, 0.2);
      background: rgba(0, 0, 0, 0.32);
      overflow: hidden;
      flex: none;
    }
    .leaderboard-row .lb-slot.got {
      border-color: hsl(var(--h), 85%, 62%);
      background: hsl(var(--h), 60%, 40%);
    }
    .leaderboard-row .lb-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .leaderboard-row .lb-roster-count {
      color: var(--dim);
      font-family: var(--font-display);
      font-size: 9px;
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }
    .leaderboard-empty {
      color: var(--dim);
      font-size: 12px;
      text-align: center;
      padding: 10px 0;
    }
    .score-register {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--edge-hi);
      display: none;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .score-register.visible {
      display: flex;
    }
    .score-register-msg {
      margin: 0;
      color: var(--amber);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
    .score-register input {
      width: min(280px, 90%);
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 2px solid var(--edge-hi);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px; /* iOSの入力時ズームを防ぐ下限 */
      box-shadow: inset 2px 2px 0 var(--edge-lo);
    }
    .score-register input:focus {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
      border-color: var(--amber);
    }
    .score-register button {
      padding: 12px 22px;
      border-radius: var(--radius);
      border: 2px solid var(--amber);
      background: var(--panel);
      color: var(--amber);
      font-family: var(--font-display);
      font-size: 11px;
      box-shadow: var(--bevel-up);
    }
    .score-register button:active:not(:disabled) {
      box-shadow: var(--bevel-down);
      transform: translateY(2px);
    }
    .score-register button:disabled {
      opacity: 0.4;
      border-color: var(--edge-hi);
      color: var(--dim);
    }
    .rank-submit-status {
      margin: 0;
      font-size: 12px;
      color: var(--dim);
      min-height: 1.2em;
    }
    .xid-preview {
      width: min(280px, 90%);
      min-height: 1.4em;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .xid-preview.visible {
      display: flex;
    }
    .xid-preview.xid-loading {
      color: var(--dim);
    }
    .xid-preview.xid-error {
      color: var(--danger);
    }
    .xid-preview.xid-found {
      color: var(--hp);
    }
    .xid-preview .xid-avatar {
      width: 22px;
      height: 22px;
      border-radius: var(--radius);
      object-fit: cover;
      background: var(--panel);
    }
    .xid-preview a {
      color: var(--dim);
    }
    /* 走査線と明滅は「動き」なので、reduced-motion指定時は止める */
    @media (prefers-reduced-motion: reduce) {
      .hud-start {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="960" height="540" aria-label="Scramble tunnel game"></canvas>
    <div id="orientationOverlay" class="orientation-overlay" role="alert" aria-live="assertive">
      <p class="orientation-overlay-title">SAKUYA SCRAMBLE</p>
      <div class="orientation-overlay-icon">📱⤾</div>
      <p>横向きにしてね ⌐◨-◨</p>
    </div>
    <div id="gyroStatus" class="status"></div>
    <div class="controls-bottom" aria-hidden="false">
      <div id="firePad" class="fire-pad" aria-label="発射ボタン">
        <button id="touchFire" class="touch-btn touch-fire" type="button" aria-label="バルカン発射">X</button>
        <button id="touchBomb" class="touch-btn touch-bomb" type="button" aria-label="爆弾投下">💣</button>
        <button id="autoFireToggle" class="touch-btn auto-fire-toggle hold-toggle" type="button" aria-label="自動連射:オン(長押しでオフ)">🔫</button>
        <button id="muteToggle" class="touch-btn auto-fire-toggle hold-toggle on" type="button" aria-label="効果音:オン(長押しでオフ)">🔊</button>
      </div>
      <div id="touchPad" class="touch-pad" aria-label="タッチコントローラー">
        <button id="touchUp" class="touch-btn touch-up" type="button" aria-label="上昇">▲</button>
        <button id="touchLeft" class="touch-btn touch-left" type="button" aria-label="左移動">◀</button>
        <button id="touchRight" class="touch-btn touch-right" type="button" aria-label="右移動">▶</button>
        <button id="touchDown" class="touch-btn touch-down" type="button" aria-label="下降">▼</button>
      </div>
    </div>
  </div>

  <section id="leaderboard" class="leaderboard" aria-label="ランキング TOP10">
    <div id="scoreRegisterForm" class="score-register">
      <p class="score-register-msg">TOP10入り！ニックネームを登録してください</p>
      <input id="rankNickname" type="text" placeholder="ニックネーム（必須）" maxlength="20" autocomplete="off" />
      <input id="rankXid" type="text" placeholder="XのユーザーID（任意・@なし）" maxlength="20" autocomplete="off" />
      <div id="rankXidPreview" class="xid-preview"></div>
      <button id="rankSubmitBtn" type="button">登録する</button>
      <p id="rankSubmitStatus" class="rank-submit-status"></p>
    </div>
    <h2 class="leaderboard-title">🏆 TOP10 ランキング</h2>
    <ol id="leaderboardList" class="leaderboard-list"></ol>
  </section>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const gyroStatus = document.getElementById("gyroStatus");
    const orientationOverlay = document.getElementById("orientationOverlay");
    // 縦持ちだと自機の当たり判定がほぼ視認できないサイズまで縮むため、
    // スマホ縦持ち中はオーバーレイで案内しゲームを一時停止する（PCでは出さない）
    const portraitMQ = window.matchMedia("(orientation: portrait)");
    let orientationBlocked = false;

    // --- ランキング (Google スプレッドシート連携) ---
    // デプロイ後の Apps Script Web App URL をここに設定してください（apps-script.gs 参照）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyTTaCaeW6hPn60U2UeG3Cle9tHjQ4I4PaujzYkXzNKaxprlMhlR4KELXv0dE7VVyFr/exec";
    const leaderboardPanel = document.getElementById("leaderboard");
    const leaderboardList = document.getElementById("leaderboardList");
    const scoreRegisterForm = document.getElementById("scoreRegisterForm");
    const rankNicknameInput = document.getElementById("rankNickname");
    const rankXidInput = document.getElementById("rankXid");
    const rankSubmitBtn = document.getElementById("rankSubmitBtn");
    const rankSubmitStatus = document.getElementById("rankSubmitStatus");
    const rankXidPreview = document.getElementById("rankXidPreview");
    // タッチ操作対応端末をモバイルとみなし、ランキング登録時に記録する
    const isMobileDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
    let leaderboardCache = [];
    let scoreSubmitted = false;
    // X ID の検証状態: 未入力なら常に登録可、入力中は検証が完了(found)するまで登録不可
    let xidVerifyState = "empty"; // "empty" | "loading" | "found" | "error"
    let xidVerifyToken = 0; // 直前の検証より新しい結果だけ反映するための連番

    function escapeHTML(s) {
      return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    // ランキング1行ぶんの救出ロスター。canvas側と同じ「額縁が埋まる」見え方を
    // DOMで再現する。救出キャラを持たない過去の記録では行ごと出さない
    function rescueRosterHTML(rescued) {
      const raw = String(rescued == null ? "" : rescued).trim();
      if (!raw) return "";
      const got = new Set(
        raw.split(",").map((s) => Number(s)).filter((v) => Number.isInteger(v) && v >= 1 && v <= cnpChars.length)
      );
      if (!got.size) return "";
      const slots = cnpChars
        .map((ch) => {
          const on = got.has(ch.index + 1);
          // 画像が未配置でも救出済みかどうかが読めるよう、枠の地色もキャラ色にする。
          // 画像が404のときは onerror で img だけ消え、色の付いた額が残る
          const img = on ? `<img src="assets/cnp/${ch.id}.png" alt="" loading="lazy" onerror="this.remove()">` : "";
          return `<span class="lb-slot${on ? " got" : ""}" style="--h:${ch.hue}" title="${escapeHTML(ch.label)}">${img}</span>`;
        })
        .join("");
      return `<span class="lb-roster">${slots}<span class="lb-roster-count">${got.size}/${cnpChars.length}</span></span>`;
    }

    function renderLeaderboard() {
      if (!leaderboardList) return;
      if (!leaderboardCache.length) {
        leaderboardList.innerHTML = '<li class="leaderboard-empty">まだ記録がありません</li>';
        return;
      }
      // 表示順: 順位 / ニックネーム / Xの名称 / スコア
      leaderboardList.innerHTML = leaderboardCache
        .slice(0, 10)
        .map((r, i) => {
          const rank = i + 1;
          const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : `${rank}`;
          const xid = String(r.xid || "").replace(/^@/, "").trim();
          const xPart =
            xid && /^[A-Za-z0-9_]{1,15}$/.test(xid)
              ? `<img class="lb-avatar" src="https://unavatar.io/x/${encodeURIComponent(xid)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                 <a class="lb-xlink" href="https://x.com/${encodeURIComponent(xid)}" target="_blank" rel="noopener noreferrer">@${escapeHTML(xid)}</a>`
              : "";
          const deviceIcon = r.device === "モバイル" ? "📱" : r.device === "PC" ? "💻" : "";
          return `<li class="leaderboard-row">
              <span class="lb-rank">${medal}</span>
              <span class="lb-name">${deviceIcon ? `<span class="lb-device" title="${escapeHTML(r.device)}">${deviceIcon}</span> ` : ""}${escapeHTML(r.nickname)}</span>
              <span class="lb-xname">${xPart}</span>
              <span class="lb-score">${Math.floor(r.score)}</span>
              ${rescueRosterHTML(r.rescued)}
            </li>`;
        })
        .join("");
    }

    function loadLeaderboard() {
      if (!GAS_URL) {
        renderLeaderboard();
        return;
      }
      fetch(GAS_URL, { cache: "no-store" })
        .then((r) => r.json())
        .then((d) => {
          leaderboardCache = (d.records || []).slice().sort((a, b) => b.score - a.score);
          renderLeaderboard();
        })
        .catch(() => renderLeaderboard());
    }

    function qualifiesForTop10(score) {
      if (leaderboardCache.length < 10) return true;
      return score > leaderboardCache[9].score;
    }

    function setLeaderboardVisible(visible) {
      if (!leaderboardPanel) return;
      leaderboardPanel.classList.toggle("visible", !!visible);
    }

    // モバイルだと登録フォームがcanvasより下にあり、スクロールしないと存在に
    // 気づけない。かといって即スクロールするとcanvas上のCLEAR画像/スコアを
    // 見る前に飛んでしまうので、クリア演出を見せてから誘導する
    const SCORE_FORM_SCROLL_DELAY_MS = 2000;
    let _scoreFormScrollTimer = null;

    function scrollToScoreRegisterForm() {
      if (!scoreRegisterForm || !scoreRegisterForm.classList.contains("visible")) return;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      scoreRegisterForm.scrollIntoView({
        behavior: reduceMotion ? "auto" : "smooth",
        block: "center"
      });
      // preventScroll: フォーカスによる瞬間スクロールが上のスムーズ移動と
      // 競合しないように。iOSはユーザー操作を伴わないfocus()ではキーボードを
      // 開かない仕様なので、あくまで開けば得という位置づけ
      if (rankNicknameInput) {
        try {
          rankNicknameInput.focus({ preventScroll: true });
        } catch (e) {
          /* preventScroll未対応ブラウザなどは無視 */
        }
      }
    }

    function showScoreRegisterForm() {
      if (!scoreRegisterForm) return;
      scoreRegisterForm.classList.add("visible");
      rankNicknameInput.value = "";
      rankXidInput.value = "";
      rankSubmitStatus.textContent = "";
      xidVerifyState = "empty";
      setXidPreview(null, "");
      updateSubmitAvailability();
      clearTimeout(_scoreFormScrollTimer);
      _scoreFormScrollTimer = setTimeout(scrollToScoreRegisterForm, SCORE_FORM_SCROLL_DELAY_MS);
    }

    function hideScoreRegisterForm() {
      if (!scoreRegisterForm) return;
      // 2秒待たずに再スタートされた場合、ゲーム中に誘導スクロールが
      // 割り込まないよう必ず取り消す(resetGame()からも呼ばれる)
      clearTimeout(_scoreFormScrollTimer);
      _scoreFormScrollTimer = null;
      scoreRegisterForm.classList.remove("visible");
    }

    // ニックネーム入力済み、かつ(X IDが空 または 検証済みfound)のときだけ登録可能にする
    function updateSubmitAvailability() {
      if (!rankSubmitBtn) return;
      const nickname = rankNicknameInput.value.trim();
      const xidOk = xidVerifyState === "empty" || xidVerifyState === "found";
      rankSubmitBtn.disabled = !nickname || !xidOk;
    }

    function setXidPreview(mode, html) {
      if (!rankXidPreview) return;
      rankXidPreview.className = "xid-preview" + (mode ? " visible xid-" + mode : "");
      rankXidPreview.innerHTML = html || "";
    }

    // unavatar.io へのアバター読み込み成否で、Xアカウントが実在するかを簡易検証する
    function verifyXid(rawXid) {
      const username = String(rawXid || "").replace(/^@/, "").trim();
      xidVerifyToken++;
      const token = xidVerifyToken;

      if (!username) {
        xidVerifyState = "empty";
        setXidPreview(null, "");
        updateSubmitAvailability();
        return;
      }
      if (!/^[A-Za-z0-9_]{1,15}$/.test(username)) {
        xidVerifyState = "error";
        setXidPreview("error", "形式エラー：半角英数字・アンダースコアのみ、最大15文字で入力してください");
        updateSubmitAvailability();
        return;
      }

      xidVerifyState = "loading";
      setXidPreview("loading", "確認中...");
      updateSubmitAvailability();

      const img = new Image();
      img.onload = () => {
        if (token !== xidVerifyToken) return; // 途中で入力が変わっていたら無視
        xidVerifyState = "found";
        setXidPreview(
          "found",
          `<img src="https://unavatar.io/x/${encodeURIComponent(username)}" alt="" class="xid-avatar">` +
            `<a href="https://x.com/${encodeURIComponent(username)}" target="_blank" rel="noopener noreferrer">@${escapeHTML(username)}</a>` +
            `<span>を確認しました</span>`
        );
        updateSubmitAvailability();
      };
      img.onerror = () => {
        if (token !== xidVerifyToken) return;
        xidVerifyState = "error";
        setXidPreview("error", "このXアカウントの名称を取得できませんでした。IDを確認してください");
        updateSubmitAvailability();
      };
      img.src = "https://unavatar.io/x/" + encodeURIComponent(username);
    }

    if (rankXidInput) {
      // 入力中は再検証されるまで登録不可にする（値を空にした場合のみ即座に登録可へ戻す）
      rankXidInput.addEventListener("input", () => {
        const username = rankXidInput.value.trim();
        if (!username) {
          xidVerifyState = "empty";
          setXidPreview(null, "");
        } else {
          xidVerifyState = "loading";
          setXidPreview(null, "");
        }
        updateSubmitAvailability();
      });
      rankXidInput.addEventListener("blur", () => verifyXid(rankXidInput.value));
    }
    if (rankNicknameInput) {
      rankNicknameInput.addEventListener("input", updateSubmitAvailability);
    }

    if (rankSubmitBtn) {
      rankSubmitBtn.addEventListener("click", () => {
        const nickname = rankNicknameInput.value.trim();
        if (!nickname) {
          rankSubmitStatus.textContent = "ニックネームを入力してください";
          rankNicknameInput.focus();
          return;
        }
        if (xidVerifyState !== "empty" && xidVerifyState !== "found") {
          rankSubmitStatus.textContent = "XのIDを確認できるまで登録できません";
          rankXidInput.focus();
          return;
        }
        const xid = rankXidInput.value.trim().replace(/^@/, "");
        rankSubmitBtn.disabled = true;
        rankSubmitStatus.textContent = "登録中...";
        // 救出キャラは「このプレイで救出した」1始まりのID。通算の収集状況ではなく
        // その記録のプレイで取った顔ぶれを残す（スコアと同じ単位に揃える）
        const rescuedIds = [];
        for (let i = 0; i < state.rescuedChars.length; i++) if (state.rescuedChars[i]) rescuedIds.push(i + 1);
        const record = {
          nickname,
          xid,
          score: Math.floor(state.score),
          created: Date.now(),
          device: isMobileDevice ? "モバイル" : "PC",
          rescued: rescuedIds.join(",")
        };
        if (!GAS_URL) {
          rankSubmitStatus.textContent = "ランキング機能が未設定です（GAS_URL 未設定）";
          rankSubmitBtn.disabled = false;
          return;
        }
        fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "add", record }) })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              rankSubmitStatus.textContent = "登録しました！";
              hideScoreRegisterForm();
              loadLeaderboard();
            } else {
              rankSubmitStatus.textContent = "登録に失敗しました: " + (d.error || "");
              updateSubmitAvailability();
            }
          })
          .catch((e) => {
            rankSubmitStatus.textContent = "通信エラー: " + e.message;
            updateSubmitAvailability();
          });
      });
    }
    const touchPad = document.getElementById("touchPad");
    const firePad = document.getElementById("firePad");
    const controlsBottom = document.querySelector(".controls-bottom");
    const touchUp = document.getElementById("touchUp");
    const touchLeft = document.getElementById("touchLeft");
    const touchFire = document.getElementById("touchFire");
    const touchBomb = document.getElementById("touchBomb");
    const touchRight = document.getElementById("touchRight");
    const touchDown = document.getElementById("touchDown");
    const autoFireToggle = document.getElementById("autoFireToggle");
    const muteToggle = document.getElementById("muteToggle");

    // 十字4ボタンでは親指1本で斜め移動しながらXも押せないため、タッチデバイス
    // では既定でバルカンを自動連射し、Xボタンはレーザーのチャージ専用として
    // 空ける。チャージ中/ビーム発射中は自動連射を止め、競合しないようにする
    let autoFireEnabled = isMobileDevice;
    let autoFireTimer = 0;
    const AUTO_FIRE_INTERVAL = 10; // frames (60fpsで約6発/秒)

    // gyro tilt controls: when available, replace the on-screen d-pad with device tilt.
    // baseline is calibrated to however the phone is being held right when the game starts.
    const gyro = {
      supported: false,   // real orientation data has been observed at least once
      listening: false,   // the deviceorientation listener has been attached (permission granted)
      active: false,      // currently driving ship movement (toggle-able)
      calibrated: false,
      baseline: { x: 0, y: 0 },
      deadzoneDeg: 4,     // degrees of tilt ignored around the baseline (dead zone)
      maxDeg: 28,         // degrees of tilt for full deflection
      sensitivity: 0.55,  // scales the analog thrust vs. a full digital key-press, for finer control
      userChoiceMade: false // once the player uses the toggle button, スタート stops auto-switching modes
    };

    // current screen rotation (0/90/180/270) so tilt axes can be remapped to how the phone is actually held
    function getScreenAngle() {
      if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === "number") {
        return window.screen.orientation.angle;
      }
      if (typeof window.orientation === "number") return window.orientation;
      return 0;
    }

    // rotates the device's tilt into screen-relative x (left/right) and y (forward/back)
    //
    // beta/gamma をそのまま軸の入れ替えで使うと、横持ちで画面を立てて構える
    // ＝実際のプレイ姿勢がちょうど gamma の定義域(-90〜90)の端に当たり、
    // オイラー角の特異点(ジンバルロック)に入ってしまう。この姿勢では
    //   ・上下入力が端に張り付いて効かない
    //   ・垂直をわずか1°跨いだだけで beta が180°反転する
    // ため、機体が最大推力で暴走したり勝手に上へ飛んでいく。
    //
    // そこで重力ベクトル(端末座標系から見た世界の鉛直上方向)を求めてから
    // 画面の向きに合わせて回す方式にする。これは特異点を持たず連続で、
    // 通常の傾き範囲では従来と同じ値になるので操作感は変わらない。
    // なお重力の向きは方位(alpha)には依存しないため alpha は不要。
    function computeScreenTilt(beta, gamma) {
      const rad = Math.PI / 180;
      const b = (beta || 0) * rad;
      const g = (gamma || 0) * rad;
      const cB = Math.cos(b), sB = Math.sin(b);
      const cG = Math.cos(g), sG = Math.sin(g);
      // ZXY回転行列の第3行 = 端末座標系で見た鉛直上方向
      const gx = -cB * sG;
      const gy = sB;
      const gz = cB * cG;
      // 端末座標 -> 画面座標（画面の回転角ぶん回す）
      const th = ((((getScreenAngle() % 360) + 360) % 360)) * rad;
      const cT = Math.cos(th), sT = Math.sin(th);
      const sx = gx * cT - gy * sT;
      const sy = gx * sT + gy * cT;
      return {
        // 画面の右側を下げる向きを正にする（右に傾ける=右へ進む）
        x: -Math.asin(Math.max(-1, Math.min(1, sx))) / rad,
        // 画面の上端を起こす向きを正にする（トレイの上に球を乗せた感覚）
        y: Math.atan2(sy, gz) / rad
      };
    }

    // -180..180 をまたいだときに巨大な差分が出ないようにする
    function shortestAngleDelta(a, b) {
      let d = (a - b) % 360;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      return d;
    }

    // maps a tilt offset (in degrees) to a smooth -1..1 analog value, with a dead zone near the baseline
    function normalizeTiltAxis(deltaDeg) {
      const abs = Math.abs(deltaDeg);
      if (abs <= gyro.deadzoneDeg) return 0;
      const t = Math.min(1, (abs - gyro.deadzoneDeg) / (gyro.maxDeg - gyro.deadzoneDeg));
      return (deltaDeg < 0 ? -1 : 1) * t;
    }

    function applyGyroTilt(x, y) {
      if (!gyro.calibrated) {
        gyro.baseline.x = x;
        gyro.baseline.y = y;
        gyro.calibrated = true;
        return;
      }
      state.input.gyroX = normalizeTiltAxis(shortestAngleDelta(x, gyro.baseline.x));
      state.input.gyroY = normalizeTiltAxis(shortestAngleDelta(y, gyro.baseline.y));
    }

    // hides only the four direction buttons (not the whole grid), so the gyro
    // toggle icon in the center cell stays visible/reachable either way
    function setTouchPadVisible(visible) {
      const isTouchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      const display = visible && isTouchDevice ? "" : "none";
      [touchUp, touchLeft, touchRight, touchDown].forEach((btn) => {
        if (btn) btn.style.display = display;
      });
    }

    // Hiding the d-pad must wait for a *real* deviceorientation event — granting
    // permission does not mean the device actually reports tilt data (many Android
    // devices without a gyroscope, or desktop "mobile mode", grant permission
    // instantly but never fire the event). Hiding on activation alone left players
    // with neither the d-pad nor working tilt controls.
    let _gyroFallbackTimer = null;

    function activateGyroControls() {
      gyro.active = true;
      state.input.gyroX = 0;
      state.input.gyroY = 0;
      recalibrateGyro();
      updateGyroToggleLabel();
      if (gyro.supported) {
        // we've already confirmed real tilt data arrives (e.g. re-enabled via the toggle)
        setTouchPadVisible(false);
        updateGyroStatus("ジャイロ操作中：端末を傾けて移動します（現在の向きが基準）");
      } else {
        // keep the d-pad visible until the first real event confirms tilt actually works
        setTouchPadVisible(true);
        updateGyroStatus("ジャイロを確認中...端末を傾けてみてください（反応がなければ十字ボタンをご利用ください）");
        clearTimeout(_gyroFallbackTimer);
        _gyroFallbackTimer = setTimeout(() => {
          if (gyro.active && !gyro.supported) {
            updateGyroStatus("ジャイロが検出できませんでした。十字ボタンで操作してください");
            deactivateGyroControls();
          }
        }, 1500);
      }
    }

    function deactivateGyroControls() {
      clearTimeout(_gyroFallbackTimer);
      gyro.active = false;
      state.input.gyroX = 0;
      state.input.gyroY = 0;
      setTouchPadVisible(true);
      updateGyroStatus("キー/タッチ操作に切り替えました");
      updateGyroToggleLabel();
    }

    function handleOrientation(e) {
      if (e.beta == null || e.gamma == null) return;
      const justConfirmed = !gyro.supported;
      gyro.supported = true;
      if (!gyro.active) return;
      if (justConfirmed) {
        // first real tilt data while active: now it's safe to hide the d-pad
        clearTimeout(_gyroFallbackTimer);
        setTouchPadVisible(false);
        updateGyroStatus("ジャイロ操作中：端末を傾けて移動します（現在の向きが基準）");
      }
      const tilt = computeScreenTilt(e.beta, e.gamma);
      applyGyroTilt(tilt.x, tilt.y);
    }

    function recalibrateGyro() {
      gyro.calibrated = false;
    }

    async function requestGyroPermission() {
      if (typeof window.DeviceOrientationEvent === "undefined") return false;
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          const result = await DeviceOrientationEvent.requestPermission();
          return result === "granted";
        } catch (e) {
          return false;
        }
      }
      return true; // no explicit permission needed (Android, older iOS)
    }

    // requests permission (first time only) and attaches the listener; does not itself toggle control
    async function ensureGyroListening() {
      if (gyro.listening) return true;
      const granted = await requestGyroPermission();
      if (!granted) return false;
      gyro.listening = true;
      window.addEventListener("deviceorientation", handleOrientation);
      // rotating the phone mid-game changes what "neutral" tilt means, so recalibrate on rotation
      window.addEventListener("orientationchange", recalibrateGyro);
      if (window.screen && window.screen.orientation) {
        window.screen.orientation.addEventListener("change", recalibrateGyro);
      }
      return true;
    }

    async function enableGyroIfAvailable() {
      const ok = await ensureGyroListening();
      if (ok) activateGyroControls();
    }

    async function toggleGyroControls() {
      gyro.userChoiceMade = true;
      if (gyro.active) {
        deactivateGyroControls();
        return;
      }
      const ok = await ensureGyroListening();
      if (ok) {
        activateGyroControls();
      } else {
        updateGyroStatus("ジャイロを有効化できませんでした。キー/タッチで操作してください");
      }
    }

    function updateGyroToggleLabel() {
      if (!gyroToggleButton) return;
      // icon-only: 🕹️ = tap to switch to key/touch, 📱 = tap to switch to tilt.
      // スタート初回はジャイロが既定モードで自動的に有効化されるため、ユーザーが
      // まだ切替操作をしていない間(userChoiceMade === false)はジャイロ中と
      // 同じ🕹️を出しておく。実際に有効化される前のスタート画面がいきなり
      // 「タップでジャイロに切替」(📱)を出すのはこの前提と矛盾するため
      const showAsGyroMode = gyro.active || !gyro.userChoiceMade;
      gyroToggleButton.textContent = showAsGyroMode ? "🕹️" : "📱";
      gyroToggleButton.setAttribute(
        "aria-label",
        showAsGyroMode ? "キー/タッチ操作に切り替え" : "傾き操作に切り替え"
      );

    const startButton = document.createElement("button");
    startButton.id = "startButton";
    startButton.type = "button";
    startButton.className = "start hud-start";
    startButton.textContent = "スタート";
    document.querySelector(".wrap").appendChild(startButton);

    // switches between gyro tilt control and key/touch control, without re-prompting for permission.
    // sits in the empty center cell of the d-pad grid, icon-only so it doesn't crowd the controller.
    const gyroToggleButton = document.createElement("button");
    gyroToggleButton.id = "gyroToggleButton";
    gyroToggleButton.type = "button";
    gyroToggleButton.className = "touch-btn gyro-toggle hold-toggle";
    gyroToggleButton.textContent = "🕹️"; // ジャイロが既定モードのため。実際の表示は updateGyroToggleLabel() が上書きする
    gyroToggleButton.setAttribute("aria-label", "傾き操作とキー/タッチ操作を切り替え");
    gyroToggleButton.style.display = "none"; // only shown once we know the device might support it
    touchPad.appendChild(gyroToggleButton);

    // pilot portrait sprite sheet: 5 expressions (①通常 ②被弾 ③怒り ④苦痛 ⑤決意), drawn onto the game canvas
    const pilotImg = new Image();
    pilotImg.src = "image01.png";
    // source slots within the sheet (row1: 3 across, row2: 2 across)
    const PILOT_SLOTS = [
      { x: 0, y: 0, w: 557, h: 470 },     // ① 通常(冷静)
      { x: 557, y: 0, w: 557, h: 470 },   // ② 被弾(衝撃)
      { x: 1114, y: 0, w: 558, h: 470 },  // ③ 怒り(戦闘モード)
      { x: 0, y: 471, w: 836, h: 470 },   // ④ 苦痛(ダメージ大)
      { x: 836, y: 471, w: 836, h: 470 }  // ⑤ 決意(集中・反撃準備)
    ];
    // center-crop each slot to a 4:3 landscape rect so all 5 frames display consistently
    const PILOT_ASPECT = 4 / 3;
    const PILOT_CROPS = PILOT_SLOTS.map((s) => {
      const slotAspect = s.w / s.h;
      if (slotAspect > PILOT_ASPECT) {
        const w = s.h * PILOT_ASPECT;
        return { x: s.x + (s.w - w) / 2, y: s.y, w, h: s.h };
      }
      const h = s.w / PILOT_ASPECT;
      return { x: s.x, y: s.y + (s.h - h) / 2, w: s.w, h };
    });

    // victory illustration shown on the CLEAR screen
    const clearImg = new Image();
    clearImg.src = "image02png.png";

    // title illustration shown on the start screen, before the player presses スタート
    const titleImg = new Image();
    titleImg.src = "image01.jpg";

    // HP recovery item sprite, drawn as-is (no recoloring/redrawing)
    const hpItemImg = new Image();
    hpItemImg.src = "noundry-studio-glasses.PNG";

    // --- CNP 救出対象 ---
    // 洞窟内に浮遊している仲間。触れると救出でスコア+HP。
    //
    // 絵は assets/cnp/cnp01.png 〜 cnp11.png を置けばそのまま反映される。
    // 未配置の間は各キャラの色でシルエットのプレースホルダを描くので、
    // 画像が揃う前でも当たり判定・浮遊・救出演出はすべて動く。
    // ファイル名を正式なキャラ名に変えたい場合は id と label を書き換える。
    const CNP_RESCUE = {
      size: 60,          // 描画サイズ(px四方)
      radius: 20,        // 当たり判定
      spawnChance: 0.0011
    };

    // 画面上段に並べる額縁ロスター。左のSCORE(〜x230)、右のHPバー(x753〜)、
    // 下のキャプション枠(y60〜)のいずれにも触れない寸法にしてある
    const CNP_ROSTER = {
      slot: 36,          // 額1枚の一辺
      gap: 4,
      y: 10,
      flash: 45          // 救出した瞬間に額が光るフレーム数
    };

    // レア度。得点だけ変えて出現率を据え置くと「高得点キャラを狙う」動機が
    // 生まれないので、点が高いものほど weight を下げて出にくくしている。
    // rank は見た目のピップ数にも使う（プレイヤーが遠目に価値を判断できる）
    const CNP_TIERS = [
      { rank: 1, score: 100,  heal: 4,  weight: 26 },
      { rank: 2, score: 200,  heal: 6,  weight: 16 },
      { rank: 3, score: 400,  heal: 8,  weight: 9 },
      { rank: 4, score: 800,  heal: 10, weight: 4 },
      { rank: 5, score: 1500, heal: 14, weight: 1 }
    ];

    // 11体ぶんのスロット。hue はプレースホルダとオーラの色、tier は CNP_TIERS の添字。
    // どのキャラを何点にするかはここの tier を差し替えるだけで変えられる
    const cnpChars = [
      { hue: 196, tier: 0 },
      { hue: 150, tier: 0 },
      { hue: 46,  tier: 0 },
      { hue: 24,  tier: 0 },
      { hue: 220, tier: 1 },
      { hue: 92,  tier: 1 },
      { hue: 322, tier: 1 },
      { hue: 262, tier: 2 },
      { hue: 174, tier: 2 },
      { hue: 292, tier: 3 },
      { hue: 352, tier: 4 }
    ].map((def, i) => {
      const id = "cnp" + String(i + 1).padStart(2, "0");
      const ch = { id, index: i, label: id.toUpperCase(), hue: def.hue, tier: CNP_TIERS[def.tier], img: new Image(), ready: false };
      // 画像が無い場合は onerror が飛ぶだけで、ready:false のままプレースホルダに落ちる
      ch.img.onload = () => { ch.ready = ch.img.naturalWidth > 0; };
      ch.img.onerror = () => { ch.ready = false; };
      ch.img.src = "assets/cnp/" + id + ".png";
      return ch;
    });

    // 未収集のキャラを優遇する倍率。レア度の重みをそのまま使うと最上位が0.57%で、
    // 同じキャラばかり出て収集が進まない。5倍優遇でも「レアほど出にくい」関係
    // 自体は崩れない
    const CNP_UNCOLLECTED_BOOST = 5;

    function cnpWeightOf(ch) {
      return ch.tier.weight * (state.collected[ch.index] ? 1 : CNP_UNCOLLECTED_BOOST);
    }

    function pickCnpChar() {
      let total = 0;
      for (const ch of cnpChars) total += cnpWeightOf(ch);
      let r = Math.random() * total;
      for (const ch of cnpChars) {
        r -= cnpWeightOf(ch);
        if (r <= 0) return ch;
      }
      return cnpChars[0];
    }

    const state = {
      running: true,
      // becomes true once the player presses スタート; gates update() so nothing moves before that
      started: false,
      score: 0,
      speed: 2.6,
      maxSpeed: 6.2,
      bullets: [],
      bombs: [],
      bases: [],
      explosions: [],
      scrollSpeed: 2.6,
      bonusText: "",
      bonusTimer: 0,
      columns: [],
      stars: [],
      frame: 0,
      displayScore: 0,
      ship: {
        x: 130,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        radius: 11,
        hp: 100,
        contactFrames: 0
      },
      hpItems: [],
      // single mega HP per stage
      megaHp: null,
      megaHpSpawned: false,
      // CNP 救出対象（浮遊する仲間）と、通しでの救出数
      rescues: [],
      rescuedCount: 0,
      // このプレイで救出した11体。リスタートで消える（ランキング登録にも使う）
      rescuedChars: new Array(cnpChars.length).fill(false),
      rescueFlash: new Array(cnpChars.length).fill(0),
      // 収集状況。制覇の判定に使う。resetGame() でリスタートのたびに0/11へ
      // 戻す(1プレイ完結の仕様)。保存もしていないのでページを離れても残らない
      collected: new Array(cnpChars.length).fill(false),
      // up/down/left/right: digital (keyboard/touch). gyroX/gyroY: analog -1..1 (device tilt)
      input: { up: false, down: false, left: false, right: false, gyroX: 0, gyroY: 0 },
      effects: {
        slowTimer: 0,
        wideTimer: 0
      }
      ,
      // stage system
      stage: 1,
      stageTimer: 0, // frames elapsed in current stage
      stageDuration: 60, // seconds per stage
      caption: "",
      captionTimer: 0, // frames to show caption
      pendingStageAdvance: false
      ,
      gameOver: false
      ,
      goalHold: { active: false, frames: 0 },
      // stage intro: phases: 'countdown' -> 'narrow'
      stageIntro: { active: false, frames: 0, total: 0, startGap: 0, phase: null },
      // arena bullets during intro
      // spawnInterval: larger => fewer waves (frames)
      arena: { bullets: [], spawnTimer: 0, spawnInterval: 60 },
      // laser beam: hold X for 3s to charge, then fire
      laser: { charging: false, chargeFrames: 0, chargeDuration: 180, beam: null },
      // part 3: vertical fall through the floor after the arena chamber
      fall: {
        active: false,
        timer: 0,
        duration: 30 * 60,
        rows: [],
        // intro: bullets stop, ship rotates 90° while easing downward into the shaft
        introActive: false,
        introTimer: 0,
        introDuration: 90,
        introStartY: 0,
        shipAngle: 0,
        // landing: auto-fly to the floor once the descent timer ends, then CLEAR
        landing: { active: false, timer: 0, duration: 90, progress: 0 }
      },
      cleared: false,
      // pilot portrait: brief "被弾" flash timer shown right after taking damage
      portrait: { hitTimer: 0 },
      // big ship-explosion animation played before the GAME OVER telop appears
      dying: { active: false, timer: 0, duration: 96 }
    };

    const tunnel = {
      center: canvas.height / 2,
      centerVel: 0,
      gap: 200,
      minGap: 120,
      maxGap: 260,
      roughness: 0.42,
      baseSpawnChance: 0.0014
    };

    const fallTunnel = {
      center: canvas.width / 2,
      centerVel: 0,
      gap: 260,
      minGap: 156, // 120 * 1.3 — wider shaft, lower difficulty
      maxGap: 338, // 260 * 1.3
      roughness: 0.42
    };

    const baseColors = ["red", "blue", "yellow"];
    const baseStyles = {
      red: { fill: "#cf3946", edge: "#ff8f95" },
      blue: { fill: "#2e67c9", edge: "#89b5ff" },
      yellow: { fill: "#c89c26", edge: "#ffdf85" }
    };

    for (let i = 0; i < 160; i++) {
      state.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: 0.4 + Math.random() * 0.9
      });
    }

    function seedColumns() {
      state.columns.length = 0;
      let localCenter = tunnel.center;
      for (let x = 0; x < canvas.width; x++) {
        state.columns.push(makeColumn(localCenter, tunnel.gap));
      }
    }

    function makeColumn(center, gap) {
      const half = gap * 0.5;
      return {
        top: Math.max(20, center - half),
        bottom: Math.min(canvas.height - 20, center + half)
      };
    }

    // --- part 3: vertical fall shaft (rows indexed by y, walls on left/right) ---
    function seedFallRows() {
      state.fall.rows.length = 0;
      for (let y = 0; y < canvas.height; y++) {
        state.fall.rows.push(makeFallRow(fallTunnel.center, fallTunnel.gap));
      }
    }

    function makeFallRow(center, gap) {
      const half = gap * 0.5;
      return {
        left: Math.max(20, center - half),
        right: Math.min(canvas.width - 20, center + half)
      };
    }

    function updateFallTunnel() {
      const drift = (Math.random() - 0.5) * fallTunnel.roughness;
      fallTunnel.centerVel += drift;
      fallTunnel.centerVel *= 0.96;
      fallTunnel.center += fallTunnel.centerVel;
      fallTunnel.center = Math.max(90, Math.min(canvas.width - 90, fallTunnel.center));

      const wave = Math.sin(state.frame * 0.012) * 22;
      const gapTarget = 247 + wave; // 190 * 1.3 — wider, lower difficulty
      fallTunnel.gap += (gapTarget - fallTunnel.gap) * 0.03;
      fallTunnel.gap = Math.max(fallTunnel.minGap, Math.min(fallTunnel.maxGap, fallTunnel.gap));
    }

    function updateFallRows() {
      const step = state.scrollSpeed;
      for (let i = 0; i < step; i++) {
        state.fall.rows.shift();
        updateFallTunnel();
        state.fall.rows.push(makeFallRow(fallTunnel.center, fallTunnel.gap));
      }
    }

    // returns penetration amount in pixels for the fall shaft (0 if no collision)
    function getFallPenetration() {
      const y = Math.floor(state.ship.y);
      const row = state.fall.rows[y];
      if (!row) return 0;
      if (state.ship.x - state.ship.radius < row.left) {
        return row.left - (state.ship.x - state.ship.radius);
      }
      if (state.ship.x + state.ship.radius > row.right) {
        return (state.ship.x + state.ship.radius) - row.right;
      }
      return 0;
    }

    function beginFall() {
      state.fall.active = true;
      state.fall.timer = 0;
      // intro: bullets already stopped, ship rotates 90° while it keeps easing downward —
      // no screen wipe, so it reads as a continuous descent rather than a scene cut
      state.fall.introActive = true;
      state.fall.introTimer = 0;
      state.fall.introStartY = state.ship.y;
      state.fall.shipAngle = 0;
      fallTunnel.center = canvas.width / 2;
      fallTunnel.centerVel = 0;
      fallTunnel.gap = 260;
      seedFallRows();
      state.ship.x = canvas.width / 2;
      state.ship.vx = 0;
      state.ship.vy = 0;
      state.bullets.length = 0;
      state.bombs.length = 0;
      state.arena.bullets.length = 0;
      state.arena.spawnTimer = 0;
      state.stageIntro.active = false;
      state.hpItems.length = 0;

    function resetGame() {

      state.score = 0;
      state.speed = 2.6;
      autoFireTimer = 0;
      scoreSubmitted = false;
      hideScoreRegisterForm();
      state.frame = 0;

      state.ship.vx = 0;
      state.ship.vy = 0;
      state.bullets.length = 0;
      state.bombs.length = 0;
      state.bases.length = 0;
      state.explosions.length = 0;
      state.bonusText = "";
      state.bonusTimer = 0;
      state.effects.slowTimer = 0;
      state.effects.wideTimer = 0;
      state.ship.hp = 100;
      state.ship.contactFrames = 0;
      // reset stage
      state.stage = 1;
      state.stageTimer = 0;
      state.caption = "";
      state.captionTimer = 0;
      state.pendingStageAdvance = false;
      state.gameOver = false;
      state.megaHp = null;
      state.megaHpSpawned = false;
      state.rescues.length = 0;
      state.rescuedCount = 0;
      state.rescuedChars.fill(false);
      state.rescueFlash.fill(0);
      // 通算の収集状況(state.collected)も再スタートのたびに0/11へ戻す。
      // 以前は意図的に持ち越す仕様だった(1プレイ平均5.2種類しか集まらず
      // 11/11制覇が統計的にほぼ不可能だったため)が、今回それより
      // 毎回リセットする挙動を優先する方針に変更した
      state.collected.fill(false);
      state.stageIntro = { active: false, frames: 0, total: 0, startGap: 0 };
      state.arena.bullets.length = 0;
      state.arena.spawnTimer = 0;
      state.displayScore = 0;
      state.laser.charging = false;
      state.laser.chargeFrames = 0;
      state.laser.beam = null;
      state.fall.active = false;
      state.fall.timer = 0;
      state.fall.rows.length = 0;
      state.fall.introActive = false;
      state.fall.introTimer = 0;
      state.fall.introStartY = 0;
      state.fall.shipAngle = 0;
      state.fall.landing.active = false;
      state.fall.landing.timer = 0;
      state.fall.landing.progress = 0;
      state.cleared = false;
      state.portrait.hitTimer = 0;
      state.dying.active = false;
      state.dying.timer = 0;
      state.input.gyroX = 0;
      state.input.gyroY = 0;
      // ここが抜けていると、パート2(バルカン回避)中に力尽きた直後の再スタートが
      // ステージ1のトンネルへ戻らず、古い goalHold 状態のまま再開してしまう
      state.goalHold.active = false;
      state.goalHold.frames = 0;

      tunnel.center = canvas.height / 2;
      tunnel.centerVel = 0;
      tunnel.gap = 200;
      seedColumns();
    }

    function startGame() {
      resetGame();
      state.started = true;
      updateGyroStatus("開始しました。右下コントローラーで操作できます");
      // begin stage with wide intro
      beginStage();
    }

    function updateGyroStatus(message) {
      gyroStatus.textContent = message;
    }

    // ── 効果音 ────────────────────────────────────────────────────────────
    // 音声ファイルは持たず、Web Audio で矩形波とノイズを合成する。80年代
    // アーケードのチップチューンそのものの音になり、配信容量もライセンスの
    // 制約も増えない。音色は下の数値を変えるだけで調整できる。
    //
    // 演出は3階層（頻度と強度は逆相関。全部を鳴らすと何も特別でなくなる）:
    //   弱 毎秒        バルカン        極小音・ピッチを散らす
    //   中 ときどき    被弾/取得/開始   中音量
    //   強 まれ        レーザー/終了    専用の音
    const SFX = {
      ctx: null,
      master: null,
      muted: false,
      _noiseBuf: null,

      // AudioContext はユーザー操作を経ないと鳴らせない(特にiOS)。
      // スタートボタンのタップから呼んで起こす
      unlock() {
        if (!SFX.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          SFX.ctx = new AC();
          SFX.master = SFX.ctx.createGain();
          SFX.master.gain.value = SFX.muted ? 0 : 0.5;
          SFX.master.connect(SFX.ctx.destination);
        }
        if (SFX.ctx.state === "suspended") SFX.ctx.resume().catch(() => {});
      },

      setMuted(m) {
        SFX.muted = m;
        if (SFX.master) SFX.master.gain.value = m ? 0 : 0.5;
      },

      // 単発のトーン。type は square/sawtooth/triangle など
      tone({ freq = 440, to = null, dur = 0.12, type = "square", gain = 0.2, delay = 0 }) {
        if (!SFX.ctx || SFX.muted) return;
        const t0 = SFX.ctx.currentTime + delay;
        const osc = SFX.ctx.createOscillator();
        const g = SFX.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (to !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, to), t0 + dur);
        // 立ち上がりを一瞬で、減衰を指数で。矩形波の「カチッ」とした質感が出る
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(gain, t0 + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g).connect(SFX.master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      },

      // 爆発・ヒット用のホワイトノイズ。バッファは一度だけ作って使い回す
      noise({ dur = 0.2, gain = 0.2, delay = 0, filterFrom = 1800, filterTo = 200 }) {
        if (!SFX.ctx || SFX.muted) return;
        if (!SFX._noiseBuf) {
          const len = SFX.ctx.sampleRate * 1.0;
          const buf = SFX.ctx.createBuffer(1, len, SFX.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          SFX._noiseBuf = buf;
        }
        const t0 = SFX.ctx.currentTime + delay;
        const src = SFX.ctx.createBufferSource();
        src.buffer = SFX._noiseBuf;
        src.loop = true;
        const lp = SFX.ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.setValueAtTime(filterFrom, t0);
        lp.frequency.exponentialRampToValueAtTime(Math.max(40, filterTo), t0 + dur);
        const g = SFX.ctx.createGain();
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(lp).connect(g).connect(SFX.master);
        src.start(t0);
        src.stop(t0 + dur + 0.02);
      },

      // --- 弱: 毎秒鳴る音 -------------------------------------------------
      // 自動連射は10フレーム間隔＝毎秒6発。同じ音を6回/秒鳴らすと必ず耳障りに
      // なるので、音量を絞りピッチを散らして「機関砲の連なり」に溶かす
      vulcan() {
        const f = 820 + Math.random() * 140;
        SFX.tone({ freq: f, to: f * 0.45, dur: 0.05, type: "square", gain: 0.045 });
      },

      // --- 中: ときどき鳴る音 ---------------------------------------------
      hit() {
        SFX.noise({ dur: 0.22, gain: 0.28, filterFrom: 1400, filterTo: 120 });
        SFX.tone({ freq: 180, to: 60, dur: 0.2, type: "square", gain: 0.16 });
      },
      pickup() {
        // 上昇する2音＝取得の定番。短く歯切れよく
        SFX.tone({ freq: 660, dur: 0.07, type: "square", gain: 0.15 });
        SFX.tone({ freq: 990, dur: 0.09, type: "square", gain: 0.15, delay: 0.07 });
      },
      bonus() {
        SFX.tone({ freq: 523, dur: 0.08, type: "square", gain: 0.14 });
        SFX.tone({ freq: 659, dur: 0.08, type: "square", gain: 0.14, delay: 0.08 });
        SFX.tone({ freq: 784, dur: 0.14, type: "square", gain: 0.14, delay: 0.16 });
      },
      bomb() {
        SFX.noise({ dur: 0.3, gain: 0.22, filterFrom: 900, filterTo: 80 });
      },
      stage() {
        SFX.tone({ freq: 392, dur: 0.1, type: "square", gain: 0.16 });
        SFX.tone({ freq: 523, dur: 0.1, type: "square", gain: 0.16, delay: 0.1 });
        SFX.tone({ freq: 784, dur: 0.22, type: "square", gain: 0.16, delay: 0.2 });
      },

      // --- 強: まれにしか鳴らない音 ---------------------------------------
      _chargeNodes: null,
      charge() {
        // 溜め: 低音から上昇していく。3秒のチャージ時間に合わせる。
        // 途中で指を離した場合(＝バルカン)に鳴り続けないよう、停止できる形で持つ
        SFX.stopCharge();
        if (!SFX.ctx || SFX.muted) return;
        const t0 = SFX.ctx.currentTime;
        const dur = 3.0;
        const osc = SFX.ctx.createOscillator();
        const g = SFX.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(110, t0);
        osc.frequency.exponentialRampToValueAtTime(880, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.06, t0 + 0.08);
        osc.connect(g).connect(SFX.master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.05);
        SFX._chargeNodes = { osc, g };
      },
      stopCharge() {
        const n = SFX._chargeNodes;
        SFX._chargeNodes = null;
        if (!n || !SFX.ctx) return;
        try {
          const t = SFX.ctx.currentTime;
          // 急に切るとプツッと鳴るので、ごく短いフェードで落とす
          n.g.gain.cancelScheduledValues(t);
          n.g.gain.setValueAtTime(Math.max(0.0001, n.g.gain.value), t);
          n.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
          n.osc.stop(t + 0.06);
        } catch (e) { /* すでに停止済みなら無視 */ }
      },
      laser() {
        SFX.tone({ freq: 1200, to: 180, dur: 0.5, type: "sawtooth", gain: 0.3 });
        SFX.noise({ dur: 0.4, gain: 0.16, filterFrom: 3000, filterTo: 300 });
      },
      gameOver() {
        // 下降する4音。アーケードの敗北ジングル
        [392, 330, 262, 196].forEach((f, i) =>
          SFX.tone({ freq: f, dur: 0.3, type: "square", gain: 0.2, delay: i * 0.18 })
        );
      },
      clear() {
        // 上昇するファンファーレ。最も稀なので一番派手にする
        [523, 659, 784, 1047].forEach((f, i) =>
          SFX.tone({ freq: f, dur: 0.24, type: "square", gain: 0.2, delay: i * 0.13 })
        );
        SFX.tone({ freq: 1319, dur: 0.5, type: "square", gain: 0.22, delay: 0.52 });
      }
    };

    function grantBaseBonus(color) {
      if (color === "red") {
        state.score += 180;
        state.bonusText = "RED BONUS +180 SCORE";
      } else if (color === "blue") {
        state.effects.slowTimer = 360;
        state.bonusText = "BLUE BONUS TUNNEL SLOW";
      } else {
        state.score += 80;
        state.effects.wideTimer = 360;
        state.bonusText = "YELLOW BONUS WIDE GAP";
      }
      state.bonusTimer = 140;
      SFX.bonus();
    }

    function createExplosion(x, y, color) {
      const particles = [];
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.26;
        const speed = 1.4 + Math.random() * 3.1;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 30 + Math.floor(Math.random() * 12),
          maxLife: 42,
          color
        });
      }
      state.explosions.push(...particles);
    }

    // several large overlapping bursts, staggered slightly so it reads as one big blast
    function createShipDeathExplosion(x, y) {
      const colors = ["red", "yellow", "red", "yellow"];
      colors.forEach((color, i) => {
        const jitterX = x + (Math.random() - 0.5) * 14;
        const jitterY = y + (Math.random() - 0.5) * 14;
        const particles = [];
        const count = 18;
        for (let p = 0; p < count; p++) {
          const angle = (Math.PI * 2 * p) / count + Math.random() * 0.3;
          const speed = 2.2 + Math.random() * 5.5;
          particles.push({
            x: jitterX,
            y: jitterY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 55 + Math.floor(Math.random() * 25) + i * 4,
            maxLife: 90,
            color
          });
        }
        state.explosions.push(...particles);
      });
    }

    // freezes gameplay and plays a big explosion before GAME OVER appears (see the
    // "dying" block near the top of update())
    function triggerShipDeath() {
      if (state.dying.active || state.gameOver) return;
      state.dying.active = true;
      state.dying.timer = 0;
      state.running = false;
      createShipDeathExplosion(state.ship.x, state.ship.y);
    }

    function spawnBaseAtRight() {
      const x = canvas.width + 16;
      const col = state.columns[Math.max(0, canvas.width - 2)];
      if (!col) return;

      const width = 14 + Math.random() * 14;
      const maxProtrusion = Math.max(12, Math.min(28, (col.bottom - col.top) * 0.42));
      const protrusion = 12 + Math.random() * (maxProtrusion - 12);
      const side = Math.random() < 0.5 ? "top" : "bottom";
      const color = baseColors[(Math.random() * baseColors.length) | 0];

      if (side === "top") {
        state.bases.push({ x, y: col.top, w: width, h: protrusion, side, color });
      } else {
        state.bases.push({ x, y: col.bottom - protrusion, w: width, h: protrusion, side, color });
      }
    }

    function shiftBases(step) {
      for (let i = 0; i < step; i++) {
        for (const base of state.bases) {
          base.x -= 1;
        }
        if (Math.random() < tunnel.baseSpawnChance) {
          spawnBaseAtRight();
        }
      }
      state.bases = state.bases.filter((b) => b.x + b.w > -24);
    }

    function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
      const nearestX = Math.max(rx, Math.min(cx, rx + rw));
      const nearestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nearestX;
      const dy = cy - nearestY;
      return dx * dx + dy * dy <= cr * cr;
    }

    function fireVulcan() {
      if (!state.running) return;
      const shipSpeed = Math.max(1, Math.hypot(state.ship.vx, state.ship.vy));
      const bulletSpeed = shipSpeed * 10;
      state.bullets.push({
        x: state.ship.x + state.ship.radius + 6,
        y: state.ship.y,
        vx: bulletSpeed,
        vy: state.ship.vy * 0.12,
        radius: 3
      });
      SFX.vulcan();
    }

    function updateTunnel() {
      const drift = (Math.random() - 0.5) * tunnel.roughness;
      tunnel.centerVel += drift;
      tunnel.centerVel *= 0.96;
      tunnel.center += tunnel.centerVel;
      tunnel.center = Math.max(90, Math.min(canvas.height - 90, tunnel.center));

      const wave = Math.sin(state.frame * 0.012) * 22;
      const wideBonus = state.effects.wideTimer > 0 ? 24 : 0;
      const gapTarget = 190 + wave - Math.min(38, state.speed * 7) + wideBonus;
      tunnel.gap += (gapTarget - tunnel.gap) * 0.03;
      tunnel.gap = Math.max(tunnel.minGap, Math.min(tunnel.maxGap, tunnel.gap));
    }

    function updateColumns() {
      const step = state.scrollSpeed;
      for (let i = 0; i < step; i++) {
        state.columns.shift();
        updateTunnel();
        state.columns.push(makeColumn(tunnel.center, tunnel.gap));
      }
      shiftBases(step);
    }

    function updateShip() {
      const verticalThrust = 0.34;
      const horizontalThrust = 0.28;
      const drag = 0.985;
      if (state.input.up) state.ship.vy -= verticalThrust;
      if (state.input.down) state.ship.vy += verticalThrust;
      if (state.input.left) state.ship.vx -= horizontalThrust;
      if (state.input.right) state.ship.vx += horizontalThrust;
      // gyro tilt: proportional (analog) thrust instead of full digital thrust, for finer control
      state.ship.vx += horizontalThrust * gyro.sensitivity * state.input.gyroX;
      state.ship.vy += verticalThrust * gyro.sensitivity * state.input.gyroY;
      state.ship.vx *= drag;
      state.ship.vy *= drag;
      state.ship.x += state.ship.vx;
      state.ship.y += state.ship.vy;
      state.ship.x = Math.max(state.ship.radius + 8, Math.min(canvas.width - state.ship.radius - 8, state.ship.x));
      state.ship.y = Math.max(state.ship.radius, Math.min(canvas.height - state.ship.radius, state.ship.y));
    }

    // returns penetration amount in pixels (0 if no collision)
    function getCollisionPenetration() {
      const x = Math.floor(state.ship.x);
      const column = state.columns[x];
      if (!column) return 0;
      if (state.ship.y - state.ship.radius < column.top) {
        return column.top - (state.ship.y - state.ship.radius);
      }
      if (state.ship.y + state.ship.radius > column.bottom) {
        return (state.ship.y + state.ship.radius) - column.bottom;
      }
      return 0;
    }

    function updateStars() {
      for (const s of state.stars) {
        s.x -= state.scrollSpeed * s.z * 0.4;
        if (s.x < -2) {
          s.x = canvas.width + Math.random() * 16;
          s.y = Math.random() * canvas.height;
        }
      }
    }

    function updateBullets() {
      for (const b of state.bullets) {
        b.x += b.vx;
        b.y += b.vy;
      }

      const hitBases = new Set();
      const hitBullets = new Set();
      for (let i = 0; i < state.bullets.length; i++) {
        const b = state.bullets[i];
        for (let j = 0; j < state.bases.length; j++) {
          if (hitBases.has(j)) continue;
          const base = state.bases[j];
          if (circleRectHit(b.x, b.y, b.radius, base.x, base.y, base.w, base.h)) {
            hitBases.add(j);
            hitBullets.add(i);
            grantBaseBonus(base.color);
            createExplosion(base.x + base.w * 0.5, base.y + base.h * 0.5, base.color);
            break;
          }
        }
      }

      if (hitBases.size > 0) {
        state.bases = state.bases.filter((_, idx) => !hitBases.has(idx));
      }
      if (hitBullets.size > 0) {
        state.bullets = state.bullets.filter((_, idx) => !hitBullets.has(idx));
      }

      state.bullets = state.bullets.filter(
        (b) => b.x < canvas.width + 40 && b.y > -20 && b.y < canvas.height + 20
      );
    }

    function dropBomb() {
      if (!state.running) return;
      const initialVx = state.ship.vx * 0.6 + 1.2;
      state.bombs.push({
        x: state.ship.x - 6,
        y: state.ship.y + 6,
        vx: initialVx,
        vy: 0,
        radius: 6
      });
      SFX.bomb();
    }

    function updateBombs() {
      const gravity = 0.42;
      const toRemove = new Set();
      for (let i = 0; i < state.bombs.length; i++) {
        const b = state.bombs[i];
        b.vy += gravity;
        b.x += b.vx;
        b.y += b.vy;

        // hit base?
        for (let j = 0; j < state.bases.length; j++) {
          const base = state.bases[j];
          if (circleRectHit(b.x, b.y, b.radius, base.x, base.y, base.w, base.h)) {
            // explode and apply bonuses to affected bases within blast radius
            const blastR = 36;
            createExplosion(b.x, b.y, base.color);
            const removed = [];
            for (let k = 0; k < state.bases.length; k++) {
              const bb = state.bases[k];
              if (circleRectHit(b.x, b.y, blastR, bb.x, bb.y, bb.w, bb.h)) {
                grantBaseBonus(bb.color);
                removed.push(k);
              }
            }
            state.bases = state.bases.filter((_, idx) => !removed.includes(idx));
            toRemove.add(i);
            break;
          }
        }

        // hit floor or ceiling
        if (b.y > canvas.height - 4 || b.y < 4) {
          createExplosion(b.x, Math.max(4, Math.min(canvas.height - 4, b.y)), "red");
          toRemove.add(i);
        }
      }
      if (toRemove.size > 0) {
        state.bombs = state.bombs.filter((_, idx) => !toRemove.has(idx));
      }

      state.bombs = state.bombs.filter((b) => b.x > -60 && b.x < canvas.width + 60 && b.y < canvas.height + 200);
    }

    // --- HP 回復アイテム (ゆらゆら浮遊) ---
    function spawnHpItem() {
      const x = canvas.width + 24;
      // spawn within tunnel gap area near center of current column at right edge
      const col = state.columns[Math.max(0, canvas.width - 2)];
      let baseY = canvas.height / 2;
      if (col) {
        // choose a y between column.top + 16 and column.bottom - 16
        baseY = Math.max(col.top + 16, Math.min(col.bottom - 16, col.top + Math.random() * (col.bottom - col.top - 32)));
      } else {
        baseY = 40 + Math.random() * (canvas.height - 80);
      }
      const phase = Math.random() * Math.PI * 2;
      const item = {
        x,
        baseY,
        radius: 12,
        vx: 0.6 + Math.random() * 0.8,
        phase,
        bobAmp: 6 + Math.random() * 6
      };
      state.hpItems.push(item);
    }

    function updateHpItems() {
      // occasional spawn (不定期)
      const HP_SPAWN_CHANCE = 0.00064; // reduced to ~1/5 the previous rate
      if (Math.random() < HP_SPAWN_CHANCE) spawnHpItem();

      const collected = new Set();
      for (let i = 0; i < state.hpItems.length; i++) {
        const it = state.hpItems[i];
        it.x -= state.scrollSpeed * 0.9 + it.vx;
        // bobbing using global frame so movement is smooth
        it.y = it.baseY + Math.sin(state.frame * 0.06 + it.phase) * it.bobAmp;

        // collision with ship
        const dx = it.x - state.ship.x;
        const dy = it.y - state.ship.y;
        const dist2 = dx * dx + dy * dy;
        const r = it.radius + state.ship.radius;
        if (dist2 <= r * r) {
          collected.add(i);
          // heal
          state.ship.hp = Math.min(100, (state.ship.hp || 0) + 10);
          SFX.pickup();
          state.bonusText = "HP +10";
          state.bonusTimer = 90;
          // small visual feedback
          createExplosion(it.x, it.y, "blue");
        }
      }

      if (collected.size > 0) {
        state.hpItems = state.hpItems.filter((_, idx) => !collected.has(idx));
      }

      // remove offscreen
      state.hpItems = state.hpItems.filter((it) => it.x > -40 && it.y > -40 && it.y < canvas.height + 40);
    }

    function drawHpItems() {
      if (!hpItemImg.complete || !hpItemImg.naturalWidth) return;
      const size = 50; // 40 * 1.25
      // no shadowBlur — cost multiplies per floating item, and this runs every frame
      for (const it of state.hpItems) {
        ctx.drawImage(hpItemImg, it.x - size / 2, it.y - size / 2, size, size);
      }
    }

    // --- CNP 救出対象 (浮遊する仲間) ---
    function spawnRescue() {
      const col = state.columns[Math.max(0, canvas.width - 2)];
      let baseY = canvas.height / 2;
      if (col) {
        baseY = Math.max(col.top + 30, Math.min(col.bottom - 30, col.top + Math.random() * (col.bottom - col.top - 60)));
      } else {
        baseY = 50 + Math.random() * (canvas.height - 100);
      }
      state.rescues.push({
        ch: pickCnpChar(),
        mode: "h",
        x: canvas.width + 40,
        baseX: 0,
        sx: canvas.width + 40,
        baseY,
        y: baseY,
        sy: baseY,
        radius: CNP_RESCUE.radius,
        vx: 0.3 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        // 上下のボビングに横のスウェイを重ねると、ただ流れるのではなく
        // 「その場に浮いているものが流されている」ように見える
        bobAmp: 9 + Math.random() * 7,
        swayAmp: 4 + Math.random() * 4,
        tilt: 0.06 + Math.random() * 0.06
      });
    }

    // パート3(落下)用。縦スクロールなので画面下から湧いて上へ流れる。
    // 横穴と違い左右の壁が近いため、シャフトの幅に収まる範囲にx位置を取る
    function spawnRescueFall() {
      const row = state.fall.rows[canvas.height - 1];
      let baseX = canvas.width / 2;
      if (row) {
        const lo = row.left + 34;
        const hi = row.right - 34;
        baseX = hi > lo ? lo + Math.random() * (hi - lo) : (row.left + row.right) / 2;
      }
      state.rescues.push({
        ch: pickCnpChar(),
        mode: "v",
        x: baseX,
        baseX,
        sx: baseX,
        baseY: 0,
        y: canvas.height + 40,
        sy: canvas.height + 40,
        radius: CNP_RESCUE.radius,
        vx: 0.3 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        bobAmp: 9 + Math.random() * 7,
        // 縦モードでは揺れが壁への接触に直結するので、振幅は控えめにする
        swayAmp: 5 + Math.random() * 4,
        tilt: 0.06 + Math.random() * 0.06
      });
    }

    // fall = パート3(落下)中かどうか。スクロール方向が90度変わる
    function updateRescues(fall) {
      if (Math.random() < CNP_RESCUE.spawnChance) {
        if (fall) spawnRescueFall(); else spawnRescue();
      }

      for (let i = 0; i < state.rescueFlash.length; i++) {
        if (state.rescueFlash[i] > 0) state.rescueFlash[i]--;
      }

      const rescued = new Set();
      for (let i = 0; i < state.rescues.length; i++) {
        const it = state.rescues[i];
        // sx/sy が描画と当たり判定の両方で使う実効座標（揺れ込み）
        if (it.mode === "v") {
          it.y -= state.scrollSpeed * 0.85 + it.vx;
          it.sy = it.y + Math.sin(state.frame * 0.05 + it.phase) * it.bobAmp * 0.4;
          it.sx = it.baseX + Math.cos(state.frame * 0.037 + it.phase) * it.swayAmp;
        } else {
          it.x -= state.scrollSpeed * 0.85 + it.vx;
          it.sy = it.baseY + Math.sin(state.frame * 0.05 + it.phase) * it.bobAmp;
          it.sx = it.x + Math.cos(state.frame * 0.037 + it.phase) * it.swayAmp;
        }

        const dx = it.sx - state.ship.x;
        const dy = it.sy - state.ship.y;
        const dist2 = dx * dx + dy * dy;
        const r = it.radius + state.ship.radius;
        if (dist2 <= r * r) {
          rescued.add(i);
          const tier = it.ch.tier;
          state.score += tier.score;
          state.ship.hp = Math.min(100, (state.ship.hp || 0) + tier.heal);
          state.rescuedCount++;
          state.rescuedChars[it.ch.index] = true;
          state.rescueFlash[it.ch.index] = CNP_ROSTER.flash;
          state.collected[it.ch.index] = true;
          state.bonusText = "RESCUED " + it.ch.label + " +" + tier.score;
          // 高レアほど余韻を長く。取れたことが演出の大きさで分かるようにする
          state.bonusTimer = 120 + tier.rank * 12;
          SFX.bonus();
          createExplosion(it.sx, it.sy, tier.rank >= 4 ? "yellow" : "blue");
          if (tier.rank >= 3) createExplosion(it.sx, it.sy, "yellow");
        }
      }

      if (rescued.size > 0) {
        state.rescues = state.rescues.filter((_, idx) => !rescued.has(idx));
      }
      state.rescues = state.rescues.filter((it) => (it.mode === "v" ? it.y > -80 : it.x > -80));
    }

    // 画像が未配置のスロット用の仮絵。原点はキャラ中心。
    // 差し替え待ちだと一目で分かるよう「?」を入れてある
    // mono を立てると色を落として黒シルエットになる（ロスターの未救出枠用）
    function drawCnpPlaceholder(ch, s, mono) {
      ctx.fillStyle = mono ? "hsl(220,14%,24%)" : `hsl(${ch.hue},70%,62%)`;
      ctx.beginPath();
      ctx.ellipse(0, s * 0.16, s * 0.24, s * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, -s * 0.16, s * 0.23, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s * 0.20, -s * 0.30);
      ctx.lineTo(-s * 0.08, -s * 0.46);
      ctx.lineTo(-s * 0.02, -s * 0.28);
      ctx.closePath();
      ctx.moveTo(s * 0.20, -s * 0.30);
      ctx.lineTo(s * 0.08, -s * 0.46);
      ctx.lineTo(s * 0.02, -s * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = `hsl(${ch.hue},55%,26%)`;
      ctx.fillRect(-s * 0.23, -s * 0.21, s * 0.46, s * 0.09);
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.font = `${Math.round(s * 0.26)}px "Press Start 2P", monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("?", 0, s * 0.18);
    }

    function drawRescues() {
      const s = CNP_RESCUE.size;
      for (const it of state.rescues) {
        const ch = it.ch;
        const rank = ch.tier.rank;
        const pulse = 0.5 + 0.5 * Math.sin(state.frame * 0.07 + it.phase);

        // 背後のオーラ。接地影が置けない洞窟内で「浮いている」ことを読ませる役。
        // 高レアほど広く濃くして、遠目でも価値が分かるようにしている
        const glowR = s * (0.5 + rank * 0.045 + pulse * 0.1);
        const glowA = 0.3 + rank * 0.055;
        const grd = ctx.createRadialGradient(it.sx, it.sy, s * 0.12, it.sx, it.sy, glowR);
        grd.addColorStop(0, `hsla(${ch.hue},95%,72%,${glowA})`);
        grd.addColorStop(0.55, `hsla(${ch.hue},90%,60%,${glowA * 0.45})`);
        grd.addColorStop(1, `hsla(${ch.hue},85%,55%,0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(it.sx, it.sy, glowR, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(it.sx, it.sy);
        ctx.rotate(Math.sin(state.frame * 0.03 + it.phase) * it.tilt);
        if (ch.ready) {
          ctx.drawImage(ch.img, -s / 2, -s / 2, s, s);
        } else {
          drawCnpPlaceholder(ch, s);
        }
        ctx.restore();

        // 救出フィールドの弧。別パスで引く（1パスに繋げると弧同士が線で結ばれる）。
        // rank4以上は逆回転の弧をもう1周足して、最上位だと一目で分かるようにする
        ctx.strokeStyle = `hsla(${ch.hue},95%,70%,${0.35 + pulse * 0.3})`;
        ctx.lineWidth = 2;
        const ringR = s * 0.46;
        const a0 = state.frame * 0.035 + it.phase;
        for (let k = 0; k < 2; k++) {
          ctx.beginPath();
          ctx.arc(it.sx, it.sy, ringR, a0 + Math.PI * k, a0 + Math.PI * k + Math.PI * 0.55);
          ctx.stroke();
        }
        if (rank >= 4) {
          ctx.lineWidth = 1.5;
          const a1 = -state.frame * 0.05 + it.phase;
          for (let k = 0; k < 2; k++) {
            ctx.beginPath();
            ctx.arc(it.sx, it.sy, ringR * 1.2, a1 + Math.PI * k, a1 + Math.PI * k + Math.PI * 0.4);
            ctx.stroke();
          }
        }

        // レア度ピップ。得点表示は救出後にしか出ないので、取る前に価値を
        // 判断できる手掛かりを足元に置く（rankぶんの菱形）
        const pipY = it.sy + s * 0.5;
        const pipGap = 7;
        const pipX = it.sx - ((rank - 1) * pipGap) / 2;
        ctx.fillStyle = `hsla(${ch.hue},95%,${68 + rank * 3}%,0.95)`;
        for (let k = 0; k < rank; k++) {
          const px = pipX + k * pipGap;
          ctx.beginPath();
          ctx.moveTo(px, pipY - 3);
          ctx.lineTo(px + 2.6, pipY);
          ctx.lineTo(px, pipY + 3);
          ctx.lineTo(px - 2.6, pipY);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    // 画面上段の額縁ロスター。収集状況(state.collected)は resetGame() で
    // 毎回0/11に戻る(1プレイ完結の仕様)。
    // このプレイで救出した枠だけを起こして、今どれを取ったのかも同時に読ませる。
    //   未収集         … 黒シルエット + 減光した琥珀の枠
