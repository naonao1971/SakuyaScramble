<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06070C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="咲耶ジャンプバグ" />
  <title>SAKUYA JUMP BUG ─ ⌐◨-◨ CAR</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SAKUYA JUMP BUG ─ ⌐◨-◨ CAR" />
  <meta property="og:description" content="⌐◨-◨カーで跳ねながら城下町・洞窟・天守を抜け、CNP11体を拾ってゴールの鳥居を目指す横スクロールゲーム（プロトタイプ）" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <!-- 本家「咲耶スクランブル」と同じ書体。display=欧文/数字、body=和文 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      /* 本家のトークンをそのまま継ぐ。漆黒・金・マゼンタの3色で世界観を作る */
      --bg: #06070C;
      --panel: #120E1F;
      --panel-ghost: rgba(18, 14, 31, 0.45);
      --ink: #E8ECF5;
      --dim: #7C8BA6;
      --gold: #E8C56A;
      --magenta: #FF2D9B;
      --danger: #FF4D2E;
      --edge-lit: #39445A;
      --edge-lo: #05060A;
      --bevel-up: inset 2px 2px 0 var(--edge-lit), inset -2px -2px 0 var(--edge-lo);
      --bevel-down: inset 2px 2px 0 var(--edge-lo), inset -2px -2px 0 var(--edge-lit);
      --font-display: "Press Start 2P", "DotGothic16", monospace;
      --font-body: "DotGothic16", "Press Start 2P", monospace;
    }
    html, body { overscroll-behavior: none; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px 16px 32px;
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* 16:9 を保ったまま、横幅と高さのどちらにも収まる最大サイズにする */
    .wrap {
      position: relative;
      width: min(100%, 960px, calc((100dvh - 32px) * 16 / 9));
      aspect-ratio: 16 / 9;
      border: 2px solid rgba(232, 197, 106, 0.45);
      box-sizing: content-box;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      touch-action: none;
    }
    /* 右上の小ボタン(ミュート/一時停止)。canvasの上に重ねる */
    .sys {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 6px;
    }
    .sys button, .pad button {
      font-family: var(--font-display);
      color: var(--ink);
      background: var(--panel-ghost);
      border: 0;
      border-radius: 0;
      box-shadow: var(--bevel-up);
      cursor: pointer;
      touch-action: none;
    }
    .sys button { width: 34px; height: 34px; font-size: 14px; }
    .sys button:active, .sys button.on, .pad button.on { box-shadow: var(--bevel-down); background: rgba(255, 45, 155, 0.35); }

    /* タッチ操作。タッチ端末でだけ出す(body.touch)。
       左手=◀▶、右手=ショット/ジャンプ。本家と同じく半透明で下の地形を透かす */
    .pad { display: none; }
    body.touch .pad {
      position: absolute;
      bottom: 8px;
      display: flex;
      gap: 10px;
    }
    .pad.left { left: 8px; }
    .pad.right { right: 8px; align-items: flex-end; }
    .pad button {
      width: clamp(44px, 15vh, 72px);
      height: clamp(44px, 15vh, 72px);
      font-size: clamp(14px, 2.6vw, 20px);
    }
    .pad button.jump {
      width: clamp(54px, 19vh, 88px);
      height: clamp(54px, 19vh, 88px);
      color: var(--magenta);
      font-size: clamp(11px, 1.9vw, 14px);
    }
    .pad button.fire { color: var(--gold); }

    /* スマホ横持ちでは余白を捨てて画面いっぱいに使う */
    body.touch { padding: 0; gap: 0; justify-content: center; }
    body.touch .wrap { width: min(100vw, calc(100dvh * 16 / 9)); border: 0; }
    body.touch .info, body.touch footer { display: none; }

    .share {
      position: absolute;
      left: 50%;
      bottom: 10%;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--ink);
      background: var(--panel);
      border: 0;
      box-shadow: var(--bevel-up), 0 0 0 2px var(--gold);
      padding: 10px 16px;
      cursor: pointer;
    }
    .share[hidden] { display: none; }

    .orient {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: var(--bg);
      color: var(--ink);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 16px;
    }
    .orient .t { font-family: var(--font-display); color: var(--gold); font-size: 16px; margin: 0; }
    .orient .s { font-family: var(--font-display); color: var(--magenta); font-size: 10px; margin: 0; }
    .orient .i { font-size: 40px; }
    @media (orientation: portrait) {
      body.touch .orient { display: flex; }
    }

    .info {
      max-width: 960px;
      width: 100%;
      font-size: 14px;
      line-height: 1.8;
      color: var(--dim);
    }
    .info b { color: var(--ink); font-weight: normal; }
    .info kbd {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--gold);
      border: 1px solid rgba(232, 197, 106, 0.5);
      padding: 1px 5px;
    }
    footer { font-size: 12px; color: var(--dim); text-align: center; }
    footer a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="orient" role="alert">
    <p class="t">SAKUYA JUMP BUG</p>
    <p class="s">- ⌐◨-◨ CAR -</p>
    <div class="i">📱⤾</div>
    <p>横向きにしてね ⌐◨-◨</p>
  </div>

  <div class="wrap" id="wrap">
    <canvas id="game" width="960" height="540" aria-label="咲耶ジャンプバグ ゲーム画面"></canvas>
    <div class="sys">
      <button id="btnPad" type="button" aria-label="タッチ操作ボタンの表示切り替え">🎮</button>
      <button id="btnPause" type="button" aria-label="一時停止">II</button>
      <button id="btnMute" type="button" aria-label="音のオン/オフ">♪</button>
    </div>
    <div class="pad left">
      <button type="button" data-key="left" aria-label="左">◀</button>
      <button type="button" data-key="right" aria-label="右">▶</button>
    </div>
    <div class="pad right">
      <button type="button" class="fire" data-key="fire" aria-label="ショット">SHOT</button>
      <button type="button" class="jump" data-key="jump" aria-label="ジャンプ">JUMP</button>
    </div>
    <button id="btnShare" class="share" type="button" hidden>𝕏 でシェア</button>
  </div>

  <div class="info">
    <b>咲耶ジャンプバグ（プロトタイプ）</b> ─ むかし懐かしの「ジャンプバグ」風。⌐◨-◨カーは地面や屋根に触れるたび勝手に跳ねる。
    <kbd>←</kbd><kbd>→</kbd> 加速/減速　<kbd>SPACE</kbd>/<kbd>↑</kbd>/<kbd>Z</kbd> ジャンプ（押している間は高く跳ぶ）　<kbd>X</kbd> ショット　<kbd>P</kbd> 一時停止　<kbd>M</kbd> 音<br>
    敵は撃つか上から踏むと倒せる。溶岩に落ちる・トゲや敵に当たる・燃料切れでミス。途中の提灯がチェックポイント。
  </div>
  <footer>
    本作は CryptoNinja / CryptoNinja Partners / Nouns の非公式ファンアートです ─ <a href="../">咲耶スクランブルへ</a>
  </footer>

  <script>
    "use strict";
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    // タッチ端末の判定。埋め込み表示(iframe)やブラウザによっては maxTouchPoints が
    // 0 のまま返ることがあるので、メディアクエリと「実際に触れたか」でも拾う。
    // それでも出ないときのために、右上の🎮で手動でも出し入れできる
    const mq = (q) => window.matchMedia && window.matchMedia(q).matches;
    let isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0 || mq("(pointer: coarse)") || mq("(hover: none)");
    function setTouchMode(on) {
      isTouch = on;
      document.body.classList.toggle("touch", on);
      const b = document.getElementById("btnPad");
      if (b) b.classList.toggle("on", on);
    }
    setTouchMode(isTouch);
    window.addEventListener("touchstart", () => { if (!isTouch) setTouchMode(true); }, { passive: true, capture: true });
    window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !isTouch) setTouchMode(true); }, { capture: true });
    const portraitMQ = window.matchMedia("(orientation: portrait)");

    // ------------------------------------------------------------------
    // パレット(本家 RETRO を継承)。ここ以外で色を増やしすぎない
    // ------------------------------------------------------------------
    const C = {
      ink: "#E8ECF5",
      dim: "#7C8BA6",
      gold: "#E8C56A",
      magenta: "#FF2D9B",
      danger: "#FF4D2E",
      cave: "#452066",
      caveEdge: "#B44BE8",
      nounRed: "#E8332F",     // ⌐◨-◨ のフレーム色。Nouns の赤ノグルズ
      vermilion: "#E0452B",   // 鳥居の朱
      font(px) { return `${px}px "Press Start 2P", "DotGothic16", monospace`; },
      jfont(px) { return `${px}px "DotGothic16", "Press Start 2P", monospace`; }
    };

    // ------------------------------------------------------------------
    // 物理パラメータ。ジャンプバグの「常に跳ね続ける車」を作る要
    //  - 着地すると自動で BOUNCE_LOW で跳ね返る
    //  - ジャンプを押している間は上昇中の重力が軽くなり、長押しほど高く跳ぶ
    //    (低: 約75px / 高: 約230px。建物は最大200pxなので長押しで必ず越えられる)
    // ------------------------------------------------------------------
    const PHYS = {
      gravity: 0.55,
      gravityHeld: 0.24,
      bounceLow: 9.0,
      bounceHigh: 10.5,
      maxFall: 11,
      maxSpeed: 5.4,
      maxBack: 3.4,
      accel: 0.22,
      friction: 0.06
    };
    const GROUND_Y = 480;           // 地面の上端
    const CAR_W = 50, CAR_H = 30;   // 当たり判定。見た目の尾翼(⌐)は判定外にはみ出させて易しくする
    const FUEL_DRAIN = 0.028;       // 満タン(100)で約60秒
    const START_LIVES = 3;

    const ZONES = [
      { x: 0,     key: "city",   label: "ZONE 1", jp: "城下町",     en: "CASTLE TOWN",   shift: 0,  wave: "square" },
      { x: 3600,  key: "cave",   label: "ZONE 2", jp: "忍びの洞窟", en: "NINJA CAVE",    shift: -5, wave: "triangle" },
      { x: 7400,  key: "castle", label: "ZONE 3", jp: "天守",       en: "SHOGUN CASTLE", shift: 2,  wave: "square" },
      { x: 11200, key: "goal",   label: "FINAL",  jp: "鳥居の丘",   en: "TORII HILL",    shift: 5,  wave: "square" }
    ];
    function zoneIndexAt(x) {
      let i = 0;
      for (let k = 0; k < ZONES.length; k++) if (x >= ZONES[k].x) i = k;
      return i;
    }

    // ------------------------------------------------------------------
    // CNP 11体(本家 cnpChars と同じ id / 名前 / レア度)
    // コースの奥・難所ほど高ランクのキャラを置く
    // ------------------------------------------------------------------
    const TIERS = [
      { rank: 1, score: 100 },
      { rank: 2, score: 200 },
      { rank: 3, score: 400 },
      { rank: 4, score: 800 },
      { rank: 5, score: 1500 }
    ];
    const CNP = [
      { hue: 196, tier: 0, id: "cnp_sotai_leelee",   label: "リーリー" },
      { hue: 150, tier: 0, id: "cnp_sotai_mitama",   label: "ミタマ" },
      { hue: 46,  tier: 0, id: "cnp_sotai_narukami", label: "ナルカミ" },
      { hue: 24,  tier: 0, id: "cnp_sotai_orochi",   label: "オロチ" },
      { hue: 220, tier: 1, id: "cnp_sotai_luna",     label: "ルナ" },
      { hue: 92,  tier: 1, id: "cnp_sotai_yama",     label: "ヤマ" },
      { hue: 322, tier: 1, id: "cnp_sotai_makami",   label: "マカミ" },
      { hue: 262, tier: 2, id: "cnp_sotai_towa",     label: "トワ" },
      { hue: 174, tier: 2, id: "cnp_sotai_setsuna",  label: "セツナ" },
      { hue: 292, tier: 3, id: "cnp_sotai_ema",      label: "エマ" },
      { hue: 352, tier: 4, id: "cnp_sotai_taruto",   label: "タルト" }
    ].map((d, i) => {
      const ch = { ...d, index: i, tierDef: TIERS[d.tier], img: new Image(), ready: false, sil: null };
      ch.img.onload = () => {
        if (!ch.img.naturalWidth) return;
        ch.ready = true;
        // 未救出スロット用の黒シルエットを一度だけ作る
        const s = document.createElement("canvas");
        s.width = s.height = 64;
        const g = s.getContext("2d");
        g.drawImage(ch.img, 0, 0, 64, 64);
        g.globalCompositeOperation = "source-in";
        g.fillStyle = "#000";
        g.fillRect(0, 0, 64, 64);
        ch.sil = s;
      };
      ch.img.src = "../assets/cnp/" + ch.id + ".png";
      return ch;
    });

    // 咲耶の表情シート(本家 image01.png)。①通常 ②被弾 ③怒り ④苦痛 ⑤決意
    const pilotImg = new Image();
    pilotImg.src = "../image01.png";
    const PILOT_SLOTS = [
      { x: 0, y: 0, w: 557, h: 470 },
      { x: 557, y: 0, w: 557, h: 470 },
      { x: 1114, y: 0, w: 558, h: 470 },
      { x: 0, y: 471, w: 836, h: 470 },
      { x: 836, y: 471, w: 836, h: 470 }
    ].map((s) => {
      // 元絵は宇宙船のコックピット全景。88px の小窓では機体が読めずノイズになるので、
      // 顔のまわりだけを 4:3 で切り出す(顔はどのコマもほぼ横中央・上から約255px)
      const w = 230, h = 172;
      return { x: s.x + s.w / 2 - w / 2, y: s.y + 255 - h / 2, w, h };
    });

    // ------------------------------------------------------------------
    // コース生成。乱数は固定シードなので毎回同じコースになる(レトロゲームの
    // 「覚えて上達する」手触りを残す)。シードを変えれば別コースになる
    // ------------------------------------------------------------------
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function hash(i) {
      const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
      return s - Math.floor(s);
    }

    function buildLevel() {
      const L = { solids: [], spikes: [], lavas: [], coins: [], fuels: [], cnps: [], enemies: [], checkpoints: [], goalX: 0, end: 0 };
      const rng = mulberry32(20260923);
      const R = (a, b) => a + rng() * (b - a);
      const RI = (a, b, step = 10) => Math.round(R(a, b) / step) * step;
      const solid = (x, y, w, h, kind, zone) => { const s = { x, y, w, h, kind, zone }; L.solids.push(s); return s; };
      const ground = (x, w, zone) => solid(x, GROUND_Y, w, H - GROUND_Y + 40, "ground", zone);
      const lava = (x, w) => L.lavas.push({ x, w });
      const coin = (x, y) => L.coins.push({ x, y, got: false });
      const coinArc = (cx, y, n, gap, lift) => {
        for (let i = 0; i < n; i++) {
          const t = n === 1 ? 0 : i / (n - 1) * 2 - 1;
          coin(cx + (i - (n - 1) / 2) * gap, y - lift * (1 - t * t));
        }
      };
      const enemy = (type, x, y, extra = {}) => L.enemies.push({ type, sx: x, sy: y, ...extra });
      const cnp = (idx, x, y) => { L.cnps[idx] = { idx, x, y, got: false }; };
      const surface = (x) => {
        let top = H + 100;
        for (const s of L.solids) if (s.kind !== "ceiling" && x >= s.x && x <= s.x + s.w && s.y < top) top = s.y;
        return top;
      };

      // --- ZONE 1: 城下町 --------------------------------------------------
      ground(0, 3600, "city");
      const houses = [];
      let x = 560;
      while (x < 3300) {
        const p = x / 3300;
        const w = RI(110, 190);
        const h = RI(70, 110 + p * 90);
        houses.push(solid(x, GROUND_Y - h, w, h, "house", "city"));
        coinArc(x + w / 2, GROUND_Y - h - 36, 3, 26, 14);
        const gap = RI(170, 270);
        if (gap > 220 && rng() < 0.55) enemy("hopper", x + w + gap / 2 - 15, GROUND_Y);
        x += w + gap;
      }
      for (let cx = 900; cx < 3400; cx += RI(420, 620)) enemy("crow", cx, RI(130, 290));
      cnp(0, 400, GROUND_Y - 110);
      const firstHalf = houses.filter((h) => h.x < 1800);
      const tallA = firstHalf.reduce((a, b) => (b.h > a.h ? b : a));
      cnp(1, tallA.x + tallA.w / 2, tallA.y - 60);
      const hB = houses[Math.min(6, houses.length - 2)];
      cnp(2, hB.x + hB.w + 60, GROUND_Y - 260);
      const tallC = houses.filter((h) => h.x >= 1800).reduce((a, b) => (b.h > a.h ? b : a));
      cnp(3, tallC.x + tallC.w / 2, tallC.y - 60);

      // --- ZONE 2: 忍びの洞窟 ---------------------------------------------
      // 床は溶岩の池で途切れ、天井からはトゲが垂れる。天井に頭をぶつけると
      // 跳躍が止まるので、長押しし過ぎると逆に危ない
      const pits = [];
      x = 3600;
      ground(x, 260, "cave"); x += 260;
      while (x < 7200) {
        const gap = RI(80, 140);
        lava(x, gap);
        pits.push({ x, w: gap });
        coinArc(x + gap / 2, GROUND_Y - 70, 3, 24, 30);
        x += gap;
        const w = RI(170, 320);
        ground(x, w, "cave");
        if (w > 220 && rng() < 0.7) {
          const pw = RI(50, 80), ph = RI(40, 90);
          solid(x + RI(40, w - pw - 40), GROUND_Y - ph, pw, ph, "rock", "cave");
        }
        x += w;
      }
      ground(x, 7400 - x, "cave");
      let cxp = 3600;
      while (cxp < 7400) {
        const w = Math.min(RI(80, 160), 7400 - cxp);
        const h = RI(70, 170);
        solid(cxp, -40, w, h + 40, "ceiling", "cave");
        if (rng() < 0.5 && w >= 80 && cxp > 3800) {
          const sw = Math.min(w - 20, RI(40, 70));
          L.spikes.push({ x: cxp + (w - sw) / 2, y: h, w: sw, h: 24, dir: "down" });
        }
        cxp += w;
      }
      for (let bx = 4000; bx < 7300; bx += RI(330, 460)) enemy("bat", bx, RI(220, 320));
      cnp(4, pits[2].x + pits[2].w / 2, GROUND_Y - 130);
      cnp(5, pits[6].x + pits[6].w / 2, GROUND_Y - 44);
      cnp(6, pits[Math.min(11, pits.length - 1)].x + pits[Math.min(11, pits.length - 1)].w / 2, 250);

      // --- ZONE 3: 天守 ----------------------------------------------------
      // 3段の石垣(城)を登り、溶岩の堀は浮き足場で渡る。天守の上には手裏剣を投げる忍者
      x = 7400;
      ground(x, 240, "castle"); x += 240;
      const castles = [];
      const moats = [];
      let ci = 0;
      while (x < 10900) {
        const moat = RI(140, 210);
        lava(x, moat);
        const plat = solid(x + moat / 2 - 40, GROUND_Y - RI(90, 130), 80, 14, "plat", "castle");
        moats.push({ x, w: moat, plat });
        coinArc(x + moat / 2, plat.y - 30, 3, 24, 16);
        x += moat;
        const cw = RI(260, 360);
        ground(x, cw, "castle");
        const tiers = [];
        const tierH = RI(56, 70);
        for (let t = 0; t < 3; t++) {
          const tw = cw - 40 - t * 80;
          const top = GROUND_Y - tierH * (t + 1);
          tiers.push(solid(x + 20 + t * 40, top, tw, tierH, t === 2 ? "keep" : "stone", "castle"));
        }
        const keep = tiers[2];
        castles.push(keep);
        coinArc(keep.x + keep.w / 2, keep.y - 40, 4, 22, 18);
        if (ci % 2 === 1) enemy("ninja", keep.x + keep.w - 36, keep.y);
        enemy("crow", x + cw / 2, RI(110, 190));
        ci++;
        x += cw;
        const run = RI(60, 120);
        ground(x, run, "castle");
        x += run;
      }
      ground(x, 11200 - x, "castle");
      cnp(7, castles[0].x + castles[0].w / 2, castles[0].y - 60);
      cnp(8, moats[2].plat.x + 40, moats[2].plat.y - 70);
      const tallK = castles.reduce((a, b) => (b.y < a.y ? b : a));
      cnp(9, tallK.x + tallK.w / 2 - 40, tallK.y - 110);
      const m5 = moats[Math.min(5, moats.length - 1)];
      cnp(10, m5.x + m5.w / 2, GROUND_Y - 330);

      // --- FINAL: 鳥居の丘 -------------------------------------------------
      ground(11200, 1400, "goal");
      for (let gx = 11350; gx < 11800; gx += 150) coinArc(gx, GROUND_Y - 60, 3, 24, 30);
      L.goalX = 11950;
      L.end = 12600;

      // 燃料缶。足場の上に置く
      for (const fx of [1650, 3200, 4700, 6100, 7900, 9300, 10500]) {
        // 溶岩の上に当たったら宙に浮かせて置く(取るには跳び越しながら拾う)
        const top = surface(fx);
        L.fuels.push({ x: fx, y: top > H ? GROUND_Y - 110 : top - 34, got: false });
      }
      // チェックポイント(提灯)。ゾーンの入口に置き、ミス時はここから再開
      L.checkpoints = ZONES.map((z) => ({ x: z.x + 70, y: surface(z.x + 70) }));
      L.surface = surface;
      return L;
    }
    const level = buildLevel();

    // ------------------------------------------------------------------
    // 効果音 / BGM(WebAudio のチップチューン。音源ファイル不要)
    // ------------------------------------------------------------------
    const SFX = {
      ctx: null, master: null, bgmGain: null, muted: false, _noise: null,
      unlock() {
        if (!SFX.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return Promise.resolve();
          SFX.ctx = new AC();
          SFX.master = SFX.ctx.createGain();
          SFX.master.gain.value = SFX.muted ? 0 : 0.5;
          SFX.master.connect(SFX.ctx.destination);
          SFX.bgmGain = SFX.ctx.createGain();
          SFX.bgmGain.gain.value = 0.22;
          SFX.bgmGain.connect(SFX.master);
        }
        if (SFX.ctx.state === "suspended") return SFX.ctx.resume().catch(() => {});
        return Promise.resolve();
      },
      setMuted(m) {
        SFX.muted = m;
        if (SFX.master) SFX.master.gain.value = m ? 0 : 0.5;
      },
      tone({ freq = 440, to = null, dur = 0.12, type = "square", gain = 0.2, delay = 0, out = null }) {
        if (!SFX.ctx || SFX.muted) return;
        const t0 = SFX.ctx.currentTime + delay;
        const o = SFX.ctx.createOscillator();
        const g = SFX.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t0);
        if (to !== null) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(gain, t0 + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(out || SFX.master);
        o.start(t0);
        o.stop(t0 + dur + 0.02);
      },
      noise({ dur = 0.2, gain = 0.2, delay = 0, from = 1800, to = 200 }) {
        if (!SFX.ctx || SFX.muted) return;
        if (!SFX._noise) {
          const len = SFX.ctx.sampleRate;
          const b = SFX.ctx.createBuffer(1, len, SFX.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          SFX._noise = b;
        }
        const t0 = SFX.ctx.currentTime + delay;
        const src = SFX.ctx.createBufferSource();
        src.buffer = SFX._noise;
        src.loop = true;
        const lp = SFX.ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.setValueAtTime(from, t0);
        lp.frequency.exponentialRampToValueAtTime(Math.max(40, to), t0 + dur);
        const g = SFX.ctx.createGain();
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(lp).connect(g).connect(SFX.master);
        src.start(t0);
        src.stop(t0 + dur + 0.02);
      },
      // 跳ねるたびに鳴る「ボヨン」。毎秒鳴るので音量は控えめに
      boing(high) {
        SFX.tone({ freq: high ? 200 : 170, to: high ? 560 : 340, dur: high ? 0.16 : 0.1, type: "triangle", gain: high ? 0.16 : 0.1 });
      },
      bonk() { SFX.tone({ freq: 160, to: 70, dur: 0.1, type: "square", gain: 0.12 }); },
      shot() { SFX.tone({ freq: 1100, to: 380, dur: 0.07, type: "square", gain: 0.07 }); },
      coin() {
        SFX.tone({ freq: 988, dur: 0.05, gain: 0.08 });
        SFX.tone({ freq: 1319, dur: 0.12, gain: 0.08, delay: 0.05 });
      },
      kill() {
        SFX.noise({ dur: 0.18, gain: 0.2, from: 2600, to: 300 });
        SFX.tone({ freq: 660, to: 110, dur: 0.18, type: "square", gain: 0.08 });
      },
      stomp() {
        SFX.tone({ freq: 300, to: 900, dur: 0.12, type: "square", gain: 0.12 });
        SFX.noise({ dur: 0.1, gain: 0.12, from: 3000, to: 800 });
      },
      rescue() {
        [784, 988, 1175, 1568].forEach((f, i) => SFX.tone({ freq: f, dur: 0.14, gain: 0.12, delay: i * 0.07 }));
      },
      fuel() {
        [440, 554, 659, 880].forEach((f, i) => SFX.tone({ freq: f, dur: 0.08, type: "triangle", gain: 0.18, delay: i * 0.05 }));
      },
      low() { SFX.tone({ freq: 1760, dur: 0.06, gain: 0.05 }); },
      checkpoint() {
        [659, 880, 1319].forEach((f, i) => SFX.tone({ freq: f, dur: 0.2, type: "triangle", gain: 0.16, delay: i * 0.09 }));
      },
      crash() {
        SFX.noise({ dur: 0.7, gain: 0.3, from: 1600, to: 60 });
        SFX.tone({ freq: 440, to: 40, dur: 0.7, type: "sawtooth", gain: 0.1 });
      },
      clear() {
        const seq = [523, 659, 784, 1047, 0, 784, 1047, 1319];
        seq.forEach((f, i) => { if (f) SFX.tone({ freq: f, dur: 0.18, gain: 0.14, delay: i * 0.12 }); });
      },
      over() {
        [523, 494, 466, 440, 415, 392].forEach((f, i) => SFX.tone({ freq: f, dur: 0.24, type: "triangle", gain: 0.18, delay: i * 0.2 }));
      }
    };

    // 4小節ループのBGM。ゾーンごとに移調と音色を変えて雰囲気を切り替える
    // (ヨナ抜き寄りの短調ペンタトニック: 和の匂いを少し足す)
    const BGM = {
      lead: [69, 0, 72, 74, 76, 0, 74, 72, 69, 0, 67, 69, 72, 0, 0, 0,
             69, 0, 72, 74, 76, 0, 79, 76, 74, 0, 72, 74, 69, 0, 0, 0],
      roots: [45, 41, 43, 45],
      step: 0, next: 0, timer: null, on: false, stepDur: 0.19,
      start() {
        if (!SFX.ctx) return;
        BGM.on = true;
        BGM.step = 0;
        BGM.next = SFX.ctx.currentTime + 0.1;
        if (!BGM.timer) BGM.timer = setInterval(BGM.pump, 25);
      },
      stop() { BGM.on = false; },
      pump() {
        if (!BGM.on || !SFX.ctx || SFX.muted) return;
        const z = ZONES[state.zone] || ZONES[0];
        while (BGM.next < SFX.ctx.currentTime + 0.12) {
          const i = BGM.step % 32;
          const n = BGM.lead[i];
          const delay = Math.max(0, BGM.next - SFX.ctx.currentTime);
          const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
          if (n) SFX.tone({ freq: midi(n + z.shift), dur: BGM.stepDur * 0.9, type: z.wave, gain: 0.22, delay, out: SFX.bgmGain });
          const root = BGM.roots[Math.floor(i / 8)] + z.shift;
          const bassPat = [0, 0, 12, 0, 0, 7, 12, 0];
          if (i % 2 === 0 || i % 8 === 5) {
            SFX.tone({ freq: midi(root + bassPat[i % 8]), dur: BGM.stepDur * 0.8, type: "triangle", gain: 0.35, delay, out: SFX.bgmGain });
          }
          if (i % 4 === 2) SFX.noise({ dur: 0.04, gain: 0.05, delay, from: 7000, to: 3000 });
          BGM.step++;
          BGM.next += BGM.stepDur;
        }
      }
    };

    // ------------------------------------------------------------------
    // 状態
    // ------------------------------------------------------------------
    let hiScore = 0;
    try { hiScore = Number(localStorage.getItem("sakuyaJumpBugHi")) || 0; } catch (e) { /* 保存不可の環境でも遊べる */ }

    const input = { left: false, right: false, jump: false, fire: false };
    const state = {
      phase: "title",   // title | play | dying | goal | clear | over
      paused: false,
      frame: 0,
      score: 0,
      lives: START_LIVES,
      fuel: 100,
      zone: 0,
      checkpoint: 0,
      camX: 0,
      shake: 0,
      car: null,
      bullets: [],
      shots: [],       // 敵(忍者)の手裏剣
      enemies: [],
      particles: [],
      pops: [],
      caption: null,
      timer: 0,
      rescued: new Array(CNP.length).fill(false),
      rosterFlash: new Array(CNP.length).fill(0),
      portraitTimer: 0,
      nextExtra: 20000,
      bonus: null,
      newRecord: false
    };

    function makeCar(x, y) {
      return { x, y, vx: 0, vy: 0, facing: 1, squash: 0, wheel: 0, inv: 0, fireCd: 0, lastLand: 0 };
    }

    function spawnEnemies() {
      state.enemies = level.enemies.map((d) => makeEnemy(d));
    }
    function makeEnemy(d) {
      const size = { crow: [34, 20], hopper: [30, 28], bat: [30, 18], ninja: [28, 34] }[d.type];
      return {
        def: d, type: d.type, x: d.sx, y: d.type === "hopper" || d.type === "ninja" ? d.sy - size[1] : d.sy,
        w: size[0], h: size[1], baseY: d.sy, t: 0, active: false, dead: false,
        hp: d.type === "ninja" ? 2 : 1, cd: 60, stompable: d.type !== "ninja"
      };
    }

    function resetGame() {
      state.score = 0;
      state.lives = START_LIVES;
      state.fuel = 100;
      state.zone = 0;
      state.checkpoint = 0;
      state.camX = 0;
      state.bullets = [];
      state.shots = [];
      state.particles = [];
      state.pops = [];
      state.rescued.fill(false);
      state.rosterFlash.fill(0);
      state.nextExtra = 20000;
      state.bonus = null;
      state.newRecord = false;
      for (const c of level.coins) c.got = false;
      for (const f of level.fuels) f.got = false;
      for (const c of level.cnps) c.got = false;
      spawnEnemies();
      state.car = makeCar(120, GROUND_Y - CAR_H - 120);
      state.car.inv = 60;
      state.phase = "play";
      showCaption(0);
      shareBtn.hidden = true;
    }

    function respawn() {
      const cp = level.checkpoints[state.checkpoint];
      state.camX = Math.max(0, cp.x - 160);
      state.car = makeCar(cp.x + 30, cp.y - CAR_H - 140);
      state.car.inv = 120;
      state.fuel = 100;
      state.bullets = [];
      state.shots = [];
      // チェックポイントより先の敵だけ復活させる(後ろは既に通過済み)
      state.enemies = state.enemies.map((e) => (e.def.sx > cp.x ? makeEnemy(e.def) : e));
      state.phase = "play";
      showCaption(state.zone);
    }

    function showCaption(zi) {
      state.caption = { zone: ZONES[zi], t: 150 };
    }

    function addScore(n, x, y, text) {
      state.score += n;
      if (x !== undefined) state.pops.push({ x, y, text: text || `+${n}`, t: 50 });
      if (state.score >= state.nextExtra) {
        state.nextExtra += 20000;
        state.lives++;
        state.pops.push({ x: state.car.x + CAR_W / 2, y: state.car.y - 30, text: "1UP!", t: 70, color: C.magenta });
        SFX.checkpoint();
      }
    }

    function burst(x, y, color, n, speed = 3, grav = 0.1, size = 3) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = Math.random() * speed;
        state.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3, life: 30 + Math.random() * 20, max: 50, color, size, grav });
      }
    }

    // ------------------------------------------------------------------
    // 衝突
    // ------------------------------------------------------------------
    function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }
    function solidsNear(x0, x1) {
      return level.solids.filter((s) => s.x < x1 && s.x + s.w > x0);
    }

    function killCar(reason) {
      if (state.phase !== "play") return;
      const car = state.car;
      state.phase = "dying";
      state.timer = 110;
      state.shake = 18;
      state.portraitTimer = 110;
      state.lives--;
      burst(car.x + CAR_W / 2, car.y + CAR_H / 2, C.nounRed, 26, 5, 0.15, 4);
      burst(car.x + CAR_W / 2, car.y + CAR_H / 2, C.gold, 20, 4, 0.12, 3);
      burst(car.x + CAR_W / 2, car.y + CAR_H / 2, "#FFFFFF", 12, 3, 0.05, 2);
      state.pops.push({ x: car.x + CAR_W / 2, y: car.y - 20, text: reason, t: 90, color: C.danger });
      SFX.crash();
      BGM.stop();
    }

    // ------------------------------------------------------------------
    // 更新
    // ------------------------------------------------------------------
    function updateCar() {
      const car = state.car;
      const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      if (dir !== 0) car.facing = dir;
      const target = dir > 0 ? PHYS.maxSpeed : dir < 0 ? -PHYS.maxBack : 0;
      if (dir !== 0) car.vx += Math.sign(target - car.vx) * Math.min(PHYS.accel, Math.abs(target - car.vx));
      else car.vx -= Math.sign(car.vx) * Math.min(PHYS.friction, Math.abs(car.vx));

      const g = input.jump && car.vy < 0 ? PHYS.gravityHeld : PHYS.gravity;
      car.vy = Math.min(PHYS.maxFall, car.vy + g);

      const near = solidsNear(car.x - 20, car.x + CAR_W + 20);
      // X軸 → Y軸 の順に分離して解決する。着地した瞬間に横へ弾かれる誤判定を防ぐ
      car.x += car.vx;
      for (const s of near) {
        if (s.kind === "plat") continue;   // 浮き足場は一方通行(下からすり抜け、上からだけ乗れる)
        if (!overlap(car.x, car.y, CAR_W, CAR_H, s.x, s.y, s.w, s.h)) continue;
        if (car.vx > 0) car.x = s.x - CAR_W; else if (car.vx < 0) car.x = s.x + s.w;
        car.vx = 0;
      }
      // 画面は前にしか進まない(本家ジャンプバグと同じ)。左端より後ろへは戻れない
      if (car.x < state.camX + 4) { car.x = state.camX + 4; if (car.vx < 0) car.vx = 0; }

      const prevBottom = car.y + CAR_H;
      car.y += car.vy;
      let landed = false;
      for (const s of near) {
        if (!overlap(car.x, car.y, CAR_W, CAR_H, s.x, s.y, s.w, s.h)) continue;
        if (s.kind === "plat" && (car.vy <= 0 || prevBottom > s.y + 0.5)) continue;
        if (car.vy > 0) {
          car.y = s.y - CAR_H;
          landed = true;
        } else if (car.vy < 0) {
          car.y = s.y + s.h;
          car.vy = 1.2;
          SFX.bonk();
          burst(car.x + CAR_W / 2, car.y, C.caveEdge, 5, 2, 0.1, 2);
        }
      }
      if (landed) {
        const high = input.jump;
        car.vy = -(high ? PHYS.bounceHigh : PHYS.bounceLow);
        car.squash = 1;
        car.lastLand = state.frame;
        SFX.boing(high);
        for (let i = 0; i < 4; i++) {
          state.particles.push({ x: car.x + 8 + Math.random() * 34, y: car.y + CAR_H, vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 1.2, life: 18, max: 18, color: "rgba(200,180,230,0.7)", size: 3, grav: 0 });
        }
      }
      if (car.y < -60) { car.y = -60; car.vy = Math.max(car.vy, 0); }
      car.squash *= 0.82;
      car.wheel += car.vx * 0.12;
      if (car.inv > 0) car.inv--;

      // 溶岩: 地面の高さより深く沈んだら落下とみなす
      if (car.y + CAR_H > GROUND_Y + 16) killCar("ジュッ!");

      // トゲ
      if (car.inv <= 0) {
        for (const sp of level.spikes) {
          if (sp.x > car.x + CAR_W || sp.x + sp.w < car.x) continue;
          if (overlap(car.x + 6, car.y + 4, CAR_W - 12, CAR_H - 6, sp.x + 4, sp.y, sp.w - 8, sp.h - 6)) { killCar("トゲ!"); return; }
        }
      }

      // ショット
      if (car.fireCd > 0) car.fireCd--;
      if (input.fire && car.fireCd === 0 && state.bullets.length < 3) {
        const bx = car.facing > 0 ? car.x + CAR_W + 4 : car.x - 12;
        state.bullets.push({ x: bx, y: car.y + 12, vx: car.facing * 11 + car.vx * 0.5, life: 55 });
        car.fireCd = 12;
        SFX.shot();
      }

      // 燃料
      state.fuel -= FUEL_DRAIN;
      if (state.fuel < 25 && state.frame % 40 === 0) SFX.low();
      if (state.fuel <= 0) { state.fuel = 0; killCar("ガス欠!"); }
    }

    function updateCamera() {
      const car = state.car;
      const target = car.x - W * 0.34;
      if (target > state.camX) state.camX += (target - state.camX) * 0.12;
      state.camX = Math.max(0, Math.min(state.camX, level.end - W));
    }

    function updateBullets() {
      for (const b of state.bullets) {
        b.x += b.vx;
        b.life--;
        for (const s of solidsNear(b.x - 4, b.x + 12)) {
          if (s.kind !== "plat" && overlap(b.x, b.y, 10, 4, s.x, s.y, s.w, s.h)) { b.life = 0; burst(b.x, b.y, C.gold, 4, 2, 0, 2); break; }
        }
        if (b.life <= 0) continue;
        for (const e of state.enemies) {
          if (e.dead || !e.active) continue;
          if (overlap(b.x, b.y - 2, 12, 8, e.x, e.y, e.w, e.h)) {
            b.life = 0;
            e.hp--;
            if (e.hp <= 0) killEnemy(e, 200);
            else { burst(b.x, b.y, "#FFFFFF", 6, 2, 0, 2); SFX.bonk(); }
            break;
          }
        }
        if (b.life <= 0) continue;
        for (const s of state.shots) {
          if (s.life > 0 && overlap(b.x, b.y - 2, 12, 8, s.x - 8, s.y - 8, 16, 16)) {
            s.life = 0; b.life = 0;
            burst(s.x, s.y, "#CFD6E6", 8, 3, 0, 2);
            addScore(50, s.x, s.y);
            SFX.kill();
            break;
          }
        }
      }
      state.bullets = state.bullets.filter((b) => b.life > 0 && b.x > state.camX - 40 && b.x < state.camX + W + 40);
    }

    function killEnemy(e, pts) {
      e.dead = true;
      burst(e.x + e.w / 2, e.y + e.h / 2, e.type === "bat" ? C.caveEdge : C.magenta, 16, 4, 0.12, 3);
      addScore(pts, e.x + e.w / 2, e.y);
      SFX.kill();
    }

    function updateEnemies() {
      const car = state.car;
      for (const e of state.enemies) {
        if (e.dead) continue;
        if (!e.active) {
          if (e.x < state.camX + W + 60) e.active = true; else continue;
        }
        e.t++;
        if (e.type === "crow") {
          e.x -= 1.6;
          e.y = e.baseY + Math.sin(e.t * 0.05) * 32;
        } else if (e.type === "bat") {
          e.x -= 1.1;
          e.y = e.baseY + Math.sin(e.t * 0.07) * 60;
        } else if (e.type === "hopper") {
          e.y = e.baseY - e.h - Math.abs(Math.sin(e.t * 0.055)) * 90;
        } else if (e.type === "ninja") {
          e.cd--;
          const onScreen = e.x < state.camX + W - 20 && e.x > state.camX + 40;
          if (onScreen && e.cd <= 0 && car.x + CAR_W < e.x) {
            const sx = e.x, sy = e.y + 12;
            const dx = car.x + CAR_W / 2 - sx, dy = car.y + CAR_H / 2 - sy;
            const d = Math.hypot(dx, dy) || 1;
            state.shots.push({ x: sx, y: sy, vx: dx / d * 3.6, vy: dy / d * 3.6, life: 260, r: 0 });
            e.cd = 105;
          }
        }
        if (e.x + e.w < state.camX - 120) { e.dead = true; continue; }

        // 車との接触。上から踏めば倒せる(手裏剣使いの忍者は踏めない)
        if (state.phase === "play" && overlap(car.x + 4, car.y + 2, CAR_W - 8, CAR_H - 2, e.x, e.y, e.w, e.h)) {
          const fromAbove = car.vy > 0 && car.y + CAR_H - car.vy <= e.y + 10;
          if (fromAbove && e.stompable) {
            killEnemy(e, 300);
            car.vy = -PHYS.bounceHigh;
            car.squash = 1;
            SFX.stomp();
          } else if (car.inv <= 0) {
            killCar("ドカン!");
          }
        }
      }

      for (const s of state.shots) {
        s.x += s.vx; s.y += s.vy; s.r += 0.4; s.life--;
        if (state.phase === "play" && car.inv <= 0 && overlap(car.x + 6, car.y + 4, CAR_W - 12, CAR_H - 6, s.x - 6, s.y - 6, 12, 12)) {
          s.life = 0;
          killCar("手裏剣!");
        }
      }
      state.shots = state.shots.filter((s) => s.life > 0 && s.x > state.camX - 40 && s.y < H + 20);
    }

    function updateItems() {
      const car = state.car;
      const cx = car.x + CAR_W / 2, cy = car.y + CAR_H / 2;
      for (const c of level.coins) {
        if (c.got || Math.abs(c.x - cx) > 60) continue;
        if (overlap(car.x, car.y, CAR_W, CAR_H, c.x - 9, c.y - 9, 18, 18)) {
          c.got = true;
          addScore(50);
          burst(c.x, c.y, C.gold, 6, 2, 0, 2);
          SFX.coin();
        }
      }
      for (const f of level.fuels) {
        if (f.got || Math.abs(f.x - cx) > 60) continue;
        if (overlap(car.x, car.y, CAR_W, CAR_H, f.x - 12, f.y - 14, 24, 28)) {
          f.got = true;
          state.fuel = Math.min(100, state.fuel + 45);
          state.pops.push({ x: f.x, y: f.y - 20, text: "FUEL +45", t: 60, color: C.gold });
          SFX.fuel();
        }
      }
      for (const c of level.cnps) {
        if (c.got || Math.abs(c.x - cx) > 80) continue;
        const by = c.y + Math.sin(state.frame * 0.05 + c.idx) * 6;
        if (Math.hypot(c.x - cx, by - cy) < 36) {
          c.got = true;
          const ch = CNP[c.idx];
          state.rescued[c.idx] = true;
          state.rosterFlash[c.idx] = 45;
          state.portraitTimer = 60;
          addScore(ch.tierDef.score, c.x, by - 30, `${ch.label} +${ch.tierDef.score}`);
          burst(c.x, by, `hsl(${ch.hue},90%,65%)`, 24, 4, 0.05, 3);
          SFX.rescue();
        }
      }
      // チェックポイント
      const next = state.checkpoint + 1;
      if (next < level.checkpoints.length && car.x > level.checkpoints[next].x) {
        state.checkpoint = next;
        state.zone = next;
        showCaption(next);
        SFX.checkpoint();
      }
      // ゴール
      if (car.x + CAR_W / 2 > level.goalX) {
        state.phase = "goal";
        state.timer = 150;
        BGM.stop();
        SFX.clear();
        burst(level.goalX, GROUND_Y - 140, C.gold, 40, 6, 0.08, 3);
        burst(level.goalX, GROUND_Y - 140, C.magenta, 30, 5, 0.08, 3);
      }
    }

    function updateFx() {
      for (const p of state.particles) {
        p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--;
      }
      state.particles = state.particles.filter((p) => p.life > 0);
      for (const p of state.pops) { p.y -= 0.6; p.t--; }
      state.pops = state.pops.filter((p) => p.t > 0);
      if (state.caption) { state.caption.t--; if (state.caption.t <= 0) state.caption = null; }
      for (let i = 0; i < state.rosterFlash.length; i++) if (state.rosterFlash[i] > 0) state.rosterFlash[i]--;
      if (state.shake > 0) state.shake *= 0.85;
      if (state.shake < 0.5) state.shake = 0;
      if (state.portraitTimer > 0) state.portraitTimer--;
    }

    function finishClear() {
      const got = state.rescued.filter(Boolean).length;
      const b = {
        fuel: Math.floor(state.fuel) * 20,
        lives: state.lives * 1000,
        all: got === CNP.length ? 5000 : 0,
        got
      };
      state.bonus = b;
      state.score += b.fuel + b.lives + b.all;
      saveHi();
      state.phase = "clear";
      state.timer = 0;
      shareBtn.hidden = false;
    }

    function saveHi() {
      if (state.score > hiScore) {
        hiScore = state.score;
        state.newRecord = true;
        try { localStorage.setItem("sakuyaJumpBugHi", String(hiScore)); } catch (e) { /* 無視 */ }
      }
    }

    function tick() {
      state.frame++;
      if (state.phase === "title") return;
      if (state.phase === "play") {
        updateCar();
        if (state.phase === "play") {
          updateCamera();
          updateItems();
        }
        updateBullets();
        updateEnemies();
      } else if (state.phase === "dying") {
        updateEnemies();
        state.timer--;
        if (state.timer <= 0) {
          if (state.lives > 0) { respawn(); BGM.start(); }
          else {
            state.phase = "over";
            state.timer = 0;
            saveHi();
            SFX.over();
            shareBtn.hidden = false;
          }
        }
      } else if (state.phase === "goal") {
        // 鳥居をくぐって走り抜ける自動デモ
        const car = state.car;
        car.x += 3;
        car.vy = Math.min(PHYS.maxFall, car.vy + PHYS.gravity);
        car.y += car.vy;
        if (car.y + CAR_H >= GROUND_Y) { car.y = GROUND_Y - CAR_H; car.vy = -PHYS.bounceLow * 0.8; car.squash = 1; }
        car.squash *= 0.82;
        car.wheel += 0.4;
        car.facing = 1;
        if (state.frame % 12 === 0) burst(level.goalX + (Math.random() - 0.5) * 200, GROUND_Y - 200 - Math.random() * 100, Math.random() < 0.5 ? C.gold : C.magenta, 14, 4, 0.06, 3);
        state.timer--;
        if (state.timer <= 0) finishClear();
      } else {
        state.timer++;
      }
      updateFx();
    }

    // ------------------------------------------------------------------
    // 描画
    // ------------------------------------------------------------------
    // ⌐◨-◨ カー。原点=当たり判定の底辺中央、右向き。
    //  ◨ ◨ … 2枚のレンズがそのまま車体(キャビン)。左半分が白、右半分が黒の瞳
    //  -   … ブリッジが車体をつなぐ
    //  ⌐   … つるが後ろに伸びてリアスポイラーになる。咲耶のマゼンタの鉢巻がなびく
    function drawCar(car, scale = 1, blink = false) {
      const cx = car.x + CAR_W / 2;
      const by = car.y + CAR_H;
      ctx.save();
      ctx.translate(Math.round(cx), Math.round(by));
      ctx.scale(scale * car.facing, scale);
      const tilt = Math.max(-0.2, Math.min(0.2, car.vy * 0.025));
      ctx.rotate(tilt * (car.vy < 0 ? 1 : 0.6));
      const sq = car.squash;
      ctx.scale(1 + sq * 0.16, 1 - sq * 0.22);
      if (blink) ctx.globalAlpha = 0.35;

      const f = state.frame;
      // 鉢巻(スカーフ)。スポイラーの角から後ろへ流す
      ctx.fillStyle = C.magenta;
      ctx.beginPath();
      ctx.moveTo(-34, -27);
      for (let i = 1; i <= 4; i++) {
        ctx.lineTo(-34 - i * 7, -27 + Math.sin(f * 0.3 + i) * 3 + i * 0.8);
      }
      for (let i = 4; i >= 1; i--) {
        ctx.lineTo(-34 - i * 7, -23 + Math.sin(f * 0.3 + i) * 3 + i * 1.2);
      }
      ctx.lineTo(-34, -23);
      ctx.closePath();
      ctx.fill();

      // シャシー(下回り)
      ctx.fillStyle = "#1A1226";
      ctx.fillRect(-26, -12, 56, 6);
      ctx.fillStyle = C.gold;
      ctx.fillRect(-24, -10, 52, 1);

      // ⌐ (スポイラー)
      ctx.fillStyle = C.nounRed;
      ctx.fillRect(-34, -28, 14, 5);
      ctx.fillRect(-34, -28, 5, 11);
      // - (ブリッジ)
      ctx.fillRect(-4, -25, 12, 5);
      // ◨ ◨ (レンズ = キャビン)
      for (const lx of [-22, 6]) {
        ctx.fillStyle = C.nounRed;
        ctx.fillRect(lx, -33, 22, 22);
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(lx + 4, -29, 7, 14);
        ctx.fillStyle = "#000000";
        ctx.fillRect(lx + 11, -29, 7, 14);
      }
      // ヘッドライト
      ctx.fillStyle = C.gold;
      ctx.fillRect(28, -20, 4, 4);

      // タイヤ
      for (const wx of [-12, 17]) {
        ctx.fillStyle = "#0B0810";
        ctx.beginPath();
        ctx.arc(wx, -6.5, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#3A2F4A";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.save();
        ctx.translate(wx, -6.5);
        ctx.rotate(car.wheel);
        ctx.fillStyle = C.gold;
        ctx.fillRect(-4, -0.8, 8, 1.6);
        ctx.fillRect(-0.8, -4, 1.6, 8);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawSky(zoneKey, alpha) {
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      const cam = state.camX;
      if (zoneKey === "city") {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#140B26");
        g.addColorStop(0.7, "#4A1D4F");
        g.addColorStop(1, "#6E2A4E");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        moon(760, 110, 46, "#F3DE9A");
        layer(0.08, 320, "#2A1640", (i, x) => fuji(x, 320, 200 + hash(i) * 80));
        layer(0.3, 90, "#1E1030", (i, x) => house(x, GROUND_Y, 70 + hash(i + 9) * 90, i));
      } else if (zoneKey === "cave") {
        ctx.fillStyle = "#0B0613"; ctx.fillRect(0, 0, W, H);
        layer(0.2, 70, "#1A0E2C", (i, x) => {
          const h1 = 60 + hash(i) * 140, h2 = 50 + hash(i + 3) * 120;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 35, h1); ctx.lineTo(x + 70, 0); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x + 10, H); ctx.lineTo(x + 45, H - h2); ctx.lineTo(x + 80, H); ctx.fill();
        });
        // 結晶のきらめき
        for (let i = 0; i < 40; i++) {
          const sx = ((hash(i) * 3000 - cam * 0.35) % W + W) % W;
          const sy = 60 + hash(i + 50) * 380;
          const a = 0.2 + 0.4 * Math.abs(Math.sin(state.frame * 0.03 + i));
          ctx.fillStyle = `rgba(255,45,155,${a})`;
          ctx.fillRect(sx, sy, 2, 2);
        }
      } else if (zoneKey === "castle") {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#07040F");
        g.addColorStop(1, "#2C0D26");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 70; i++) {
          const sx = ((hash(i + 7) * 4000 - cam * 0.05) % W + W) % W;
          const sy = hash(i + 90) * 300;
          ctx.fillStyle = `rgba(232,236,245,${0.3 + 0.5 * Math.abs(Math.sin(state.frame * 0.02 + i))})`;
          ctx.fillRect(sx, sy, 2, 2);
        }
        moon(180, 120, 52, "#FF6A4A");
        layer(0.15, 360, "#1A0B20", (i, x) => farCastle(x, GROUND_Y - 20, 0.8 + hash(i) * 0.5));
      } else {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#2A1640");
        g.addColorStop(0.55, "#B24A5A");
        g.addColorStop(1, "#F2B866");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#FFE3A0";
        ctx.beginPath(); ctx.arc(640, 360, 70, Math.PI, 0); ctx.fill();
        layer(0.08, 320, "#5A2548", (i, x) => fuji(x, 320, 200 + hash(i) * 80));
      }
      ctx.restore();

      function moon(x, y, r, col) {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.12)";
        ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.22, 0, Math.PI * 2); ctx.fill();
      }
      function layer(p, sw, col, fn) {
        const off = cam * p;
        const i0 = Math.floor(off / sw) - 1;
        ctx.fillStyle = col;
        for (let i = i0; i < i0 + Math.ceil(W / sw) + 3; i++) fn(i, i * sw - off);
      }
      function fuji(x, w, h) {
        const base = GROUND_Y - 30;
        ctx.beginPath();
        ctx.moveTo(x - w * 0.2, base);
        ctx.lineTo(x + w * 0.38, base - h);
        ctx.lineTo(x + w * 0.52, base - h);
        ctx.lineTo(x + w * 1.1, base);
        ctx.fill();
      }
      function house(x, base, h, i) {
        ctx.fillRect(x, base - h, 70, h);
        ctx.beginPath();
        ctx.moveTo(x - 8, base - h); ctx.lineTo(x + 35, base - h - 20); ctx.lineTo(x + 78, base - h); ctx.fill();
        if (hash(i + 21) > 0.5) {
          ctx.save();
          ctx.fillStyle = "rgba(232,197,106,0.35)";
          ctx.fillRect(x + 14, base - h + 16, 8, 10);
          ctx.fillRect(x + 44, base - h + 36, 8, 10);
          ctx.restore();
        }
      }
      function farCastle(x, base, s) {
        ctx.fillRect(x, base - 60 * s, 140 * s, 60 * s);
        ctx.fillRect(x + 25 * s, base - 110 * s, 90 * s, 50 * s);
        ctx.fillRect(x + 45 * s, base - 150 * s, 50 * s, 40 * s);
        ctx.beginPath();
        ctx.moveTo(x + 30 * s, base - 150 * s); ctx.lineTo(x + 70 * s, base - 178 * s); ctx.lineTo(x + 110 * s, base - 150 * s); ctx.fill();
      }
    }

    function drawBackground() {
      const cx = state.camX + W / 2;
      const zi = zoneIndexAt(cx);
      drawSky(ZONES[zi].key, 1);
      const next = ZONES[zi + 1];
      if (next) {
        const t = (cx - (next.x - 320)) / 320;
        if (t > 0) drawSky(next.key, Math.min(1, t));
      }
    }

    function drawSolid(s) {
      const x = s.x, y = s.y, w = s.w, h = s.h;
      if (s.kind === "ground") {
        if (s.zone === "city" || s.zone === "goal") {
          ctx.fillStyle = s.zone === "goal" ? "#2B1A2E" : "#1C1428";
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = C.gold;
          ctx.fillRect(x, y, w, 2);
          ctx.fillStyle = "rgba(232,197,106,0.35)";
          for (let dx = Math.ceil(x / 60) * 60; dx < x + w - 30; dx += 60) ctx.fillRect(dx, y + 22, 30, 3);
        } else if (s.zone === "cave") {
          ctx.fillStyle = C.cave; ctx.fillRect(x, y, w, h);
          ctx.fillStyle = C.caveEdge;
          for (let dx = x; dx < x + w; dx += 3) ctx.fillRect(dx, y, 2, 2);
        } else {
          ctx.fillStyle = "#231B30"; ctx.fillRect(x, y, w, h);
          ctx.fillStyle = "#3A2F4A";
          for (let dy = y + 12; dy < H; dy += 14) ctx.fillRect(x, dy, w, 1);
          ctx.fillStyle = C.gold; ctx.fillRect(x, y, w, 2);
        }
      } else if (s.kind === "house") {
        // 町家。黒い壁、灯りの入った格子窓、金の瓦の縁
        ctx.fillStyle = "#1B1226"; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#2E2140"; ctx.fillRect(x - 6, y, w + 12, 10);
        ctx.fillStyle = C.gold; ctx.fillRect(x - 6, y, w + 12, 2);
        for (let wy = y + 22; wy < y + h - 26; wy += 34) {
          for (let wx = x + 14; wx < x + w - 24; wx += 36) {
            const lit = hash(wx * 0.37 + wy) > 0.35;
            ctx.fillStyle = lit ? "rgba(232,197,106,0.75)" : "#0E0916";
            ctx.fillRect(wx, wy, 18, 16);
            ctx.fillStyle = "#1B1226";
            ctx.fillRect(wx + 8, wy, 2, 16);
          }
        }
        // のれん
        ctx.fillStyle = C.magenta;
        ctx.fillRect(x + w / 2 - 14, y + h - 22, 28, 8);
      } else if (s.kind === "rock") {
        ctx.fillStyle = C.cave; ctx.fillRect(x, y, w, h + 2);
        ctx.fillStyle = C.caveEdge;
        for (let dx = x; dx < x + w; dx += 3) ctx.fillRect(dx, y, 2, 2);
        for (let dy = y; dy < y + h; dy += 3) { ctx.fillRect(x, dy, 2, 2); ctx.fillRect(x + w - 2, dy, 2, 2); }
      } else if (s.kind === "ceiling") {
        ctx.fillStyle = C.cave; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = C.caveEdge;
        for (let dx = x; dx < x + w; dx += 3) ctx.fillRect(dx, y + h - 2, 2, 2);
      } else if (s.kind === "stone" || s.kind === "keep") {
        // 石垣 + 白壁。天守(keep)には金の鯱風の飾りを載せる
        ctx.fillStyle = "#2B2338"; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#3D3350";
        for (let dy = y + 8; dy < y + h; dy += 12) {
          const o = ((dy - y) / 12) % 2 ? 0 : 14;
          for (let dx = x + o; dx < x + w; dx += 28) ctx.fillRect(dx, dy, 1, 12);
          ctx.fillRect(x, dy, w, 1);
        }
        ctx.fillStyle = "#D9D2E6"; ctx.fillRect(x, y, w, 7);
        ctx.fillStyle = "#1E1730"; ctx.fillRect(x - 5, y - 5, w + 10, 6);
        ctx.fillStyle = C.gold; ctx.fillRect(x - 5, y - 5, w + 10, 1);
        if (s.kind === "keep") {
          ctx.fillStyle = C.gold;
          ctx.fillRect(x + 4, y - 12, 6, 7);
          ctx.fillRect(x + w - 10, y - 12, 6, 7);
        }
      } else if (s.kind === "plat") {
        ctx.fillStyle = "#4A2E24"; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = C.gold; ctx.fillRect(x, y, w, 2);
        ctx.fillStyle = "#2A1A14";
        for (let dx = x + 16; dx < x + w; dx += 16) ctx.fillRect(dx, y + 2, 1, h - 2);
      }
    }

    function drawLava(l) {
      const top = GROUND_Y + 14;
      const g = ctx.createLinearGradient(0, top - 40, 0, top);
      g.addColorStop(0, "rgba(255,77,46,0)");
      g.addColorStop(1, "rgba(255,77,46,0.35)");
      ctx.fillStyle = g;
      ctx.fillRect(l.x, top - 40, l.w, 40);
      ctx.fillStyle = "#C2301A";
      ctx.fillRect(l.x, top, l.w, H - top);
      ctx.fillStyle = "#FF8A3A";
      for (let dx = 0; dx < l.w; dx += 4) {
        const wy = Math.sin((l.x + dx) * 0.08 + state.frame * 0.12) * 3;
        ctx.fillRect(l.x + dx, top + wy, 4, 5);
      }
      if (state.frame % 20 === 0 && Math.random() < 0.5) {
        state.particles.push({ x: l.x + Math.random() * l.w, y: top, vx: 0, vy: -2 - Math.random() * 2, life: 30, max: 30, color: "#FFB347", size: 3, grav: 0.12 });
      }
    }

    function drawSpike(sp) {
      ctx.fillStyle = "#D98CFF";
      const n = Math.max(1, Math.round(sp.w / 14));
      const tw = sp.w / n;
      for (let i = 0; i < n; i++) {
        ctx.beginPath();
        ctx.moveTo(sp.x + i * tw, sp.y);
        ctx.lineTo(sp.x + i * tw + tw / 2, sp.y + sp.h);
        ctx.lineTo(sp.x + (i + 1) * tw, sp.y);
        ctx.fill();
      }
      ctx.fillStyle = C.caveEdge;
      ctx.fillRect(sp.x, sp.y, sp.w, 2);
    }

    function drawLantern(cp, i, passed) {
      const x = cp.x, base = cp.y;
      ctx.fillStyle = "#2A1A14";
      ctx.fillRect(x - 2, base - 70, 4, 70);
      ctx.fillRect(x - 2, base - 70, 18, 3);
      const glow = passed ? 0.85 + 0.15 * Math.sin(state.frame * 0.1) : 0.35;
      ctx.fillStyle = `rgba(255,77,46,${glow})`;
      ctx.fillRect(x + 7, base - 66, 14, 20);
      ctx.fillStyle = C.gold;
      ctx.fillRect(x + 7, base - 66, 14, 2);
      ctx.fillRect(x + 7, base - 48, 14, 2);
      if (passed) {
        ctx.fillStyle = "rgba(255,120,60,0.15)";
        ctx.beginPath(); ctx.arc(x + 14, base - 56, 26, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawTorii(x) {
      const base = GROUND_Y;
      ctx.fillStyle = C.vermilion;
      ctx.fillRect(x - 70, base - 190, 14, 190);
      ctx.fillRect(x + 56, base - 190, 14, 190);
      ctx.fillRect(x - 84, base - 160, 168, 10);
      ctx.fillStyle = "#1A1020";
      ctx.fillRect(x - 100, base - 206, 200, 12);
      ctx.fillStyle = C.vermilion;
      ctx.fillRect(x - 92, base - 194, 184, 10);
      ctx.fillStyle = C.gold;
      ctx.fillRect(x - 12, base - 184, 24, 24);
      ctx.fillStyle = "#1A1020";
      ctx.font = C.font(8);
      ctx.textAlign = "center";
      ctx.fillText("GOAL", x, base - 168);
      ctx.textAlign = "left";
    }

    function drawCoin(c) {
      const s = Math.abs(Math.cos(state.frame * 0.08 + c.x * 0.01));
      ctx.fillStyle = C.gold;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - 9);
      ctx.lineTo(c.x + 7 * s + 1, c.y);
      ctx.lineTo(c.x, c.y + 9);
      ctx.lineTo(c.x - 7 * s - 1, c.y);
      ctx.fill();
      ctx.fillStyle = "#FFF4C8";
      ctx.fillRect(c.x - 1, c.y - 5, 2, 4);
    }

    function drawFuel(f) {
      const y = f.y + Math.sin(state.frame * 0.06 + f.x) * 3;
      ctx.fillStyle = C.danger;
      ctx.fillRect(f.x - 11, y - 12, 22, 26);
      ctx.fillStyle = "#1A1020";
      ctx.fillRect(f.x - 4, y - 17, 8, 5);
      ctx.fillStyle = C.gold;
      ctx.font = C.font(10);
      ctx.textAlign = "center";
      ctx.fillText("F", f.x, y + 6);
      ctx.textAlign = "left";
    }

    function drawCnpFigure(ch, x, y, size) {
      if (ch.ready) {
        ctx.drawImage(ch.img, x - size / 2, y - size / 2, size, size);
      } else {
        ctx.fillStyle = `hsl(${ch.hue},70%,55%)`;
        ctx.beginPath(); ctx.arc(x, y, size * 0.36, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#000";
        ctx.font = C.font(Math.round(size * 0.3));
        ctx.textAlign = "center";
        ctx.fillText("?", x, y + size * 0.14);
        ctx.textAlign = "left";
      }
    }

    function drawCnp(c) {
      const ch = CNP[c.idx];
      const y = c.y + Math.sin(state.frame * 0.05 + c.idx) * 6;
      const r = 26 + ch.tierDef.rank * 3 + Math.sin(state.frame * 0.1) * 2;
      const g = ctx.createRadialGradient(c.x, y, 4, c.x, y, r);
      g.addColorStop(0, `hsla(${ch.hue},90%,65%,0.55)`);
      g.addColorStop(1, `hsla(${ch.hue},90%,65%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x, y, r, 0, Math.PI * 2); ctx.fill();
      drawCnpFigure(ch, c.x, y, 50);
      // レア度のピップ
      ctx.fillStyle = C.gold;
      const n = ch.tierDef.rank;
      for (let i = 0; i < n; i++) {
        const px = c.x - (n - 1) * 5 + i * 10;
        ctx.beginPath();
        ctx.moveTo(px, y + 28); ctx.lineTo(px + 3, y + 31); ctx.lineTo(px, y + 34); ctx.lineTo(px - 3, y + 31);
        ctx.fill();
      }
    }

    function drawEnemy(e) {
      const x = e.x, y = e.y, f = state.frame;
      if (e.type === "crow") {
        // カラス天狗風の黒い鳥
        const flap = Math.sin(e.t * 0.35) * 8;
        ctx.fillStyle = "#0D0A14";
        ctx.beginPath(); ctx.ellipse(x + 17, y + 11, 14, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 10, y + 9); ctx.lineTo(x + 22, y + 9); ctx.lineTo(x + 18, y - 4 - flap); ctx.fill();
        ctx.fillStyle = C.gold;
        ctx.beginPath(); ctx.moveTo(x + 2, y + 10); ctx.lineTo(x - 6, y + 12); ctx.lineTo(x + 2, y + 14); ctx.fill();
        ctx.fillStyle = C.danger;
        ctx.fillRect(x + 6, y + 8, 3, 3);
        ctx.strokeStyle = C.magenta; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(x + 17, y + 11, 14, 7, 0, 0, Math.PI * 2); ctx.stroke();
      } else if (e.type === "bat") {
        const flap = Math.sin(e.t * 0.5) * 7;
        ctx.fillStyle = "#6A2A9A";
        ctx.beginPath();
        ctx.moveTo(x, y + 4 + flap); ctx.lineTo(x + 11, y + 8); ctx.lineTo(x + 15, y + 2);
        ctx.lineTo(x + 19, y + 8); ctx.lineTo(x + 30, y + 4 + flap); ctx.lineTo(x + 15, y + 18);
        ctx.fill();
        ctx.fillStyle = "#FFF";
        ctx.fillRect(x + 12, y + 9, 2, 2); ctx.fillRect(x + 17, y + 9, 2, 2);
      } else if (e.type === "hopper") {
        // 跳ねる鬼
        const sq = e.y + e.h > e.baseY - 4 ? 3 : 0;
        ctx.fillStyle = "#8C2440";
        ctx.fillRect(x + 2, y + 4 + sq, 26, 24 - sq);
        ctx.fillStyle = C.gold;
        ctx.beginPath(); ctx.moveTo(x + 5, y + 4 + sq); ctx.lineTo(x + 8, y - 4 + sq); ctx.lineTo(x + 11, y + 4 + sq); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 19, y + 4 + sq); ctx.lineTo(x + 22, y - 4 + sq); ctx.lineTo(x + 25, y + 4 + sq); ctx.fill();
        ctx.fillStyle = "#FFF";
        ctx.fillRect(x + 7, y + 11 + sq, 6, 5); ctx.fillRect(x + 17, y + 11 + sq, 6, 5);
        ctx.fillStyle = "#000";
        ctx.fillRect(x + 7, y + 12 + sq, 3, 4); ctx.fillRect(x + 17, y + 12 + sq, 3, 4);
        ctx.fillStyle = "#FFF";
        ctx.fillRect(x + 9, y + 21 + sq / 2, 3, 3); ctx.fillRect(x + 18, y + 21 + sq / 2, 3, 3);
      } else if (e.type === "ninja") {
        ctx.fillStyle = "#0D0A14";
        ctx.fillRect(x + 6, y + 10, 16, 24);
        ctx.beginPath(); ctx.arc(x + 14, y + 8, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = C.danger;
        ctx.fillRect(x + 6, y + 5, 16, 3);
        ctx.fillRect(x + 20 + Math.sin(f * 0.3) * 2, y + 5, 8, 2);
        ctx.fillStyle = "#FFF";
        ctx.fillRect(x + 8, y + 9, 3, 2); ctx.fillRect(x + 13, y + 9, 3, 2);
        if (e.cd < 20) {
          ctx.fillStyle = "#CFD6E6";
          ctx.fillRect(x + 2, y + 14, 6, 6);
        }
      }
    }

    function drawShuriken(s) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.r);
      ctx.fillStyle = "#CFD6E6";
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(9, 0); ctx.lineTo(0, 2); ctx.fill();
      }
      ctx.fillStyle = "#1A1020";
      ctx.fillRect(-1.5, -1.5, 3, 3);
      ctx.restore();
    }

    function drawWorld() {
      const x0 = state.camX - 120, x1 = state.camX + W + 120;
      for (const l of level.lavas) if (l.x < x1 && l.x + l.w > x0) drawLava(l);
      for (const s of level.solids) if (s.x < x1 && s.x + s.w > x0) drawSolid(s);
      for (const sp of level.spikes) if (sp.x < x1 && sp.x + sp.w > x0) drawSpike(sp);
      level.checkpoints.forEach((cp, i) => { if (i > 0 && cp.x > x0 && cp.x < x1) drawLantern(cp, i, i <= state.checkpoint); });
      if (level.goalX > x0 && level.goalX - 120 < x1) drawTorii(level.goalX);
      for (const c of level.coins) if (!c.got && c.x > x0 && c.x < x1) drawCoin(c);
      for (const f of level.fuels) if (!f.got && f.x > x0 && f.x < x1) drawFuel(f);
      for (const c of level.cnps) if (!c.got && c.x > x0 && c.x < x1) drawCnp(c);
      for (const e of state.enemies) if (e.active && !e.dead) drawEnemy(e);
      for (const s of state.shots) drawShuriken(s);
      ctx.fillStyle = "#FFE27A";
      for (const b of state.bullets) {
        ctx.fillRect(b.x, b.y, 12, 4);
        ctx.fillStyle = "rgba(255,226,122,0.35)";
        ctx.fillRect(b.x - Math.sign(b.vx) * 10, b.y + 1, 10, 2);
        ctx.fillStyle = "#FFE27A";
      }
      if (state.car && (state.phase === "play" || state.phase === "goal")) {
        const blink = state.car.inv > 0 && Math.floor(state.frame / 4) % 2 === 0;
        drawCar(state.car, 1, blink);
      }
      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = "center";
      for (const p of state.pops) {
        ctx.font = C.jfont(16);
        ctx.fillStyle = "#000";
        ctx.fillText(p.text, p.x + 2, p.y + 2);
        ctx.fillStyle = p.color || C.ink;
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.textAlign = "left";
    }

    function drawHud() {
      // スコア
      ctx.font = C.font(12);
      ctx.fillStyle = C.gold;
      ctx.fillText("SCORE", 16, 24);
      ctx.fillStyle = C.ink;
      ctx.fillText(String(state.score).padStart(7, "0"), 16, 42);
      ctx.fillStyle = C.dim;
      ctx.font = C.font(8);
      ctx.fillText("HI " + String(Math.max(hiScore, state.score)).padStart(7, "0"), 16, 58);

      // 咲耶の窓
      if (pilotImg.complete && pilotImg.naturalWidth) {
        let fi = 0;
        if (state.phase === "dying" || state.phase === "over") fi = 1;
        else if (state.portraitTimer > 0) fi = 4;
        else if (state.fuel < 25) fi = 3;
        else if (state.lives <= 1) fi = 2;
        const cr = PILOT_SLOTS[fi];
        ctx.drawImage(pilotImg, cr.x, cr.y, cr.w, cr.h, 16, 66, 88, 66);
        ctx.strokeStyle = "rgba(232,197,106,0.5)";
        ctx.lineWidth = 2;
        ctx.strokeRect(17, 67, 86, 64);
      }

      // CNP ロスター(上段中央)
      const slot = 30, gap = 4;
      const total = CNP.length * slot + (CNP.length - 1) * gap;
      const rx = (W - total) / 2, ry = 10;
      CNP.forEach((ch, i) => {
        const x = rx + i * (slot + gap);
        const got = state.rescued[i];
        ctx.fillStyle = "rgba(4,6,12,0.7)";
        ctx.fillRect(x, ry, slot, slot);
        if (got) drawCnpFigure(ch, x + slot / 2, ry + slot / 2, slot - 2);
        else if (ch.sil) { ctx.globalAlpha = 0.9; ctx.drawImage(ch.sil, x + 1, ry + 1, slot - 2, slot - 2); ctx.globalAlpha = 1; }
        ctx.strokeStyle = got ? `hsl(${ch.hue},80%,60%)` : "rgba(232,197,106,0.35)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, ry + 1, slot - 2, slot - 2);
        if (state.rosterFlash[i] > 0 && Math.floor(state.rosterFlash[i] / 4) % 2 === 0) {
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fillRect(x, ry, slot, slot);
        }
      });
      const got = state.rescued.filter(Boolean).length;
      ctx.font = C.font(8);
      ctx.textAlign = "center";
      ctx.fillStyle = got === CNP.length ? C.magenta : C.gold;
      ctx.fillText(`CNP ${got} / ${CNP.length}`, W / 2, ry + slot + 14);
      ctx.textAlign = "left";

      // 残機と燃料(右上。システムボタンの左)
      const rx2 = W - 280;
      ctx.save();
      const mini = { x: 0, y: 0, vy: 0, facing: 1, squash: 0, wheel: 0 };
      mini.x = rx2 + 12; mini.y = 22 - CAR_H;
      ctx.translate(0, 8);
      drawCar(mini, 0.55);
      ctx.restore();
      ctx.font = C.font(12);
      ctx.fillStyle = C.ink;
      ctx.fillText("×" + Math.max(0, state.lives), rx2 + 62, 30);
      ctx.font = C.font(8);
      ctx.fillStyle = C.gold;
      ctx.fillText("FUEL", rx2 + 4, 50);
      const fw = 120;
      ctx.fillStyle = "rgba(4,6,12,0.8)";
      ctx.fillRect(rx2 + 42, 42, fw, 10);
      const fr = Math.max(0, state.fuel) / 100;
      const low = state.fuel < 25;
      ctx.fillStyle = low ? (Math.floor(state.frame / 10) % 2 ? C.danger : "#7A2010") : fr < 0.5 ? "#F29A4A" : C.gold;
      ctx.fillRect(rx2 + 43, 43, (fw - 2) * fr, 8);
      ctx.strokeStyle = "rgba(232,197,106,0.55)";
      ctx.lineWidth = 1;
      ctx.strokeRect(rx2 + 42.5, 42.5, fw - 1, 9);

      // コース進行バー(下端)
      const px0 = 240, px1 = W - 240, py = H - 12;
      ctx.fillStyle = "rgba(4,6,12,0.6)";
      ctx.fillRect(px0 - 6, py - 7, px1 - px0 + 12, 14);
      ctx.fillStyle = "rgba(232,197,106,0.4)";
      ctx.fillRect(px0, py, px1 - px0, 1);
      const toBar = (wx) => px0 + (px1 - px0) * Math.min(1, wx / level.goalX);
      ZONES.forEach((z) => { ctx.fillStyle = C.gold; ctx.fillRect(toBar(z.x), py - 3, 1, 7); });
      for (const c of level.cnps) {
        if (c.got) continue;
        ctx.fillStyle = `hsl(${CNP[c.idx].hue},80%,60%)`;
        ctx.fillRect(toBar(c.x) - 1, py - 5, 2, 2);
      }
      ctx.fillStyle = C.vermilion;
      ctx.fillRect(px1 - 3, py - 5, 6, 10);
      if (state.car) {
        ctx.fillStyle = C.nounRed;
        ctx.fillRect(toBar(state.car.x) - 3, py - 3, 7, 6);
      }

      // ゾーン名のテロップ
      if (state.caption && state.phase === "play") {
        const z = state.caption.zone;
        const a = Math.min(1, state.caption.t / 20);
        ctx.globalAlpha = a;
        ctx.fillStyle = "rgba(4,6,12,0.82)";
        ctx.fillRect(W / 2 - 170, 150, 340, 78);
        ctx.strokeStyle = "rgba(232,197,106,0.55)";
        ctx.lineWidth = 2;
        ctx.strokeRect(W / 2 - 169, 151, 338, 76);
        ctx.textAlign = "center";
        ctx.font = C.font(10);
        ctx.fillStyle = C.magenta;
        ctx.fillText(z.label + " ─ " + z.en, W / 2, 174);
        ctx.font = C.jfont(28);
        ctx.fillStyle = C.gold;
        ctx.fillText(z.jp, W / 2, 210);
        ctx.textAlign = "left";
        ctx.globalAlpha = 1;
      }
    }

    function drawCrt() {
      if (!drawCrt.pat) {
        const c = document.createElement("canvas");
        c.width = 1; c.height = 3;
        const g = c.getContext("2d");
        g.fillStyle = "rgba(0,0,0,0.28)";
        g.fillRect(0, 0, 1, 1);
        drawCrt.pat = ctx.createPattern(c, "repeat");
        const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.78);
        v.addColorStop(0, "rgba(0,0,0,0)");
        v.addColorStop(1, "rgba(0,0,0,0.5)");
        drawCrt.vig = v;
      }
      ctx.fillStyle = drawCrt.pat; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = drawCrt.vig; ctx.fillRect(0, 0, W, H);
    }

    function panel(x, y, w, h) {
      ctx.fillStyle = "rgba(4,6,12,0.86)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(232,197,106,0.55)";
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    }
    const blinkOn = () => Math.floor(state.frame / 30) % 2 === 0;

    // タイトル: 背景の町を流しつつ、中央で⌐◨-◨カーが跳ね続ける
    const titleCar = makeCar(W / 2 - CAR_W / 2, GROUND_Y - CAR_H);
    function drawTitle() {
      state.camX = (state.frame * 1.2) % 2400;
      drawBackground();
      ctx.fillStyle = "#1C1428";
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      ctx.fillStyle = C.gold;
      ctx.fillRect(0, GROUND_Y, W, 2);
      ctx.fillStyle = "rgba(232,197,106,0.35)";
      for (let dx = -((state.frame * 1.2) % 60); dx < W; dx += 60) ctx.fillRect(dx, GROUND_Y + 22, 30, 3);

      // 跳ねる車(タイトル専用の簡易物理)
      const tc = titleCar;
      tc.vy += 0.35;
      tc.y += tc.vy;
      if (tc.y + CAR_H >= GROUND_Y - 6) { tc.y = GROUND_Y - 6 - CAR_H; tc.vy = -5.6; tc.squash = 1; }
      tc.squash *= 0.82;
      tc.wheel += 0.25;
      drawCar(tc, 2.4);

      ctx.textAlign = "center";
      ctx.font = C.font(40);
      ctx.fillStyle = "#000";
      ctx.fillText("SAKUYA", W / 2 + 4, 96 + 4);
      ctx.fillText("JUMP BUG", W / 2 + 4, 148 + 4);
      ctx.fillStyle = C.gold;
      ctx.fillText("SAKUYA", W / 2, 96);
      ctx.fillStyle = C.nounRed;
      ctx.fillText("JUMP BUG", W / 2, 148);
      ctx.font = C.jfont(20);
      ctx.fillStyle = C.magenta;
      ctx.fillText("─ ⌐◨-◨ カーで CNP 11体を拾ってゴールへ ─", W / 2, 186);

      ctx.font = C.jfont(16);
      ctx.fillStyle = C.ink;
      const lines = isTouch
        ? ["◀ ▶ 加速・減速　　JUMP 長押しで高く跳ぶ　　SHOT 撃つ", "敵は撃つか、上から踏んで倒せる"]
        : ["← → 加速・減速　　SPACE / ↑ 長押しで高く跳ぶ　　X 撃つ", "敵は撃つか、上から踏んで倒せる"];
      ctx.fillText(lines[0], W / 2, 226);
      ctx.fillStyle = C.dim;
      ctx.fillText(lines[1], W / 2, 250);

      if (blinkOn()) {
        ctx.font = C.font(14);
        ctx.fillStyle = C.gold;
        ctx.fillText(isTouch ? "TAP TO START" : "PRESS SPACE / ENTER", W / 2, 300);
      }
      ctx.font = C.font(8);
      ctx.fillStyle = C.dim;
      ctx.fillText("HI " + String(hiScore).padStart(7, "0") + "   PROTOTYPE", W / 2, 322);
      ctx.textAlign = "left";
    }

    function drawResult(title, color) {
      panel(W / 2 - 250, 110, 500, 310);
      ctx.textAlign = "center";
      ctx.font = C.font(28);
      ctx.fillStyle = color;
      ctx.fillText(title, W / 2, 160);
      let y = 200;
      ctx.font = C.jfont(18);
      if (state.bonus) {
        const b = state.bonus;
        const rows = [
          ["燃料ボーナス", b.fuel],
          ["残機ボーナス", b.lives],
          ["CNP全員救出", b.all]
        ];
        for (const [k, v] of rows) {
          ctx.fillStyle = C.dim;
          ctx.textAlign = "left";
          ctx.fillText(k, W / 2 - 180, y);
          ctx.textAlign = "right";
          ctx.fillStyle = v ? C.ink : C.dim;
          ctx.fillText(v ? "+" + v : "─", W / 2 + 180, y);
          y += 26;
        }
        ctx.textAlign = "center";
      }
      ctx.font = C.font(14);
      ctx.fillStyle = C.gold;
      ctx.fillText("SCORE " + String(state.score).padStart(7, "0"), W / 2, y + 12);
      if (state.newRecord && blinkOn()) {
        ctx.font = C.font(10);
        ctx.fillStyle = C.magenta;
        ctx.fillText("NEW RECORD!", W / 2, y + 32);
      }
      // 救出したCNP
      const got = state.rescued.filter(Boolean).length;
      const slot = 34;
      const x0 = W / 2 - (CNP.length * slot) / 2;
      const ry = y + 46;
      CNP.forEach((ch, i) => {
        const x = x0 + i * slot;
        if (state.rescued[i]) drawCnpFigure(ch, x + slot / 2, ry + slot / 2, slot - 4);
        else if (ch.sil) { ctx.globalAlpha = 0.6; ctx.drawImage(ch.sil, x + 2, ry + 2, slot - 4, slot - 4); ctx.globalAlpha = 1; }
      });
      ctx.font = C.jfont(16);
      ctx.fillStyle = got === CNP.length ? C.magenta : C.ink;
      ctx.fillText(got === CNP.length ? "CNP 11体 コンプリート!" : `CNP ${got} / ${CNP.length} 救出`, W / 2, ry + slot + 22);
      if (state.timer > 60 && blinkOn()) {
        ctx.font = C.font(10);
        ctx.fillStyle = C.gold;
        ctx.fillText(isTouch ? "TAP TO RETRY" : "PRESS SPACE / ENTER", W / 2, 410);
      }
      ctx.textAlign = "left";
    }

    function render() {
      ctx.save();
      if (state.phase === "title") {
        drawTitle();
        drawCrt();
        ctx.restore();
        return;
      }
      drawBackground();
      const sx = state.shake ? (Math.random() - 0.5) * state.shake : 0;
      const sy = state.shake ? (Math.random() - 0.5) * state.shake : 0;
      ctx.save();
      ctx.translate(Math.round(-state.camX + sx), Math.round(sy));
      drawWorld();
      ctx.restore();
      drawHud();
      if (state.phase === "clear") drawResult("STAGE CLEAR!", C.gold);
      if (state.phase === "over") drawResult("GAME OVER", C.danger);
      if (state.paused) {
        panel(W / 2 - 120, H / 2 - 40, 240, 80);
        ctx.textAlign = "center";
        ctx.font = C.font(18);
        ctx.fillStyle = C.gold;
        ctx.fillText("PAUSE", W / 2, H / 2 + 8);
        ctx.textAlign = "left";
      }
      drawCrt();
      ctx.restore();
    }

    // ------------------------------------------------------------------
    // ループ(60Hz 固定ステップ。120Hz 画面でも速度が変わらない)
    // ------------------------------------------------------------------
    const STEP = 1000 / 60;
    let last = 0, acc = 0;
    function loop(t) {
      if (!last) last = t;
      let dt = t - last;
      last = t;
      if (dt > 250) dt = 250;
      const blocked = isTouch && portraitMQ.matches;
      if (!state.paused && !blocked) {
        acc += dt;
        let n = 0;
        while (acc >= STEP && n < 5) { tick(); acc -= STEP; n++; }
        if (n === 5) acc = 0;
      }
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ------------------------------------------------------------------
    // 入力
    // ------------------------------------------------------------------
    const shareBtn = document.getElementById("btnShare");
    const muteBtn = document.getElementById("btnMute");
    const pauseBtn = document.getElementById("btnPause");

    function canRestart() {
      return state.phase === "title" || ((state.phase === "over" || state.phase === "clear") && state.timer > 60);
    }
    async function startOrRestart() {
      if (!canRestart()) return;
      await SFX.unlock();
      resetGame();
      BGM.start();
    }
    function setPaused(p) {
      if (!(state.phase === "play" || state.phase === "dying")) p = false;
      state.paused = p;
      if (p) BGM.stop(); else if (state.phase === "play") BGM.start();
      pauseBtn.textContent = p ? "▶" : "II";
    }

    const KEYMAP = {
      ArrowLeft: "left", KeyA: "left",
      ArrowRight: "right", KeyD: "right",
      Space: "jump", ArrowUp: "jump", KeyW: "jump", KeyZ: "jump",
      KeyX: "fire", KeyJ: "fire"
    };
    window.addEventListener("keydown", (e) => {
      const k = KEYMAP[e.code];
      if (k) { input[k] = true; e.preventDefault(); }
      if ((e.code === "Space" || e.code === "Enter") && !e.repeat) startOrRestart();
      if ((e.code === "KeyP" || e.code === "Escape") && !e.repeat) setPaused(!state.paused);
      if (e.code === "KeyM" && !e.repeat) toggleMute();
    });
    window.addEventListener("keyup", (e) => {
      const k = KEYMAP[e.code];
      if (k) { input[k] = false; e.preventDefault(); }
    });
    window.addEventListener("blur", () => {
      for (const k in input) input[k] = false;
      setPaused(true);
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

    // タッチボタン。押している間だけ input を立てる(指がずれても離すまで保持)
    document.querySelectorAll(".pad button").forEach((btn) => {
      const key = btn.dataset.key;
      const on = (e) => {
        e.preventDefault();
        input[key] = true;
        btn.classList.add("on");
        try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 古いブラウザ */ }
        if (key === "jump" || key === "fire") startOrRestart();
      };
      const off = () => { input[key] = false; btn.classList.remove("on"); };
      btn.addEventListener("pointerdown", on);
      btn.addEventListener("pointerup", off);
      btn.addEventListener("pointercancel", off);
      btn.addEventListener("lostpointercapture", off);
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    });
    canvas.addEventListener("pointerdown", () => {
      if (state.paused) { setPaused(false); return; }
      startOrRestart();
    });

    function toggleMute() {
      SFX.unlock();
      SFX.setMuted(!SFX.muted);
      muteBtn.textContent = SFX.muted ? "×" : "♪";
      muteBtn.setAttribute("aria-label", SFX.muted ? "音をオン" : "音をオフ");
    }
    muteBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleMute(); });
    document.getElementById("btnPad").addEventListener("click", (e) => { e.stopPropagation(); setTouchMode(!isTouch); });
    pauseBtn.addEventListener("click", (e) => { e.stopPropagation(); setPaused(!state.paused); });

    shareBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const got = state.rescued.filter(Boolean).length;
      const head = state.phase === "clear" ? "ゴール!" : "GAME OVER…";
      const text = `咲耶ジャンプバグで${head} SCORE ${state.score} / CNP ${got}/11 救出 ⌐◨-◨\n#咲耶ジャンプバグ #CNP`;
      const url = "https://sakuya.naoblock.jp/jumpbug/";
      window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(url), "_blank", "noopener");
    });

    // デバッグ/検証用のフック(本番の遊びには影響しない)
    window.__jumpbug = { state, level, input };
    window.__tick = tick; // 自動テスト用: 1フレーム進める
  </script>
</body>
</html>
